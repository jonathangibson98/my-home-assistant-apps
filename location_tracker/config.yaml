name: Location Tracker
version: "0.5.0"
slug: location_tracker
description: Everyone's City, State via Nominatim
arch: [aarch64, amd64]
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:map-marker-radius
homeassistant_api: true
options:
  sensor_name: sensor.location_tracker
  log_level: INFO
  log_location_updates: true
schema:
  sensor_name: str
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  log_location_updates: bool
