name: Location Tracker
version: "0.4.0"
slug: location_tracker
description: Everyone's City, State via Nominatim
arch: [aarch64, amd64]
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:map-marker-radius
homeassistant_api: true
options:
  sensor_name: sensor.location_tracker
  log_level: INFO
  log_location_updates: true
  entities:
    - label: Jon
      entity_id: device_tracker.jon_phone
      home_state: home
schema:
  sensor_name: str
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  log_location_updates: bool
  entities:
    - label: str
      entity_id: str
      home_state: str?
