configuration:
  sensor_name:
    name: Location sensor name
    description: The name of the "who is home" sensor in Home Assistant, for example Household Locations. Change it and restart the add-on and the sensor is renamed (same entity ID, no duplicate). Renaming on the Location page works too; the last change wins.
  sync_entity_id:
    name: Rename the entity ID with the name
    description: When the sensor name changes, also change its entity ID to match (Household Locations becomes sensor.household_locations). Home Assistant does not update dashboards or automations that use the old ID. Turn off to keep the entity ID you have.
  unique_id:
    name: Location sensor unique ID
    description: Optional. Paste the Unique ID from an old Location Tracker or Location Hub to keep the same sensor. First run only.
  log_level:
    name: Log level
    description: How much detail to write to the log.
  log_location_updates:
    name: Log location updates
    description: Write a log line each time the location sensor changes.
  idle_minutes:
    name: Idle time (minutes)
    description: After a person has stayed at one spot this long, their entry on the location sensor shows what is there (a business name or street address) instead of just the city. Set 0 to turn this off.
  idle_radius_m:
    name: Idle radius (meters)
    description: How far a phone may drift and still count as staying at one spot. GPS jitter is usually under 50 m. Default 100.
  mqtt_host:
    name: MQTT host
    description: Leave blank to use the Mosquitto add-on.
  mqtt_port:
    name: MQTT port
    description: Only used with an MQTT host.
  mqtt_username:
    name: MQTT username
    description: Only used with an MQTT host.
  mqtt_password:
    name: MQTT password
    description: Only used with an MQTT host.
