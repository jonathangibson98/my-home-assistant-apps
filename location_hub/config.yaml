name: "Location Hub"
version: "3.4.0"
slug: location_hub
# Prebuilt images from your GitHub package (built by .github/workflows/create.yml when you push a new version to main).
# Home Assistant fills in {arch}, then downloads this instead of building on the Pi.
image: "ghcr.io/jonathangibson98/{arch}-addon-location_hub"
description: "Everyone's location sensor, switches, device trackers, a dashboard card, arrival sensors for any zone and AI arrival alerts. One add-on, one sidebar entry."
arch:
  - aarch64
  - amd64
init: false
homeassistant: "2025.1.0"

# One sidebar entry. The home page has a tile for each Location and Alerts page.
ingress: true
panel_icon: "mdi:map-marker-radius"
panel_title: "Location Hub"

# Locations, states and services come from Home Assistant itself through the Supervisor proxy.
homeassistant_api: true

# MQTT: the location sensor and device trackers.
services:
  - mqtt:want

# Backups are saved under /share, which is kept when the add-on is uninstalled.
map:
  - share:rw

options:
  sensor_name: "Location Tracker"
  sync_entity_id: true
  unique_id: ""
  log_level: INFO
  log_location_updates: true
  idle_minutes: 10
  idle_radius_m: 100
  backup_path: "/share/location_hub_backups"
  backup_keep: 20
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
schema:
  sensor_name: str
  sync_entity_id: bool
  unique_id: str?
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  log_location_updates: bool
  idle_minutes: int(0,1440)
  idle_radius_m: int(25,2000)
  backup_path: str
  backup_keep: int(1,200)
  mqtt_host: str?
  mqtt_port: int?
  mqtt_username: str?
  mqtt_password: password?
