name: "Location Hub"
version: "1.0.0"
slug: location_hub
description: "Everyone's location, switches, device trackers, dashboard card and AI arrival alerts in one UI"
arch: [aarch64, amd64]
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:map-marker-radius
panel_title: Location Hub
services:
  - mqtt:want
options:
  sensor_name: sensor.location_tracker
  unique_id: ""
  log_level: INFO
  log_location_updates: true
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
schema:
  sensor_name: str
  unique_id: str?
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  log_location_updates: bool
  mqtt_host: str?
  mqtt_port: int?
  mqtt_username: str?
  mqtt_password: password?
