name: "Location Hub"
version: "2.4.1"
slug: location_hub
# Prebuilt images from your GitHub package (built by .github/workflows/create.yml when you push a v* tag).
# Home Assistant fills in {arch}, then downloads this instead of building on the Pi.
image: "ghcr.io/jonathangibson98/{arch}-addon-location_hub"
description: "Location history map with trails, playback and stops, plus everyone's location sensor, switches, device trackers, a dashboard card and AI arrival alerts. One add-on, one sidebar entry."
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant: "2025.1.0"

# One sidebar entry. The map is the home page; Location and Alerts open from its tab bar.
# Large file imports need streaming.
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: "mdi:map-marker-radius"
panel_title: "Location Hub"
panel_admin: true

# Optional read-only map + ingest API for dashboards and other apps.
# Remove the number in the Network section (or turn it off in the map's Settings) to disable.
ports:
  8100/tcp: 8100
ports_description:
  8100/tcp: "Read-only map (and optional ingest API)"

# Locations, states and services come from Home Assistant itself through the Supervisor proxy.
homeassistant_api: true

# Read-only view of /homeassistant so your custom SVG icons can be used as custom:name
map:
  - type: homeassistant_config

# MQTT: the location sensor, device trackers and the map's optional place/distance sensors.
services:
  - mqtt:want

# SQLite history lives in /data: stop the add-on during backups so the database is consistent.
backup: cold

watchdog: "http://[HOST]:[PORT:8099]/health"

options:
  sensor_name: "Location Tracker"
  unique_id: ""
  log_level: INFO
  log_location_updates: true
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
schema:
  sensor_name: str
  unique_id: str?
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  log_location_updates: bool
  mqtt_host: str?
  mqtt_port: int?
  mqtt_username: str?
  mqtt_password: password?
