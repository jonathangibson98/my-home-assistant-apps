<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Location Hub</title>
<style>
:root{--bg1:#0d0d0d;--bg2:#1a1a2e;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.1);--txt:#ececf4;--dim:#9a9ab5;--acc:#ffc24b;--ok:#5be3a4}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--txt);font:16px/1.45 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 14px calc(30px + env(safe-area-inset-bottom,0px))}
main{max-width:980px;margin:0 auto}
h1{font-size:26px;letter-spacing:-.02em;margin:22px 0 2px}
.sub{color:var(--dim);margin:0 0 14px;font-size:14px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:22px 2px 8px;font-weight:700}
.who{display:flex;flex-wrap:wrap;gap:6px;min-height:34px}
.who span{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px}
.who b{font-weight:700}.who em{font-style:normal;color:var(--dim)}.who .home em{color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
a.tile{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;transition:transform .12s,border-color .12s,background .12s}
a.tile:hover,a.tile:focus-visible{border-color:var(--acc);background:rgba(255,194,75,.07);transform:translateY(-1px);outline:none}
a.tile .ic{font-size:24px;line-height:1;display:block;margin-bottom:8px}
a.tile b{display:block;font-size:16px}
a.tile small{display:block;color:var(--dim);font-size:13px;margin-top:2px}
a.tile.big{border-color:rgba(255,194,75,.45)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><main>
<h1>Location Hub</h1>
<p class="sub">Pick a section to open it.</p>
<div class="who" id="who" aria-live="polite"></div>

<div id="groups"></div>

<script>
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// [icon, title, description, link]. Links are relative so this works behind HA ingress.
const GROUPS=[
 ["Map",[
  ["🗺️","Live map","Everyone right now","map#live",1],
  ["🕒","History","Trails, heatmap and playback","map#history"],
  ["🧭","Timeline","Stops and trips for a day","map#timeline"],
  ["📍","Places","Your places and zones, time spent","map#places"],
  ["⚙️","Map settings","Devices, icons, import, backfill, export","map#settings"]]],
 ["Location",[
  ["🔘","Switches","Flip input_boolean and switch entities","hub#loc/switches"],
  ["👥","Devices","Who is home sensor and its people","hub#loc/devices"],
  ["📡","Sensor trackers","Turn sensors into device trackers","hub#loc/trackers"],
  ["🧩","Dashboard card","Generate the Mushroom card YAML","hub#loc/card"]]],
 ["Alerts",[
  ["🔔","Arrival places","Zones, who, timing and style","hub#alerts/places"],
  ["🧑‍🤝‍🧑","People & sensors","Who alerts track, notes for the writer","hub#alerts/people"],
  ["💬","Notifications","AI task, notify service and limits","hub#alerts/notify"],
  ["📜","Activity","Last sent, skipped and previewed alerts","hub#alerts/log"]]]];
document.getElementById("groups").innerHTML=GROUPS.map(([g,tiles])=>
 `<h2>${g}</h2><div class="grid">${tiles.map(([i,t,d,h,big])=>`<a class="tile${big?" big":""}" href="${h}"><span class="ic" aria-hidden="true">${i}</span><b>${esc(t)}</b><small>${esc(d)}</small></a>`).join("")}</div>`).join("");

// Who is where, from the map's live data. Optional: the page works without it.
(async()=>{
  try{
    const r=await fetch("api/state");if(!r.ok)return;
    const s=await r.json(),devs=(s.devices||[]).filter(d=>d.ts);
    document.getElementById("who").innerHTML=devs.map(d=>{
      const at=d.place||"Away";
      return `<span class="${/^home$/i.test(at)?"home":""}"><b>${esc(d.name)}</b> <em>${esc(at)}</em></span>`}).join("");
  }catch(e){}
})();
</script>
</main></body></html>
