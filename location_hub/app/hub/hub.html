<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Location Hub</title>
<meta name="color-scheme" content="dark">
<style>
:root{--bg1:#0d0d0d;--bg2:#1a1a2e;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.1);--txt:#ececf4;--dim:#9a9ab5;--acc:#ffc24b;--bad:#ff6b81;--ok:#5be3a4}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--txt);font:16px/1.45 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 14px 110px}
h1{font-size:26px;letter-spacing:-.02em;margin:22px 0 2px}
.sub{color:var(--dim);margin:0 0 16px;font-size:14px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;position:sticky;top:0;padding:8px 0;background:linear-gradient(var(--bg1),rgba(13,13,13,.85));z-index:5}
nav button{flex:none;background:none;border:1px solid var(--line);color:var(--dim);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px}
nav button.on{background:var(--acc);color:#1a1300;border-color:var(--acc);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.hd{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.hd b{flex:1;font-size:16px}.hd small{display:block;color:var(--dim);font-weight:400;font-size:12px}
.bd{padding:0 14px 14px;border-top:1px solid var(--line)}
label.f{display:block;margin-top:12px;font-size:13px;color:var(--dim)}
input[type=text],input[type=number],input[type=time],select,textarea{width:100%;margin-top:4px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font:inherit}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--txt);font-size:14px}
.chip input{accent-color:var(--acc)}
.hint{color:var(--dim);font-size:12px;margin-top:4px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button.b{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 14px;font:inherit;font-size:14px}
button.b.pri{background:var(--acc);color:#1a1300;border-color:var(--acc);font-weight:700}
button.b.del{color:var(--bad)}
.add{width:100%;border-style:dashed;padding:12px;color:var(--acc)}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;z-index:2}
.sw i{position:absolute;inset:0;background:#3a3a55;border-radius:99px;transition:.15s}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+i{background:var(--acc)}.sw input:checked+i:after{left:21px}
.res{margin-top:12px;padding:12px;border-radius:10px;background:rgba(0,0,0,.4);border-left:3px solid var(--acc);white-space:pre-wrap}
.res.err{border-color:var(--bad);color:var(--bad)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(13,13,13,.92);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;z-index:9}
.bar span{flex:1;color:var(--dim);font-size:14px}.bar button{padding:12px 22px;font-size:16px}
.ev{padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}.ev:last-child{border:0}
.ev small{color:var(--dim)}.k-sent{color:var(--ok)}.k-error{color:var(--bad)}.k-skipped{color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.seg{display:flex;gap:8px;margin:0 0 6px}
.seg button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--dim);padding:12px;border-radius:12px;font:inherit;font-weight:700}
.seg button.on{background:var(--acc);color:#1a1300;border-color:var(--acc)}
.sw.vis{pointer-events:none}
.sw.on i{background:var(--acc)}.sw.on i:after{left:21px}

/* dashboard card tab: live preview, people rows, picture picker */
.pgt{font-size:12px;color:var(--dim);margin:10px 0 6px;font-weight:700;letter-spacing:.02em}
.pg{display:grid;gap:8px}
.pt{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:8px 4px;border-radius:12px;background:rgba(255,255,255,.05);min-width:0}
.pt b{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt small{font-size:11px;color:var(--dim);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt .dot{position:absolute;top:6px;right:calc(50% - 30px);width:12px;height:12px;border-radius:50%;border:2px solid #1a1a2e;background:var(--bad)}
.pt .dot.ok{background:var(--ok)}
.psep{height:2px;background:var(--line);border-radius:2px;margin:2px 0 4px}
.av{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);overflow:hidden;flex:none;font-size:15px}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.lg{width:64px;height:64px}
.cp{display:flex;align-items:center;gap:12px}
.cpm{flex:1;min-width:0}
.avb{position:relative;flex:none;background:none;border:0;padding:0;color:var(--txt);display:flex;flex-direction:column;align-items:center;gap:3px}
.avb .av{width:60px;height:60px}.avb i{font-style:normal;font-size:11px;color:var(--acc)}
.gseg{display:flex;gap:6px;margin-top:8px}
.gseg button{flex:1;background:none;border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:7px 4px;font:inherit;font-size:13px}
.gseg button.on{background:var(--acc);border-color:var(--acc);color:#1a1300;font-weight:700}
details.dt{border-top:1px solid var(--line);padding:0 14px}
details.dt>summary{cursor:pointer;color:var(--dim);font-size:13px;padding:10px 0;list-style:none}
details.dt[open]{padding-bottom:12px}
#picov{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
#picov .bk{position:absolute;inset:0;background:rgba(0,0,0,.6)}
#picov .sheet{position:relative;width:100%;max-width:560px;max-height:86vh;overflow:auto;background:#1a1a2e;border:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px))}
#picov h3{margin:0 0 2px;font-size:18px}
#picov .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-top:8px}
.po{display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(255,255,255,.05);border:2px solid transparent;border-radius:12px;padding:8px 4px;color:var(--txt);min-width:0}
.po.on{border-color:var(--acc)}
.po small{font-size:11px;color:var(--dim);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec{font-size:12px;color:var(--dim);font-weight:700;margin:16px 0 0;letter-spacing:.02em}
label.up{display:inline-block;cursor:pointer;background:var(--acc);color:#1a1300;border:1px solid var(--acc);border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700}
</style></head>
<body>
<!-- ha-theme v1.3.0: copied from .shared/ha-theme.js, edit it there -->
<script>
window.__hbAddon = "location_hub";
/* HA Theme Bridge v1.3.0
 * Makes an add-on web UI follow the active Home Assistant theme (colors, dark/light,
 * dashboard wallpaper, glass blur, card corners and shadows) and updates live when
 * the theme changes. It reads the theme from the Home Assistant page that holds the
 * add-on (ingress runs on the same origin) and remaps this page's own colors to it.
 * Opened outside Home Assistant it does nothing, so the page keeps its own look.
 * Wallpaper, first match wins: the add-on's own "wallpaper" option (Configuration tab), then the
 * shared add-on wallpaper picked in Photo Hub (/local/addon-wallpaper/wallpaper.json), then the theme's.
 * The add-on option:
 *   empty = use the theme's wallpaper, "none" = no wallpaper, or an image:
 *   /local/pic.jpg (= /config/www/pic.jpg), just pic.jpg, /config/www/..., or https://...
 * Readability: over a wallpaper it measures the picture's bright and dark areas and dims (dark
 * themes) or lightens (light themes) it just enough for text to reach a 4.5:1 contrast.
 * Opt out on a page: <html data-ha-theme-off>
 * Variables you can use in new pages: --hb-bg --hb-card --hb-text --hb-text2 --hb-line
 * --hb-primary --hb-accent --hb-on --hb-error --hb-warning --hb-success --hb-field,
 * plus every core HA variable (--primary-color, --card-background-color, ...).
 */
(function () {
  'use strict';
  if (window.__haThemeBridge) return;
  window.__haThemeBridge = 1;
  var doc = document, root = doc.documentElement;
  if (root.hasAttribute('data-ha-theme-off')) return;

  /* ---------- find the Home Assistant window above us ---------- */
  var HA = null;
  try {
    var w = window;
    while (w.parent && w.parent !== w) {
      w = w.parent;
      if (w.document && w.document.querySelector('home-assistant')) HA = w;
    }
  } catch (e) { /* cross-origin parent: stop climbing */ }
  if (!HA) return;
  var nested = window.parent !== HA;

  /* ---------- color helpers ---------- */
  function parse(c) {
    if (!c) return null;
    c = String(c).trim().toLowerCase();
    var m;
    if (c.charAt(0) === '#') {
      var h = c.slice(1);
      if (!/^[0-9a-f]+$/.test(h)) return null;
      if (h.length === 3 || h.length === 4) h = h.replace(/./g, '$&$&');

      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16),

      var f = function (v, alpha) {
        return /%$/.test(v) ? parseFloat(v) * (alpha ? 0.01 : 2.55) : parseFloat(v);
      };

    if (c === 'white') return [255, 255, 255, 1];
    if (c === 'black') return [0, 0, 0, 1];

  }
  function info(c) {
    var r = c[0] / 255, g = c[1] / 255, b = c[2] / 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), ch = mx - mn, h = 0;
    if (ch) {
      if (mx === r) h = ((g - b) / ch) % 6;

    return { l: (mx + mn) / 2, ch: ch, h: h, a: c[3] };

  function isNeutral(i) {
    return i.ch < 0.12 || (i.ch < 0.2 && i.h >= 200 && i.h <= 290 && (i.l < 0.32 || i.l > 0.85));

  function lum(c) { return c ? (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255 : 0; }

    probe.style.color = v;

    return parse(getComputedStyle(probe).color);

  var designScheme = 'dark';

    var el = doc.body || root, cs = getComputedStyle(el);

  /* ---------- color rewriting rules ---------- */
  var COLOR_RE = /#[0-9a-fA-F]{3,8}\b|rgba?\([^)]*\)|\b(?:white|black)\b/g;

  function lastCompound(sel) {
    return (sel || '').split(',').map(function (s) {
      var parts = s.trim().split(/\s*[\s>+~]\s*/);

  function kindOf(sel) {
    var lasts = lastCompound(sel), k = '';
    for (var i = 0; i < lasts.length; i++) {
      var s = lasts[i].toLowerCase();
      if (/^(html|body|:root)\b/.test(s)) return 'page';
      if (/\.(overlay|backdrop|scrim|mask|shade|sheet|modal|lightbox)\b|::backdrop/.test(s)) return 'scrim';
      if (/^(input|select|textarea)\b|\.(input|field-input|textfield)\b/.test(s)) k = k || 'input';
      else if (/^(header|nav|footer)\b|\.(top|topbar|nav|navbar|header|footer|bar|toolbar|appbar|bottom|tabbar|savebar)\b/.test(s)) k = k || 'bar';
      else if (/\.(card|panel|surface|sheet|modal|dialog|popup|menu|toast|drawer|pane|tile)\b|^(dialog|details)\b/.test(s)) k = k || 'card';

  function ctxOf(p) {
    if (/^background(-color|-image)?$/.test(p)) return 'bg';
    if (p === 'color' || p === 'caret-color' || p === '-webkit-text-fill-color' || p === 'text-decoration-color') return 'text';

        if (ctx !== 'bg' || kind === 'scrim') return null;     /* overlays and shadows stay */
        if (i.l < 0.05 && a < 0.5) return { v: 'var(--hb-inset)' };  /* black wash = inset box */
        if (i.l < 0.05) return null;
        if (kind === 'bar' || a > 0.8) return { v: 'var(--hb-bar)', card: true };
        if (kind === 'card' || a > 0.4) return { v: 'var(--hb-card)', card: true };
        return { v: 'var(--hb-inset)' };
      }

      if (ctx === 'line') return { v: 'var(--hb-line)' };
      if (ctx === 'accent') return { v: 'var(--hb-primary)' };
      if (kind === 'page') return { v: 'var(--hb-bg)' };
      if (kind === 'input') return { v: 'var(--hb-field)' };
      if (kind === 'bar') return { v: 'var(--hb-bar)', card: true };
      if (kind === 'card' && t < 0.45) return { v: 'var(--hb-card)', card: true };
      if (at < 0.04) return { v: 'var(--hb-inset)' };
      if (t > 0.6) return null;                                 /* bright chip on dark page: leave */
      return { v: tint('text', clamp(0.03 + at * 0.4, 0.05, 0.16)) };

    }

  }

  var SEM_NAMES = [
    [/^(ok|good|success|live|green|pos|positive)(-?\d)?$/, 'success'],
    [/^(bad|red|danger|err|error|neg|negative)(-?\d)?$/, 'error'],
    [/^(warn|warning|amber)(-?\d)?$/, 'warning'],
    [/^(acc|accent|ac|primary|brand|link)$/, 'primary'],
    [/^(acc|accent|ac|primary)-?2$/, 'accent']

    if (/chip|card-?2|panel-?2|surface-?2|bg-?3|raised|hover|alt|elev/.test(n)) return { v: tint('text', dark ? 0.08 : 0.06) };

    var out = [], re = /var\(\s*(--[\w-]+)/g, m;
    while ((m = re.exec(v || ''))) out.push(m[1]);

  }

  function doStyle(st, sel, scheme) {
    var ref = REFS[scheme], kind = kindOf(sel), names = [], k;
    for (k = 0; k < st.length; k++) names.push(st[k]);
    var solidBg = false, isCard = false;
    names.forEach(function (p) {
      var v = st.getPropertyValue(p), pr = st.getPropertyPriority(p);
      if (p.indexOf('--') === 0) {
        var r = mapVar(p, v, ref);
        pageVars[p] = 1;
        if (r) {
          if (r.card) cardVars[p] = 1;
          if (r.solid) solidVars[p] = 1;
          st.setProperty(p, r.v, pr);
        }
        return;
      }
      var ctx = ctxOf(p);
      if (!ctx || !v) return;
      var nv = v.replace(COLOR_RE, function (tok) {
        var c = parse(tok);
        if (!c) return tok;
        var r = mapColor(c, ctx, ref, kind);
        if (!r) return tok;
        if (ctx === 'bg' && r.solid) solidBg = true;
        if (ctx === 'bg' && r.card) isCard = true;
        return r.v;
      });
      if (nv !== v) st.setProperty(p, nv, pr);
    });
    /* shorthands that mix var() with literal colors only show up on the shorthand itself */

    ov=document.createElement("div");ov.id="picov";document.body.append(ov);

    ov.innerHTML=`<div class="bk" data-act="picclose"></div><div class="sheet">

      <div class="row" style="margin-top:10px"><input type="text" id="piclink" placeholder="or paste a picture link" autocapitalize="none"><button class="b" data-act="uselink" style="flex:none;margin-top:4px">Use link</button></div>
      <div id="picgrids"></div>
      <div class="btns"><button class="b" data-act="picclose">Close</button></div></div>`;
  }

  const opt=(url,label,thumb)=>`<button class="po ${url===cur?"on":""}" data-act="usepic" data-url="${esc(url)}"><span class="av lg">${thumb}</span><small>${esc(label)}</small></button>`;
  const img=u=>`<img src="${esc(u)}" alt="" loading="lazy" onerror="this.remove()">`;

  $("#picgrids").innerHTML=`<div class="sec">AUTOMATIC</div><div class="grid">${opt("","Automatic",`<b>auto</b>`)}</div>

    (d?`${d.people.length?`<div class="sec">HOME ASSISTANT PEOPLE</div><div class="grid">${d.people.map(p=>opt(p.url,p.name,img(p.url))).join("")}</div>`:""}

async function bkDownload(file){
  const r=await fetch(BASE+"api/hub/backup/download"+(file?"?file="+encodeURIComponent(file):""));
  if(!r.ok)throw new Error("HTTP "+r.status);
  const b=await r.blob(),a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=file||("location_hub_backup_"+new Date().toISOString().slice(0,10)+".json");
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
async function bkRestore(body){
  if(dirty.size&&!confirm("You have unsaved changes on other pages. They will be lost. Continue?"))return;
  if(!confirm("Replace your current Location Hub settings with this backup? A safety copy of what you have now is saved first, and the add-on restarts."))return;
  const show=(h,err)=>{const b=$("#bkres");if(b)b.innerHTML=`<div class="res${err?" err":""}">${h}</div>`};
  show("Restoring…");
  try{
    const r=await api("api/hub/backup/restore",Object.assign({options:$("#bkopts")?$("#bkopts").checked:true},body));
    dirty.clear();stat();
    show(`Restored ${esc(bkLine(r.summary))}.\nAdd-on options: ${esc(r.options)}. Safety copy: ${esc(r.safety)}.\n${r.restarting?"The add-on is restarting. This page reloads in a few seconds.":"Restart the add-on to finish."}`);
    if(r.restarting)setTimeout(()=>location.reload(),12000);
  }catch(e){show(esc(e.message),true)}
}
/* ---------- Arrivals ---------- */
const zoneSlug=z=>String(z||"").split(".").slice(1).join(".");
const tgl=(k,v,t,h)=>`<div class="hd" style="padding:12px 0 0;cursor:default"><b>${t}<small>${h}</small></b>${sw(k,v)}</div>`;
function arrPlacesV(){
  const zn=arr.zones.map(z=>[z.id,z.name]),s=arr.settings;
  const intro=`<p class="hint" style="margin:0 0 10px">${s.all_zones?"Every zone already gets a sensor (<b>sensor.arrived_</b> plus the zone name, so Home is <b>sensor.arrived_home</b>). Add a place here only to name groups of people, or to turn one zone off.":"Only the places below get a sensor. Turn on <b>Track every zone</b> in Settings to cover all zones."} A group name is the sensor state when exactly those people arrive together within the group window.`;
  const cards=arr.places.map((p,i)=>{
    const o=open.has(p.id),K=f=>`arr.places.${i}.${f}`;
    const zname=(arr.zones.find(z=>z.id===p.zone)||{}).name||p.zone||"New place";
    return `<div class="card"><div class="hd" data-tog="${esc(p.id)}"><b>${esc(zname)}<small>sensor.arrived_${esc(zoneSlug(p.zone))}${p.combos.length?` · ${p.combos.length} group${p.combos.length===1?"":"s"}`:""}</small></b>${sw(K("enabled"),p.enabled)}</div>
    ${o?`<div class="bd">
      ${fld("Zone",sel(K("zone"),zn,p.zone),"Zones come from Settings → Areas, labels &amp; zones → Zones. Each zone can be added once.")}
      <label class="f">Group names (optional)</label>
      ${p.combos.map((c,j)=>`<div class="card" style="margin-top:8px"><div class="bd" style="border:0">
        ${fld("Sensor state for exactly these people",inp(`${K("combos")}.${j}.name`,c.name,"text",'autocapitalize="none" placeholder="alex_sam_home"'))}
        <div class="chips">${arr.people.map(x=>`<label class="chip"><input type="checkbox" data-cp="${i}.${j}" value="${esc(x.id)}" ${c.people.includes(x.id)?"checked":""}>${esc(x.label)}</label>`).join("")||'<span class="hint">Add people on Location → Devices first.</span>'}</div>
        <div class="btns"><button class="b del" data-act="arr-delcombo" data-i="${i}" data-j="${j}">Remove group</button></div></div></div>`).join("")}
      <div class="btns"><button class="b" data-act="arr-addcombo" data-i="${i}">Add a group</button><button class="b del" data-act="arr-delplace" data-i="${i}">Remove place</button></div>
    </div>`:""}</div>`}).join("");
  return intro+cards+`<button class="b add" data-act="arr-addplace">Add a place</button>`;
}
function arrSettingsV(){
  const s=arr.settings,K=f=>`arr.settings.${f}`;
  return `<div class="card"><div class="bd" style="border:0">
    ${tgl(K("enabled"),s.enabled,"Arrival tracking","Master switch. Off stops new arrivals.")}
    ${tgl(K("all_zones"),s.all_zones,"Track every zone","Each zone in Home Assistant gets its own sensor. Off: only the places you add.")}
    ${tgl(K("latest_sensor"),s.latest_sensor,"Latest arrival sensor","sensor.latest_arrival shows the newest arrival at any zone.")}
    ${tgl(K("fire_events"),s.fire_events,"Fire an event on every arrival","Sends location_hub_arrival to Home Assistant, handy as an automation trigger.")}
    ${fld("Group window (seconds)",inp(K("window_seconds"),s.window_seconds,"number",'min="5" inputmode="numeric"'),"People who arrive at the same place within this time count as one group.")}
    ${fld("Clear after (seconds)",inp(K("reset_after_seconds"),s.reset_after_seconds,"number",'min="5" inputmode="numeric"'),"After this long with no new arrival, the sensor goes back to &quot;no one arriving&quot;.")}
    <div class="hint">People come from Location → Devices. If the old AppDaemon app still runs, turn it off so it does not fight over sensor.arrived_home.</div>
  </div></div>`;
}
const arrLiveV=()=>`<p class="hint" style="margin:0 0 10px">Current state of each arrival sensor. Test makes a pretend arrival for the people ticked (the first person if none) and shows it until the clear time.</p><div id="arrbox"><div class="card"><div class="ev">Loading…</div></div></div><div class="card" id="arrlog"></div>`;
async function loadArrLive(){
  if(tab!=="arr_live"||!$("#arrbox"))return;
  try{
    const d=await api("api/hub/arrivals/live");
    if(tab!=="arr_live"||!$("#arrbox"))return;
    const head=`<div class="card"><div class="ev"><b>Latest arrival</b> <small>sensor.latest_arrival</small><br>${esc(d.latest.state)}${(d.latest.attrs.place?` at ${esc(d.latest.attrs.place)}`:"")}${d.connected?"":'<br><small>Not connected to Home Assistant yet.</small>'}${d.mqtt?"":'<br><small>MQTT is not connected, so sensors use the plain fallback (no unique ID).</small>'}</div></div>`;
    $("#arrbox").innerHTML=head+(d.live.length?d.live.map(x=>`<div class="card"><div class="ev"><b>${esc(x.name)}</b> <small>${esc(x.sensor)}</small><br>${esc(x.state)}<br><small>Here now: ${x.here.length?esc(x.here.join(", ")):"nobody"}</small>
      <div class="chips">${d.people.map(pp=>`<label class="chip"><input type="checkbox" data-tp="${esc(x.zone)}" value="${esc(pp.id)}">${esc(pp.label)}</label>`).join("")}</div>
      <div class="btns" style="margin-top:8px"><button class="b" data-act="arr-test" data-zone="${esc(x.zone)}">Test arrival</button></div></div></div>`).join(""):`<div class="card"><div class="ev">No zones tracked yet.</div></div>`);
    $("#arrlog").innerHTML=d.log.length?d.log.map(e=>`<div class="ev"><b>${esc(e.place)}</b> <span class="k-${e.kind==="arrival"?"sent":"skipped"}">${esc(e.kind)}</span> <small>${esc(e.t)}</small><br>${esc(e.msg)}</div>`).join(""):`<div class="ev">Nothing yet. Arrivals show up here.</div>`;
  }catch(e){const b=$("#arrbox");if(b)b.innerHTML=`<div class="card"><div class="ev">Could not load: ${esc(e.message)}</div></div>`}
}
const VIEWS={arr_places:arrPlacesV,arr_settings:arrSettingsV,arr_live:arrLiveV,backup:backupV,switches:switchesV,devices:devicesV,trackers:trackersV,card:cardV,places:placesV,people:peopleV,notify:notifyV,log:logV};


function setPath(path,val){
  const k=path.split("."),isLoc=k[0]==="loc",isArr=k[0]==="arr",ks=(isLoc||isArr)?k.slice(1):k;let o=isLoc?loc:isArr?arr:cfg;
  for(let i=0;i<ks.length-1;i++)o=o[ks[i]];
  o[ks[ks.length-1]]=val;mark(isLoc?ks[0]:isArr?"arrivals":"alerts");
  if(path.startsWith("loc.card"))cardSoon();
}
async function save(quiet){
  const had=new Set(dirty);
  try{
    if(had.has("alerts"))await api("api/hub/config",cfg);
    if(had.has("devices"))await api("api/hub/devices",{entities:loc.devices.filter(d=>(d.label||"").trim()&&(d.entity_id||"").trim()).map(d=>({label:d.label.trim(),entity_id:d.entity_id.trim(),home_state:(d.home_state||"").trim()}))});
    if(had.has("settings"))await api("api/hub/settings",{name:(loc.settings.name||"").trim(),entity_id:(loc.settings.entity_id||"").trim()});
    if(had.has("trackers"))await api("api/hub/trackers",{trackers:loc.trackers});
    if(had.has("card"))await api("api/hub/card",loc.card);
    if(had.has("arrivals")){await api("api/hub/arrivals",{settings:arr.settings,places:arr.places});await loadArr()}
    dirty.clear();stat();
    if([...had].some(g=>g!=="alerts")){await loadLoc();render()}
    if(!quiet)toast("Saved");
  }catch(e){toast("Save failed: "+e.message);throw e}
}

document.addEventListener("input",e=>{const t=e.target;if(t.dataset.k){setPath(t.dataset.k,t.type==="number"?Number(t.value):t.type==="checkbox"?t.checked:t.value)}});
document.addEventListener("change",e=>{
  const t=e.target,d=t.dataset;
  if(t.id==="bkfile"&&t.files[0]){
    t.files[0].text().then(txt=>{let o;try{o=JSON.parse(txt)}catch(err){toast("That file is not valid JSON");return}bkRestore({data:o})});
    t.value="";return;
  }
  if(t.id==="picfile"&&t.files[0]){picUpload(t.files[0]);t.value="";return}
  if(d.k&&t.type==="checkbox")setPath(d.k,t.checked);
  if(d.k&&/^arr\.places\.\d+\.zone$/.test(d.k))render();
  if(d.cp!==undefined){
    const [pi,pj]=d.cp.split(".").map(Number),c=arr.places[pi].combos[pj];
    c.people=t.checked?[...new Set([...c.people,t.value])]:c.people.filter(x=>x!==t.value);mark("arrivals");
  }
  if(d.who!==undefined||d.day!==undefined){
    const i=d.who??d.day,f=d.who!==undefined?"who":"days",v=d.who!==undefined?t.value:Number(t.value),a=cfg.places[i][f];
    cfg.places[i][f]=t.checked?[...a,v]:a.filter(x=>x!==v);mark("alerts");
    if(f==="who")render();
  }
});
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-nav],[data-sec],[data-tab],[data-tog],[data-act]");if(!t||e.target.closest(".sw:not(.vis)"))return;
  const d=t.dataset;
  if(d.nav!==undefined){if(dirty.size&&!confirm("You have unsaved changes. Leave without saving?"))return;location.href=BASE+d.nav;return}
  if(d.sec){sec=d.sec;tab=mem[sec];render();return}
  if(d.tab){tab=d.tab;mem[sec]=tab;render();return}
  if(d.tog){open.has(d.tog)?open.delete(d.tog):open.add(d.tog);render();return}
  const i=+d.i;
  if(d.act==="tg"){
    const s=t.querySelector(".sw");if(s)s.classList.toggle("on");busy=true;
    try{await api("api/hub/toggle",{entity_id:d.eid})}catch(err){toast("Could not toggle "+d.eid)}
    busy=false;setTimeout(loadSwitches,500);
  }
  if(d.act==="bk-save"){
    const b=$("#bkres");b.innerHTML='<div class="res">Saving…</div>';
    try{const r=await api("api/hub/backup/save",{});b.innerHTML=`<div class="res">Saved <b>${esc(r.file)}</b> to ${esc(r.path)}\n${esc(bkLine(r.summary))}</div>`;loadBackup()}
    catch(err){b.innerHTML=`<div class="res err">${esc(err.message)}</div>`}
  }
  if(d.act==="bk-dl"||d.act==="bk-get")bkDownload(d.file).catch(err=>toast("Download failed: "+err.message));
  if(d.act==="bk-restore")bkRestore({file:d.file});
  if(d.act==="bk-pick")$("#bkfile").click();
  if(d.act==="arr-addplace"){
    const used=new Set(arr.places.map(p=>p.zone)),z=arr.zones.find(z=>!used.has(z.id));
    if(!z){toast("Every zone is already added");return}
    const np={id:uid(),zone:z.id,enabled:true,combos:[]};arr.places.push(np);open.add(np.id);mark("arrivals");render();
  }
  if(d.act==="arr-delplace"&&confirm(arr.settings.all_zones?"Remove this place? Its group names are lost. The zone keeps its sensor because Track every zone is on.":"Remove this place? Its sensor is deleted from Home Assistant when you save.")){arr.places.splice(i,1);mark("arrivals");render()}
  if(d.act==="arr-addcombo"){arr.places[i].combos.push({name:"",people:[]});mark("arrivals");render()}
  if(d.act==="arr-delcombo"){arr.places[i].combos.splice(+d.j,1);mark("arrivals");render()}
  if(d.act==="arr-test"){
    const ids=[...document.querySelectorAll('input[data-tp]:checked')].filter(x=>x.dataset.tp===d.zone).map(x=>x.value);
    try{const r=await api("api/hub/arrivals/test",{zone:d.zone,people:ids});toast("Test arrival: "+r.state);loadArrLive()}
    catch(err){toast("Test failed: "+err.message)}
  }
  if(d.act==="pickpic")openPicker(i);
  if(d.act==="picclose")closePicker();
  if(d.act==="usepic")choosePic(d.url);
  if(d.act==="uselink"){const v=($("#piclink").value||"").trim();if(!v){pic.msg="Paste a picture link first.";showPicker()}else choosePic(v)}
  if(d.act==="grp"){loc.card.rows[i].group=d.g;mark("card");render();cardSoon()}
  if(d.act==="adddev"){loc.devices.push({label:"",entity_id:"",home_state:""});mark("devices");render()}
  if(d.act==="deld"&&confirm("Remove this device?")){loc.devices.splice(i,1);mark("devices");render()}
  if(d.act==="addtrk"){loc.trackers.push({id:"",label:"",entity_id:"",home_state:"",toggle:false,tracker_id:""});mark("trackers");render()}
  if(d.act==="delt"&&confirm("Remove this tracker? Its device_tracker is deleted from Home Assistant when you save.")){loc.trackers.splice(i,1);mark("trackers");render()}
  if(d.act==="copy"){
    const ta=$("#yaml");ta.select();const done=()=>toast("Card YAML copied");
    if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(ta.value).then(done,()=>{document.execCommand("copy");done()});
    else{document.execCommand("copy");done()}
  }
  if(d.act==="addplace"){const p={id:uid(),enabled:true,name:"New place",zone:(ent.zones[0]||{}).id||"",who:[],mode:"any",dwell:5,title:"",extra:"",days:[],start:"",end:"",custom_prompt:""};cfg.places.push(p);open.add(p.id);mark("alerts");render()}
  if(d.act==="dup"){const p=JSON.parse(JSON.stringify(cfg.places[i]));p.id=uid();p.name+=" (copy)";cfg.places.splice(i+1,0,p);open.add(p.id);mark("alerts");render()}
  if(d.act==="del"&&confirm("Delete this place?")){cfg.places.splice(i,1);mark("alerts");render()}
  if(d.act==="addperson"){cfg.people.push({id:uid(),name:"",entity_id:"",notes:""});mark("alerts");render()}
  if(d.act==="delp"&&confirm("Remove this person?")){const id=cfg.people[i].id;cfg.people.splice(i,1);cfg.places.forEach(p=>p.who=p.who.filter(x=>x!==id));mark("alerts");render()}
  if(d.act==="reload")loadLog();
  if(d.act==="prev"||d.act==="send"){
    const p=cfg.places[i],show=h=>{const b=$("#res-"+p.id);if(b)b.innerHTML=h};
    show('<div class="res">Working on it…</div>');
    try{await save(true);const r=await api("api/hub/test",{id:p.id,send:d.act==="send"});
      show(`<div class="res"><b>${esc(r.title)}</b>\n${esc(r.message)}${r.fallback?"\n\n(AI failed, so this is the fallback message.)":""}</div>`)}
    catch(err){show(`<div class="res err">${esc(err.message)}</div>`)}
  }
});
$("#save").onclick=()=>save().catch(()=>{});
setInterval(loadSwitches,5000);
init().catch(e=>{$("#view").innerHTML=`<div class="res err">Could not load: ${esc(e.message)}</div>`});
</script></body></html>
