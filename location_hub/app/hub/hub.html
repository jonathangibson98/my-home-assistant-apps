<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Location Hub</title>
<meta name="color-scheme" content="dark">
<style>
:root{--bg1:#0d0d0d;--bg2:#1a1a2e;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.1);--txt:#ececf4;--dim:#9a9ab5;--acc:#ffc24b;--bad:#ff6b81;--ok:#5be3a4}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--txt);font:16px/1.45 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 14px 110px}
h1{font-size:26px;letter-spacing:-.02em;margin:22px 0 2px}
.sub{color:var(--dim);margin:0 0 16px;font-size:14px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;position:sticky;top:0;padding:8px 0;background:linear-gradient(var(--bg1),rgba(13,13,13,.85));z-index:5}
nav button{flex:none;background:none;border:1px solid var(--line);color:var(--dim);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px}
nav button.on{background:var(--acc);color:#1a1300;border-color:var(--acc);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.hd{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.hd b{flex:1;font-size:16px}.hd small{display:block;color:var(--dim);font-weight:400;font-size:12px}
.bd{padding:0 14px 14px;border-top:1px solid var(--line)}
label.f{display:block;margin-top:12px;font-size:13px;color:var(--dim)}
input[type=text],input[type=number],input[type=time],select,textarea{width:100%;margin-top:4px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font:inherit}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--txt);font-size:14px}
.chip input{accent-color:var(--acc)}
.hint{color:var(--dim);font-size:12px;margin-top:4px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button.b{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 14px;font:inherit;font-size:14px}
button.b.pri{background:var(--acc);color:#1a1300;border-color:var(--acc);font-weight:700}
button.b.del{color:var(--bad)}
.add{width:100%;border-style:dashed;padding:12px;color:var(--acc)}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;z-index:2}
.sw i{position:absolute;inset:0;background:#3a3a55;border-radius:99px;transition:.15s}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+i{background:var(--acc)}.sw input:checked+i:after{left:21px}
.res{margin-top:12px;padding:12px;border-radius:10px;background:rgba(0,0,0,.4);border-left:3px solid var(--acc);white-space:pre-wrap}
.res.err{border-color:var(--bad);color:var(--bad)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(13,13,13,.92);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;z-index:9}
.bar span{flex:1;color:var(--dim);font-size:14px}.bar button{padding:12px 22px;font-size:16px}
.ev{padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}.ev:last-child{border:0}
.ev small{color:var(--dim)}.k-sent{color:var(--ok)}.k-error{color:var(--bad)}.k-skipped{color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.seg{display:flex;gap:8px;margin:0 0 6px}
.seg button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--dim);padding:12px;border-radius:12px;font:inherit;font-weight:700}
.seg button.on{background:var(--acc);color:#1a1300;border-color:var(--acc)}
.sw.vis{pointer-events:none}
.sw.on i{background:var(--acc)}.sw.on i:after{left:21px}
</style></head>
<body>
<h1>Location Hub</h1>
<p class="sub" id="sub"></p>
<div class="seg" id="seg"></div>
<nav id="nav"></nav>
<main id="view"></main>
<div class="bar"><span id="stat">Loading…</span><button class="b pri" id="save">Save changes</button></div>
<datalist id="trk"></datalist><datalist id="tap"></datalist>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const SECS={loc:["Location",[["switches","Switches"],["devices","Devices"],["trackers","Sensor trackers"],["card","Dashboard card"]]],
 alerts:["Alerts",[["places","Places"],["people","People & sensors"],["notify","Notifications"],["log","Activity"]]],
 arrivals:["Arrivals",[["arr_places","Places"],["arr_settings","Settings"],["arr_live","Live"]]],
 backup:["Backup",[["backup","Backup & restore"]]]};
const SUBS={loc:"Where everyone is, what is switched on, and your dashboard card.",alerts:"Pick the places, pick who triggers them, pick how the message sounds.",arrivals:"Sensors that show who just arrived at any zone, not only home.",backup:"Save everything this add-on keeps, or restore it after a reinstall."};
let cfg,arr={settings:{},places:[],people:[],zones:[]},loc={settings:{},devices:[],trackers:[],card:{rows:[]}},ent={zones:[],trackable:[],ai:[],notify:[],toggles:[],location_sensor:""};
const hp=location.hash.slice(1).split("/");
let sec=SECS[hp[0]]?hp[0]:"loc",tab=(SECS[sec][1].some(t=>t[0]===hp[1])?hp[1]:null)||"switches",open=new Set(),dirty=new Set(),busy=false;
const mem={loc:"switches",alerts:"places",arrivals:"arr_places",backup:"backup"};
if(!SECS[sec][1].some(t=>t[0]===tab))tab=mem[sec];
mem[sec]=tab;
const uid=()=>Math.random().toString(36).slice(2,9);
const stat=()=>{$("#stat").textContent=dirty.size?"Unsaved changes":"All saved"};
const mark=g=>{dirty.add(g);stat()};
const toast=m=>{$("#stat").textContent=m;setTimeout(stat,2500)};
const dl=l=>l.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("");

// Works behind HA ingress whether the page is opened as .../hub or .../hub/
const BASE=location.pathname.replace(/hub\/?$/,"");
async function api(path,body){
  const r=await fetch(BASE+path,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:undefined);
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||j.status||("HTTP "+r.status));
  return j;
}
async function loadLoc(){
  const r=await Promise.all(["api/hub/settings","api/hub/devices","api/hub/trackers","api/hub/card"].map(u=>api(u)));
  loc={settings:r[0],devices:r[1],trackers:r[2],card:r[3]};
}
async function loadArr(){arr=await api("api/hub/arrivals")}
async function init(){
  const r=await Promise.all([api("api/hub/config"),loadLoc(),loadArr()]);cfg=r[0];
  try{ent=Object.assign(ent,await api("api/hub/entities"))}catch(e){}
  $("#trk").innerHTML=dl(ent.trackable);$("#tap").innerHTML=dl(ent.trackable.concat(ent.toggles||[]));
  dirty.clear();stat();render();
}
function render(){
  $("#sub").textContent=SUBS[sec];
  $("#seg").innerHTML=`<button data-nav="">Home</button>`+Object.entries(SECS).map(([k,v])=>`<button data-sec="${k}" class="${k===sec?"on":""}">${v[0]}</button>`).join("");
  $("#nav").innerHTML=SECS[sec][1].map(([k,l])=>`<button data-tab="${k}" class="${k===tab?"on":""}">${l}</button>`).join("");
  $("#view").innerHTML=VIEWS[tab]();
  $(".bar").style.display=sec==="backup"?"none":"";
  if(tab==="backup")loadBackup();
  if(tab==="log")loadLog();
  if(tab==="switches")loadSwitches();
  if(tab==="arr_live")loadArrLive();
}

const fld=(l,inner,hint)=>`<label class="f">${l}${inner}${hint?`<div class="hint">${hint}</div>`:""}</label>`;
const inp=(k,v,t="text",x="")=>`<input type="${t}" data-k="${k}" value="${esc(v)}" ${x}>`;
const sel=(k,opts,v)=>{if(v&&!opts.some(o=>o[0]===v))opts=[[v,v],...opts];return `<select data-k="${k}">${opts.map(([a,b])=>`<option value="${esc(a)}" ${a===v?"selected":""}>${esc(b)}</option>`).join("")}</select>`};
const sw=(k,v)=>`<span class="sw" onclick="event.stopPropagation()"><input type="checkbox" data-k="${k}" ${v?"checked":""}><i></i></span>`;

function placesV(){
  const zn=ent.zones.map(z=>[z.id,z.name]);
  const cards=cfg.places.map((p,i)=>{
    const o=open.has(p.id),K=f=>`places.${i}.${f}`;
    const who=p.who.length?p.who.map(id=>(cfg.people.find(x=>x.id===id)||{}).name||id).join(", "):"anyone tracked";
    return `<div class="card"><div class="hd" data-tog="${p.id}"><b>${esc(p.name||"New place")}<small>${esc(who)}</small></b>${sw(K("enabled"),p.enabled)}</div>
    ${o?`<div class="bd">
      ${fld("Name",inp(K("name"),p.name))}
      ${fld("Zone",sel(K("zone"),zn,p.zone),"Zones come from Settings → Areas, labels & zones → Zones.")}
      <label class="f">Who triggers it</label>
      <div class="chips">${cfg.people.map(x=>`<label class="chip"><input type="checkbox" data-who="${i}" value="${x.id}" ${p.who.includes(x.id)?"checked":""}>${esc(x.name)}</label>`).join("")||'<span class="hint">Add people in the People tab first.</span>'}</div>
      <div class="hint">Nobody selected means anyone you track.</div>
      ${fld("Send when",sel(K("mode"),[["any","Any selected person arrives"],["all","All selected people are there"]],p.mode))}
      ${fld("Wait before sending (seconds)",inp(K("dwell"),p.dwell,"number",'min="0" inputmode="numeric"'),"Stops drive-by false alarms.")}
      <label class="f">Only on these days</label>
      <div class="chips">${DAYS.map((d,n)=>`<label class="chip"><input type="checkbox" data-day="${i}" value="${n}" ${p.days.includes(n)?"checked":""}>${d}</label>`).join("")}</div>
      <div class="hint">None selected means every day.</div>
      <div class="row">${fld("From",inp(K("start"),p.start,"time"))}${fld("Until",inp(K("end"),p.end,"time"))}</div>
      ${fld("Notification title",inp(K("title"),p.title),"Use {who}, {place} and {present} to fill in names.")}
      ${fld("Extra details for the message",`<textarea data-k="${K("extra")}">${esc(p.extra)}</textarea>`,"Example: Include our friends Jordan and Drew.")}
      ${fld("Custom style for this place",`<textarea data-k="${K("custom_prompt")}">${esc(p.custom_prompt)}</textarea>`,"Leave blank to use the global style.")}
      <div class="btns"><button class="b" data-act="prev" data-i="${i}">Preview</button><button class="b" data-act="send" data-i="${i}">Send test</button><button class="b" data-act="dup" data-i="${i}">Duplicate</button><button class="b del" data-act="del" data-i="${i}">Delete</button></div>
      <div id="res-${p.id}"></div></div>`:""}</div>`}).join("");
  return cards+`<button class="b add" data-act="addplace">Add a place</button>`;
}
function peopleV(){
  return `<p class="hint" style="margin:0 0 10px">Track anything whose state shows a zone name: a person, a device tracker, or a sensor.</p>`+
  cfg.people.map((p,i)=>`<div class="card"><div class="bd" style="border:0">
    ${fld("Name",inp(`people.${i}.name`,p.name))}
    ${fld("Entity",inp(`people.${i}.entity_id`,p.entity_id,"text",'list="trk" autocapitalize="none" placeholder="person.alex"'))}
    ${fld("Notes for the message writer",`<textarea data-k="people.${i}.notes">${esc(p.notes)}</textarea>`,"Optional. Quirks, jokes, nicknames.")}
    <div class="btns"><button class="b del" data-act="delp" data-i="${i}">Remove</button></div></div></div>`).join("")+
  `<button class="b add" data-act="addperson">Add a person or sensor</button>`;
}
function notifyV(){
  const s=cfg.settings,K=f=>`settings.${f}`;
  return `<div class="card"><div class="hd"><b>Notifications on<small>Switch off to pause every place</small></b>${sw(K("enabled"),s.enabled)}</div></div>
  <div class="card"><div class="hd"><b>Mention who's already there<small>The message calls out anyone already at the place</small></b>${sw(K("mention_present"),s.mention_present!==false)}</div></div>
  <div class="card"><div class="bd" style="border:0">
    ${fld("AI task entity",sel(K("ai_entity"),ent.ai.map(a=>[a,a]),s.ai_entity))}
    ${fld("Notify service",sel(K("notify_service"),ent.notify.map(a=>[a,a]),s.notify_service))}
    <div class="row">${fld("Max characters",inp(K("max_chars"),s.max_chars,"number",'min="40"'))}${fld("Cooldown (minutes)",inp(K("cooldown_min"),s.cooldown_min,"number",'min="0"'))}</div>
    ${fld("Timezone",inp(K("timezone"),s.timezone,"text",'autocapitalize="none"'))}
    ${fld("Global style",`<textarea style="min-height:130px" data-k="${K("style")}">${esc(s.style)}</textarea>`,"How every message should sound.")}
    ${fld("Fallback message",inp(K("fallback"),s.fallback),"Sent if the AI task fails. Use {who} and {place}.")}
  </div></div>
  <div class="card"><div class="bd" style="border:0">
    <b>Household context</b>
    ${fld("Context sensor",inp(K("context_entity"),s.context_entity,"text",'autocapitalize="none"'))}
    ${fld("Context attribute",inp(K("context_attribute"),s.context_attribute,"text",'autocapitalize="none"'))}
    ${fld("Locations sensor",inp(K("locations_entity"),s.locations_entity,"text",'autocapitalize="none" placeholder="'+esc(ent.location_sensor)+'"'),"Leave blank to use this add-on's own Location sensor ("+esc(ent.location_sensor)+").")}
  </div></div>`;
}
const logV=()=>`<div class="card" id="logbox"><div class="ev">Loading…</div></div><button class="b add" data-act="reload">Refresh</button>`;
async function loadLog(){
  const l=await api("api/hub/log").catch(()=>[]);
  $("#logbox").innerHTML=l.length?l.map(e=>`<div class="ev"><b>${esc(e.place)}</b> <span class="k-${e.kind}">${e.kind}</span> <small>${e.t}</small><br>${esc(e.msg)}</div>`).join(""):`<div class="ev">Nothing yet. Alerts show up here after the first arrival.</div>`;
}


/* ---------- Location: switches ---------- */
const switchesV=()=>`<p class="hint" style="margin:0 0 10px">Tap to flip an entity in Home Assistant. Applies instantly, no save needed. Lists card people whose tap entity is an input_boolean or switch, plus sensor trackers with "Show as switch" on.</p><div id="swbox"><div class="card"><div class="ev">Loading…</div></div></div>`;
async function loadSwitches(){
  if(busy||tab!=="switches"||!$("#swbox"))return;
  try{
    const l=await api("api/hub/switches");
    if(busy||tab!=="switches"||!$("#swbox"))return;
    $("#swbox").innerHTML=l.length?l.map(it=>{
      const on=it.state==="on",gone=it.state==="unavailable"||it.state==="unknown";
      return `<div class="card"><div class="hd" data-act="tg" data-eid="${esc(it.entity_id)}" style="${gone?"opacity:.5":""}"><b>${esc(it.label||it.entity_id)}<small>${esc(it.entity_id)} (${esc(it.state)})</small></b><span class="sw vis${on?" on":""}"><i></i></span></div></div>`}).join("")
      :`<div class="card"><div class="ev">No switches yet. Give a card person an input_boolean tap entity, or turn on "Show as switch" for a sensor tracker, then save.</div></div>`;
  }catch(e){}
}
/* ---------- Location: devices ---------- */
function devicesV(){
  const s=loc.settings;
  return `<div class="card"><div class="bd" style="border:0">
    ${fld("Sensor name",inp("loc.settings.name",s.name,"text",'placeholder="e.g. Household Locations"'),"Display name of the main location sensor in Home Assistant. You can also set it in the add-on's Configuration tab (after a restart). Whichever you changed last wins. Renaming never creates a duplicate.")}
    ${fld("Entity ID",inp("loc.settings.entity_id",s.entity_id,"text",'autocapitalize="none" placeholder="sensor.household_locations"'),"Changing the name also renames this to match (turn that off with the <b>sync_entity_id</b> option). Or type your own and save. Home Assistant does not update dashboards or automations that use the old ID.")}
    ${s.sync_error?`<div class="hint" style="color:#ff8a80">Home Assistant did not accept the entity ID: ${esc(s.sync_error)}</div>`:(s.ha_entity_id_checked?`<div class="hint" style="color:#5be3a4">Home Assistant is using ${esc(s.entity_id)}</div>`:"")}
    <div class="hint">Unique ID: ${esc(s.unique_id)} · Mode: ${esc(s.mode)}</div></div></div>
  <p class="hint" style="margin:0 0 10px">One row per person. The sensor's state is how many are home; anyone away shows as City, State.</p>`+
  loc.devices.map((d,i)=>`<div class="card"><div class="bd" style="border:0">
    <div class="row">${fld("Label",inp(`loc.devices.${i}.label`,d.label,"text",'placeholder="Alex"'))}${fld("Entity",inp(`loc.devices.${i}.entity_id`,d.entity_id,"text",'list="trk" autocapitalize="none" placeholder="device_tracker.alex_phone"'))}</div>
    ${fld("Home state override (optional)",inp(`loc.devices.${i}.home_state`,d.home_state,"text",'autocapitalize="none" placeholder="home"'),"Only if the entity reports something other than home, like on or present.")}
    <div class="btns"><button class="b del" data-act="deld" data-i="${i}">Remove</button></div></div></div>`).join("")+
  `<button class="b add" data-act="adddev">Add a device</button>`;
}
/* ---------- Location: sensors -> device trackers ---------- */
function trackersV(){
  return `<p class="hint" style="margin:0 0 10px">Each row turns a sensor into a device_tracker. When the sensor's state matches the home state it is Home at your house (zone.home); any other state is Away; unavailable or unknown is ignored. Separate several home states with commas.</p>`+
  loc.trackers.map((r,i)=>`<div class="card"><div class="bd" style="border:0">
    ${fld("Name",inp(`loc.trackers.${i}.label`,r.label,"text",'placeholder="Sam"'))}
    ${fld("Source sensor",inp(`loc.trackers.${i}.entity_id`,r.entity_id,"text",'list="tap" autocapitalize="none" placeholder="sensor.sam_location"'))}
    ${fld("Home state (default: home)",inp(`loc.trackers.${i}.home_state`,r.home_state,"text",'autocapitalize="none" placeholder="home"'))}
    <div class="hd" style="padding:12px 0 0;cursor:default"><b>Show as switch<small>Only works if the source is an input_boolean or switch</small></b>${sw(`loc.trackers.${i}.toggle`,r.toggle)}</div>
    <div class="hint">Device tracker ID: ${esc(r.tracker_id||"(created on save)")}</div>
    <div class="btns"><button class="b del" data-act="delt" data-i="${i}">Remove</button></div></div></div>`).join("")+
  `<button class="b add" data-act="addtrk">Add a sensor</button>`;
}
/* ---------- Location: dashboard card ---------- */
function cardV(){
  const c=loc.card,K=f=>`loc.card.${f}`,G=[["household","Household"],["friends","Friends"],["hidden","Hidden (left out)"]];
  return `<div class="card"><div class="bd" style="border:0">
    <div class="row">${fld("Household title",inp(K("household_title"),c.household_title))}${fld("Friends title",inp(K("friends_title"),c.friends_title))}</div>
    ${fld("Columns",inp(K("columns"),c.columns,"number",'min="1" max="8" inputmode="numeric"'))}
    <div class="hd" style="padding:12px 0 0;cursor:default"><b>Bubble separator<small>Adds the Bubble Card separator on top</small></b>${sw(K("separator"),c.separator)}</div></div></div>
  <p class="hint" style="margin:0 0 10px">Built from the people on the Devices tab. Add a person there and save, then they show up here. Tap entity: blank for none; an input_boolean toggles on tap. Picture: blank is automatic.</p>`+
  c.rows.map((r,i)=>`<div class="card"><div class="bd" style="border:0"><b style="display:block;margin-top:12px">${esc(r.label)}</b>
    ${fld("Group",sel(`loc.card.rows.${i}.group`,G,r.group))}
    ${fld("Tap entity",inp(`loc.card.rows.${i}.entity`,r.entity,"text",'list="tap" autocapitalize="none" placeholder="person.alex"'))}
    ${fld("Picture (optional)",inp(`loc.card.rows.${i}.picture`,r.picture,"text",'placeholder="blank = automatic"'))}</div></div>`).join("")+
  `<div class="card"><div class="bd" style="border:0"><b style="display:block;margin-top:12px">Card YAML</b>
    <div class="hint">Refreshes when you save. In your dashboard: Edit, Add card, Manual, paste. Needs Mushroom and Bubble Card from HACS.</div>
    <textarea id="yaml" readonly style="min-height:260px;font:12px/1.4 ui-monospace,monospace;white-space:pre">${esc(c.yaml)}</textarea>
    <div class="btns"><button class="b pri" data-act="copy">Copy card YAML</button></div></div></div>`;
}
/* ---------- Backup ---------- */
const bkLine=s=>`${s.devices} device${s.devices===1?"":"s"}, ${s.trackers} sensor tracker${s.trackers===1?"":"s"}, ${s.places} place${s.places===1?"":"s"}, ${s.people} ${s.people===1?"person":"people"}, ${s.arrivals||0} arrival place${(s.arrivals||0)===1?"":"s"}`;
const backupV=()=>`<div id="bkres"></div>
  <div class="card"><div class="bd" style="border:0">
    <b style="display:block;margin-top:12px">Save a backup</b>
    <div class="hint" id="bkwhere">Loading…</div>
    <div class="hint">Includes your devices, sensor trackers, dashboard card, alert places and people, and the add-on options. The MQTT password is not saved.</div>
    <div class="btns"><button class="b pri" data-act="bk-save">Save backup now</button><button class="b" data-act="bk-dl">Download a copy</button></div></div></div>
  <div class="card"><div class="bd" style="border:0">
    <b style="display:block;margin-top:12px">Restore</b>
    <div class="hint">Replaces your current Location and Alerts settings. A safety copy of what you have now is saved first, and the add-on restarts.</div>
    <div class="chips"><label class="chip"><input type="checkbox" id="bkopts" checked>Also restore the add-on options</label></div>
    <div class="btns"><button class="b" data-act="bk-pick">Restore from a file…</button></div>
    <input type="file" id="bkfile" accept=".json,application/json" hidden></div></div>
  <div id="bkbox"></div>`;
async function loadBackup(){
  if(tab!=="backup"||!$("#bkbox"))return;
  try{
    const d=await api("api/hub/backup");
    if(tab!=="backup"||!$("#bkbox"))return;
    $("#bkwhere").innerHTML=`Saved to <code>${esc(d.path)}</code>, which is kept if you uninstall the add-on. The newest ${d.keep} backups are kept. Right now: ${esc(bkLine(d.current))}.`;
    $("#bkbox").innerHTML=d.files.length?d.files.map(f=>`<div class="card"><div class="ev"><b>${esc(f.created||f.file)}</b> <small>${f.kind==="safety"?"safety copy made before a restore":"backup"}${f.version?" · v"+esc(f.version):""}</small><br><small>${esc(bkLine(f.summary))}</small>
      <div class="btns" style="margin-top:8px"><button class="b del" data-act="bk-restore" data-file="${esc(f.file)}">Restore</button><button class="b" data-act="bk-get" data-file="${esc(f.file)}">Download</button></div></div></div>`).join(""):`<div class="card"><div class="ev">No saved backups yet.</div></div>`;
  }catch(e){const w=$("#bkwhere");if(w)w.textContent="Could not load: "+e.message}
}
async function bkDownload(file){
  const r=await fetch(BASE+"api/hub/backup/download"+(file?"?file="+encodeURIComponent(file):""));
  if(!r.ok)throw new Error("HTTP "+r.status);
  const b=await r.blob(),a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=file||("location_hub_backup_"+new Date().toISOString().slice(0,10)+".json");
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
async function bkRestore(body){
  if(dirty.size&&!confirm("You have unsaved changes on other pages. They will be lost. Continue?"))return;
  if(!confirm("Replace your current Location Hub settings with this backup? A safety copy of what you have now is saved first, and the add-on restarts."))return;
  const show=(h,err)=>{const b=$("#bkres");if(b)b.innerHTML=`<div class="res${err?" err":""}">${h}</div>`};
  show("Restoring…");
  try{
    const r=await api("api/hub/backup/restore",Object.assign({options:$("#bkopts")?$("#bkopts").checked:true},body));
    dirty.clear();stat();
    show(`Restored ${esc(bkLine(r.summary))}.\nAdd-on options: ${esc(r.options)}. Safety copy: ${esc(r.safety)}.\n${r.restarting?"The add-on is restarting. This page reloads in a few seconds.":"Restart the add-on to finish."}`);
    if(r.restarting)setTimeout(()=>location.reload(),12000);
  }catch(e){show(esc(e.message),true)}
}
/* ---------- Arrivals ---------- */
const zoneSlug=z=>String(z||"").split(".").slice(1).join(".");
const tgl=(k,v,t,h)=>`<div class="hd" style="padding:12px 0 0;cursor:default"><b>${t}<small>${h}</small></b>${sw(k,v)}</div>`;
function arrPlacesV(){
  const zn=arr.zones.map(z=>[z.id,z.name]),s=arr.settings;
  const intro=`<p class="hint" style="margin:0 0 10px">${s.all_zones?"Every zone already gets a sensor (<b>sensor.arrived_</b> plus the zone name, so Home is <b>sensor.arrived_home</b>). Add a place here only to name groups of people, or to turn one zone off.":"Only the places below get a sensor. Turn on <b>Track every zone</b> in Settings to cover all zones."} A group name is the sensor state when exactly those people arrive together within the group window.`;
  const cards=arr.places.map((p,i)=>{
    const o=open.has(p.id),K=f=>`arr.places.${i}.${f}`;
    const zname=(arr.zones.find(z=>z.id===p.zone)||{}).name||p.zone||"New place";
    return `<div class="card"><div class="hd" data-tog="${esc(p.id)}"><b>${esc(zname)}<small>sensor.arrived_${esc(zoneSlug(p.zone))}${p.combos.length?` · ${p.combos.length} group${p.combos.length===1?"":"s"}`:""}</small></b>${sw(K("enabled"),p.enabled)}</div>
    ${o?`<div class="bd">
      ${fld("Zone",sel(K("zone"),zn,p.zone),"Zones come from Settings → Areas, labels &amp; zones → Zones. Each zone can be added once.")}
      <label class="f">Group names (optional)</label>
      ${p.combos.map((c,j)=>`<div class="card" style="margin-top:8px"><div class="bd" style="border:0">
        ${fld("Sensor state for exactly these people",inp(`${K("combos")}.${j}.name`,c.name,"text",'autocapitalize="none" placeholder="alex_sam_home"'))}
        <div class="chips">${arr.people.map(x=>`<label class="chip"><input type="checkbox" data-cp="${i}.${j}" value="${esc(x.id)}" ${c.people.includes(x.id)?"checked":""}>${esc(x.label)}</label>`).join("")||'<span class="hint">Add people on Location → Devices first.</span>'}</div>
        <div class="btns"><button class="b del" data-act="arr-delcombo" data-i="${i}" data-j="${j}">Remove group</button></div></div></div>`).join("")}
      <div class="btns"><button class="b" data-act="arr-addcombo" data-i="${i}">Add a group</button><button class="b del" data-act="arr-delplace" data-i="${i}">Remove place</button></div>
    </div>`:""}</div>`}).join("");
  return intro+cards+`<button class="b add" data-act="arr-addplace">Add a place</button>`;
}
function arrSettingsV(){
  const s=arr.settings,K=f=>`arr.settings.${f}`;
  return `<div class="card"><div class="bd" style="border:0">
    ${tgl(K("enabled"),s.enabled,"Arrival tracking","Master switch. Off stops new arrivals.")}
    ${tgl(K("all_zones"),s.all_zones,"Track every zone","Each zone in Home Assistant gets its own sensor. Off: only the places you add.")}
    ${tgl(K("latest_sensor"),s.latest_sensor,"Latest arrival sensor","sensor.latest_arrival shows the newest arrival at any zone.")}
    ${tgl(K("fire_events"),s.fire_events,"Fire an event on every arrival","Sends location_hub_arrival to Home Assistant, handy as an automation trigger.")}
    ${fld("Group window (seconds)",inp(K("window_seconds"),s.window_seconds,"number",'min="5" inputmode="numeric"'),"People who arrive at the same place within this time count as one group.")}
    ${fld("Clear after (seconds)",inp(K("reset_after_seconds"),s.reset_after_seconds,"number",'min="5" inputmode="numeric"'),"After this long with no new arrival, the sensor goes back to &quot;no one arriving&quot;.")}
    <div class="hint">People come from Location → Devices. If the old AppDaemon app still runs, turn it off so it does not fight over sensor.arrived_home.</div>
  </div></div>`;
}
const arrLiveV=()=>`<p class="hint" style="margin:0 0 10px">Current state of each arrival sensor. Test makes a pretend arrival for the people ticked (the first person if none) and shows it until the clear time.</p><div id="arrbox"><div class="card"><div class="ev">Loading…</div></div></div><div class="card" id="arrlog"></div>`;
async function loadArrLive(){
  if(tab!=="arr_live"||!$("#arrbox"))return;
  try{
    const d=await api("api/hub/arrivals/live");
    if(tab!=="arr_live"||!$("#arrbox"))return;
    const head=`<div class="card"><div class="ev"><b>Latest arrival</b> <small>sensor.latest_arrival</small><br>${esc(d.latest.state)}${(d.latest.attrs.place?` at ${esc(d.latest.attrs.place)}`:"")}${d.connected?"":'<br><small>Not connected to Home Assistant yet.</small>'}${d.mqtt?"":'<br><small>MQTT is not connected, so sensors use the plain fallback (no unique ID).</small>'}</div></div>`;
    $("#arrbox").innerHTML=head+(d.live.length?d.live.map(x=>`<div class="card"><div class="ev"><b>${esc(x.name)}</b> <small>${esc(x.sensor)}</small><br>${esc(x.state)}<br><small>Here now: ${x.here.length?esc(x.here.join(", ")):"nobody"}</small>
      <div class="chips">${d.people.map(pp=>`<label class="chip"><input type="checkbox" data-tp="${esc(x.zone)}" value="${esc(pp.id)}">${esc(pp.label)}</label>`).join("")}</div>
      <div class="btns" style="margin-top:8px"><button class="b" data-act="arr-test" data-zone="${esc(x.zone)}">Test arrival</button></div></div></div>`).join(""):`<div class="card"><div class="ev">No zones tracked yet.</div></div>`);
    $("#arrlog").innerHTML=d.log.length?d.log.map(e=>`<div class="ev"><b>${esc(e.place)}</b> <span class="k-${e.kind==="arrival"?"sent":"skipped"}">${esc(e.kind)}</span> <small>${esc(e.t)}</small><br>${esc(e.msg)}</div>`).join(""):`<div class="ev">Nothing yet. Arrivals show up here.</div>`;
  }catch(e){const b=$("#arrbox");if(b)b.innerHTML=`<div class="card"><div class="ev">Could not load: ${esc(e.message)}</div></div>`}
}
const VIEWS={arr_places:arrPlacesV,arr_settings:arrSettingsV,arr_live:arrLiveV,backup:backupV,switches:switchesV,devices:devicesV,trackers:trackersV,card:cardV,places:placesV,people:peopleV,notify:notifyV,log:logV};


function setPath(path,val){
  const k=path.split("."),isLoc=k[0]==="loc",isArr=k[0]==="arr",ks=(isLoc||isArr)?k.slice(1):k;let o=isLoc?loc:isArr?arr:cfg;
  for(let i=0;i<ks.length-1;i++)o=o[ks[i]];
  o[ks[ks.length-1]]=val;mark(isLoc?ks[0]:isArr?"arrivals":"alerts");
}
async function save(quiet){
  const had=new Set(dirty);
  try{
    if(had.has("alerts"))await api("api/hub/config",cfg);
    if(had.has("devices"))await api("api/hub/devices",{entities:loc.devices.filter(d=>(d.label||"").trim()&&(d.entity_id||"").trim()).map(d=>({label:d.label.trim(),entity_id:d.entity_id.trim(),home_state:(d.home_state||"").trim()}))});
    if(had.has("settings"))await api("api/hub/settings",{name:(loc.settings.name||"").trim(),entity_id:(loc.settings.entity_id||"").trim()});
    if(had.has("trackers"))await api("api/hub/trackers",{trackers:loc.trackers});
    if(had.has("card"))await api("api/hub/card",loc.card);
    if(had.has("arrivals")){await api("api/hub/arrivals",{settings:arr.settings,places:arr.places});await loadArr()}
    dirty.clear();stat();
    if([...had].some(g=>g!=="alerts")){await loadLoc();render()}
    if(!quiet)toast("Saved");
  }catch(e){toast("Save failed: "+e.message);throw e}
}

document.addEventListener("input",e=>{const t=e.target;if(t.dataset.k){setPath(t.dataset.k,t.type==="number"?Number(t.value):t.type==="checkbox"?t.checked:t.value)}});
document.addEventListener("change",e=>{
  const t=e.target,d=t.dataset;
  if(t.id==="bkfile"&&t.files[0]){
    t.files[0].text().then(txt=>{let o;try{o=JSON.parse(txt)}catch(err){toast("That file is not valid JSON");return}bkRestore({data:o})});
    t.value="";return;
  }
  if(d.k&&t.type==="checkbox")setPath(d.k,t.checked);
  if(d.k&&/^arr\.places\.\d+\.zone$/.test(d.k))render();
  if(d.cp!==undefined){
    const [pi,pj]=d.cp.split(".").map(Number),c=arr.places[pi].combos[pj];
    c.people=t.checked?[...new Set([...c.people,t.value])]:c.people.filter(x=>x!==t.value);mark("arrivals");
  }
  if(d.who!==undefined||d.day!==undefined){
    const i=d.who??d.day,f=d.who!==undefined?"who":"days",v=d.who!==undefined?t.value:Number(t.value),a=cfg.places[i][f];
    cfg.places[i][f]=t.checked?[...a,v]:a.filter(x=>x!==v);mark("alerts");
    if(f==="who")render();
  }
});
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-nav],[data-sec],[data-tab],[data-tog],[data-act]");if(!t||e.target.closest(".sw:not(.vis)"))return;
  const d=t.dataset;
  if(d.nav!==undefined){if(dirty.size&&!confirm("You have unsaved changes. Leave without saving?"))return;location.href=BASE+d.nav;return}
  if(d.sec){sec=d.sec;tab=mem[sec];render();return}
  if(d.tab){tab=d.tab;mem[sec]=tab;render();return}
  if(d.tog){open.has(d.tog)?open.delete(d.tog):open.add(d.tog);render();return}
  const i=+d.i;
  if(d.act==="tg"){
    const s=t.querySelector(".sw");if(s)s.classList.toggle("on");busy=true;
    try{await api("api/hub/toggle",{entity_id:d.eid})}catch(err){toast("Could not toggle "+d.eid)}
    busy=false;setTimeout(loadSwitches,500);
  }
  if(d.act==="bk-save"){
    const b=$("#bkres");b.innerHTML='<div class="res">Saving…</div>';
    try{const r=await api("api/hub/backup/save",{});b.innerHTML=`<div class="res">Saved <b>${esc(r.file)}</b> to ${esc(r.path)}\n${esc(bkLine(r.summary))}</div>`;loadBackup()}
    catch(err){b.innerHTML=`<div class="res err">${esc(err.message)}</div>`}
  }
  if(d.act==="bk-dl"||d.act==="bk-get")bkDownload(d.file).catch(err=>toast("Download failed: "+err.message));
  if(d.act==="bk-restore")bkRestore({file:d.file});
  if(d.act==="bk-pick")$("#bkfile").click();
  if(d.act==="arr-addplace"){
    const used=new Set(arr.places.map(p=>p.zone)),z=arr.zones.find(z=>!used.has(z.id));
    if(!z){toast("Every zone is already added");return}
    const np={id:uid(),zone:z.id,enabled:true,combos:[]};arr.places.push(np);open.add(np.id);mark("arrivals");render();
  }
  if(d.act==="arr-delplace"&&confirm(arr.settings.all_zones?"Remove this place? Its group names are lost. The zone keeps its sensor because Track every zone is on.":"Remove this place? Its sensor is deleted from Home Assistant when you save.")){arr.places.splice(i,1);mark("arrivals");render()}
  if(d.act==="arr-addcombo"){arr.places[i].combos.push({name:"",people:[]});mark("arrivals");render()}
  if(d.act==="arr-delcombo"){arr.places[i].combos.splice(+d.j,1);mark("arrivals");render()}
  if(d.act==="arr-test"){
    const ids=[...document.querySelectorAll('input[data-tp]:checked')].filter(x=>x.dataset.tp===d.zone).map(x=>x.value);
    try{const r=await api("api/hub/arrivals/test",{zone:d.zone,people:ids});toast("Test arrival: "+r.state);loadArrLive()}
    catch(err){toast("Test failed: "+err.message)}
  }
  if(d.act==="adddev"){loc.devices.push({label:"",entity_id:"",home_state:""});mark("devices");render()}
  if(d.act==="deld"&&confirm("Remove this device?")){loc.devices.splice(i,1);mark("devices");render()}
  if(d.act==="addtrk"){loc.trackers.push({id:"",label:"",entity_id:"",home_state:"",toggle:false,tracker_id:""});mark("trackers");render()}
  if(d.act==="delt"&&confirm("Remove this tracker? Its device_tracker is deleted from Home Assistant when you save.")){loc.trackers.splice(i,1);mark("trackers");render()}
  if(d.act==="copy"){
    const ta=$("#yaml");ta.select();const done=()=>toast("Card YAML copied");
    if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(ta.value).then(done,()=>{document.execCommand("copy");done()});
    else{document.execCommand("copy");done()}
  }
  if(d.act==="addplace"){const p={id:uid(),enabled:true,name:"New place",zone:(ent.zones[0]||{}).id||"",who:[],mode:"any",dwell:5,title:"",extra:"",days:[],start:"",end:"",custom_prompt:""};cfg.places.push(p);open.add(p.id);mark("alerts");render()}
  if(d.act==="dup"){const p=JSON.parse(JSON.stringify(cfg.places[i]));p.id=uid();p.name+=" (copy)";cfg.places.splice(i+1,0,p);open.add(p.id);mark("alerts");render()}
  if(d.act==="del"&&confirm("Delete this place?")){cfg.places.splice(i,1);mark("alerts");render()}
  if(d.act==="addperson"){cfg.people.push({id:uid(),name:"",entity_id:"",notes:""});mark("alerts");render()}
  if(d.act==="delp"&&confirm("Remove this person?")){const id=cfg.people[i].id;cfg.people.splice(i,1);cfg.places.forEach(p=>p.who=p.who.filter(x=>x!==id));mark("alerts");render()}
  if(d.act==="reload")loadLog();
  if(d.act==="prev"||d.act==="send"){
    const p=cfg.places[i],show=h=>{const b=$("#res-"+p.id);if(b)b.innerHTML=h};
    show('<div class="res">Working on it…</div>');
    try{await save(true);const r=await api("api/hub/test",{id:p.id,send:d.act==="send"});
      show(`<div class="res"><b>${esc(r.title)}</b>\n${esc(r.message)}${r.fallback?"\n\n(AI failed, so this is the fallback message.)":""}</div>`)}
    catch(err){show(`<div class="res err">${esc(err.message)}</div>`)}
  }
});
$("#save").onclick=()=>save().catch(()=>{});
setInterval(loadSwitches,5000);
init().catch(e=>{$("#view").innerHTML=`<div class="res err">Could not load: ${esc(e.message)}</div>`});
</script></body></html>
