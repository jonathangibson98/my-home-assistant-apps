<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tuya Local</title>
<style>
:root{
  --bg:#0f172a; --card:#1e293b; --field:#0b1222; --line:#334155;
  --txt:#f1f5f9; --dim:#94a3b8; --acc:#3b82f6; --accsoft:#1d3a6e;
  --red:#991b1b; --warn:#fbbf24; --ok:#4ade80; --bad:#f87171;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
nav{display:flex;gap:6px;padding:10px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
nav button{flex:1;padding:10px 4px;min-width:0}
button{background:var(--line);color:var(--txt);border:0;border-radius:8px;padding:10px 14px;font:inherit;font-size:15px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.on,button.pri{background:var(--acc)}
button.del{background:var(--red)}
button.sm{font-size:13px;padding:6px 10px}
main{padding:6px 10px 0;max-width:820px;margin:auto}
h2{margin:20px 0 8px;font-size:17px;font-weight:600;color:var(--dim)}
p.note{color:var(--dim);font-size:14px;margin:10px 0}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hd b{font-size:17px;word-break:break-word}
.meta{font-size:13px;color:var(--dim);margin-top:4px;word-break:break-all}
.chip{font-size:12px;border-radius:99px;padding:3px 10px;background:var(--line);white-space:nowrap}
.chip.online{background:#14532d;color:var(--ok)}.chip.error{background:#7f1d1d;color:#fecaca}
.chip.connecting,.chip.waiting,.chip.starting,.chip.offline{background:#713f12;color:var(--warn)}
.err{background:#2a1215;border:1px solid #7f1d1d;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:14px}
.err b{color:#fecaca}.err span{display:block;color:var(--dim);margin-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
label{font-size:13px;color:var(--dim);margin:12px 0 4px;display:block}
input[type=text],input[type=password],select,textarea{width:100%;background:var(--field);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit}
textarea{min-height:90px}
input[type=checkbox]{width:22px;height:22px;flex:none}
details{background:rgba(255,255,255,.04);border-radius:10px;margin-top:10px;padding:10px}
summary{font-weight:600;cursor:pointer}
.ent{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:8px;font-size:14px}
.ent .nm{min-width:0}.ent input[type=text]{padding:6px 8px}
.ent .val{color:var(--dim);font-size:12px;word-break:break-all}
.tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px}
.steps div{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}.steps div:last-child{border:0}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.verdict{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--accsoft);font-size:14px}
#qr{background:#fff;border-radius:10px;padding:8px;display:inline-block;margin-top:10px;max-width:260px}
#qr svg{width:100%;height:auto;display:block}
ol.steps2{padding-left:20px;color:var(--dim);font-size:14px;margin:8px 0}
ol.steps2 li{margin:4px 0}ol.steps2 b{color:var(--txt)}
.banner{background:#3b2a05;border:1px solid #713f12;color:var(--warn);border-radius:10px;padding:10px;margin:10px 0;font-size:14px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<!-- ha-theme v1.3.0: copied from .shared/ha-theme.js, edit it there -->
<script>
window.__hbAddon = "tuya_local";

  const ents = d.entities.length ? d.entities.map(e => entRow(d, e)) : [h('div', {className: 'meta', textContent: d.state === 'online' ? 'No data points found yet.' : 'Entities appear once the device connects.'})];
  return h('div', {className: 'card'},
    h('div', {className: 'hd'}, h('b', {textContent: d.name}), chip(d)),
    h('div', {className: 'meta', textContent: [d.ip || 'no IP yet', d.protocol ? 'protocol ' + d.protocol : (d.version !== 'auto' ? 'protocol ' + d.version : 'protocol auto'), d.product_name || d.category].filter(Boolean).join(' · ')}),
    errBox(d), msg[d.id] ? h('div', {className: 'meta ok', textContent: msg[d.id]}) : null,
    h('div', {className: 'row'}, btn), out,
    h('details', {}, h('summary', {textContent: 'Entities in Home Assistant (' + d.entities.filter(e => e.enabled).length + ')'}), ents),
    settings(d));
}
function devicesView() {
  const v = h('div');
  if (!S.mqtt) v.append(h('div', {className: 'banner', textContent: 'The MQTT broker is not connected, so Home Assistant entities cannot be created yet. Start the Mosquitto broker add-on and restart this one.'}));
  if (!S.devices.length) {
    v.append(h('div', {className: 'card'}, h('b', {textContent: 'No devices yet'}),
      h('p', {className: 'note', textContent: 'Fastest way: bring in the devices you already set up in LocalTuya, then sign in to Tuya to refresh their keys.'}),
      h('div', {className: 'row'}, h('button', {className: 'pri', textContent: 'Go to Account', onclick: () => go('account')}), h('button', {textContent: 'Find devices on the network', onclick: () => go('find')}))));
  } else {
    v.append(h('p', {className: 'note', textContent: 'Each device talks to Home Assistant directly over your network. Tap a status for details, or Check connection to find out what is wrong.'}));
    S.devices.forEach(d => v.append(deviceCard(d)));
  }
  return v;
}

// ---------- find ----------
function addForm(f, box) {
  const name = h('input', {type: 'text', value: f ? (f.name || '') : '', placeholder: 'Name, for example Lamp'});
  const key = h('input', {type: 'text', placeholder: 'Local key (or sign in on the Account tab)', autocapitalize: 'none', autocomplete: 'off', spellcheck: 'false'});
  const idf = f ? null : h('input', {type: 'text', placeholder: 'Device ID', autocapitalize: 'none'});
  const ip = f ? null : h('input', {type: 'text', placeholder: 'IP address (optional)', inputmode: 'decimal'});
  const err = h('div', {className: 'meta bad'});
  return h('div', {}, name, idf, ip, key, err, h('div', {className: 'row'}, h('button', {className: 'pri', textContent: 'Add device', onclick: async () => {
    const r = await api('device', {id: f ? f.id : idf.value, name: name.value, ip: f ? f.ip : ip.value, key: key.value, version: f ? f.version : 'auto'});
    if (!r.ok) { err.textContent = r.error; return; }
    go('devices'); load();
  }})));
}
function findView() {
  const v = h('div'), sc = S.scan || {};
  v.append(h('p', {className: 'note', textContent: 'Listens for Tuya devices announcing themselves on your network (about 12 seconds). Devices you already have are moved to their new IP address if it changed.'}));
  v.append(h('div', {className: 'row'}, h('button', {className: 'pri', disabled: sc.running, onclick: async () => { await api('scan', {}); load(); setTimeout(load, 1500); },
    textContent: sc.running ? 'Scanning…' : 'Scan now'}), sc.running ? h('span', {className: 'spin'}) : null));
  if (sc.error) v.append(h('div', {className: 'banner', textContent: 'Scan problem: ' + sc.error}));
  if (sc.ts) v.append(h('div', {className: 'meta', textContent: (sc.found || []).length + ' device(s) answered at ' + new Date(sc.ts * 1000).toLocaleTimeString()}));
  for (const f of sc.found || []) {
    const box = h('div');
    v.append(h('div', {className: 'card'}, h('div', {className: 'hd'}, h('b', {textContent: f.known ? f.name : 'New device'}), h('span', {className: 'chip ' + (f.known ? 'online' : 'waiting'), textContent: f.known ? 'Added' : 'Not added'})),
      h('div', {className: 'meta', textContent: f.ip + ' · protocol ' + (f.version || '?') + ' · ID ' + f.id}),
      f.known ? null : h('details', {}, h('summary', {textContent: 'Add it'}), addForm(f, box))));
  }
  v.append(h('h2', {textContent: 'Add one by hand'}), h('div', {className: 'card'}, addForm(null)));
  return v;
}

// ---------- account ----------
let qrTimer = null;
function accountView() {
  const v = h('div'), out = h('div'), qr = h('div');
  const note = h('div', {className: 'meta'});
  v.append(h('h2', {textContent: 'Bring in your LocalTuya devices'}),
    h('div', {className: 'card'}, h('p', {className: 'note', textContent: 'Reads the devices, IP addresses, keys and entities saved in LocalTuya. Nothing is changed there. Afterwards, sign in below to refresh keys that no longer work.'}),
      h('div', {className: 'row'}, h('button', {className: 'pri', textContent: 'Import from LocalTuya', onclick: async (ev) => {
        ev.target.disabled = true; out.textContent = 'Importing…';
        const r = await api('import', {}); ev.target.disabled = false;
        out.className = 'meta ' + (r.ok ? 'ok' : 'bad');
        out.textContent = r.ok ? 'Found ' + r.total + ' device(s), ' + r.added + ' new.' + (r.skipped.length ? ' Some entity types (' + r.skipped.join(', ') + ') are brought in as plain switches and sensors.' : '') : r.error;
        if (r.ok) load();
      }})), out));
  v.append(h('h2', {textContent: 'Tuya account (to get each device\'s local key)'}));
  if (S.signed_in) {
    const res = h('div', {className: 'meta'});
    v.append(h('div', {className: 'card'}, h('div', {className: 'hd'}, h('b', {textContent: 'Signed in'}), h('span', {className: 'chip online', textContent: 'User Code ' + S.user_code})),
      h('p', {className: 'note', textContent: 'Reads your devices and their keys from Tuya, once. After that everything runs locally. Run it again if you re-pair a device or a key stops working.'}),
      h('div', {className: 'row'}, h('button', {className: 'pri', textContent: 'Get my devices', onclick: async (ev) => {
        ev.target.disabled = true; res.replaceChildren(h('span', {className: 'spin'}), 'Reading your account…');
        const r = await api('cloud/sync', {}); ev.target.disabled = false;
        res.className = 'meta ' + (r.ok ? 'ok' : 'bad');
        res.textContent = r.ok ? r.total + ' device(s) on your account: ' + r.added + ' added, ' + r.updated + ' updated' + (r.skipped ? ', ' + r.skipped + ' skipped (no local key, like Zigbee sub-devices).' : '.') : r.error;
        if (r.ok) load();
      }}), h('button', {textContent: 'Sign out', onclick: async () => { await api('login/logout', {}); load(); }})), res));
  } else {
    const code = h('input', {type: 'text', id: 'user_code', placeholder: 'User Code', autocapitalize: 'none', autocomplete: 'off', spellcheck: 'false'});
    v.append(h('div', {className: 'card'},
      h('ol', {className: 'steps2'},
        h('li', {}, 'Open the ', h('b', {textContent: 'Smart Life'}), ' or ', h('b', {textContent: 'Tuya Smart'}), ' app on your phone.'),
        h('li', {}, 'Go to ', h('b', {textContent: 'Me'}), ' → ', h('b', {textContent: 'Settings (gear)'}), ' → ', h('b', {textContent: 'Account and Security'}), ' → ', h('b', {textContent: 'User Code'}), ' and copy it.'),
        h('li', {}, 'Paste it here and tap ', h('b', {textContent: 'Show QR code'}), '.'),
        h('li', {}, 'In the app, tap the ', h('b', {textContent: 'scan'}), ' icon and scan the code. Approve the login.')),
      code, note, h('div', {className: 'row'}, h('button', {className: 'pri', textContent: 'Show QR code', onclick: async () => {
        note.className = 'meta'; note.textContent = '';
        const r = await api('login/qr', {user_code: code.value});
        if (!r.ok) { note.className = 'meta bad'; note.textContent = r.error; return; }
        const holder = h('div', {id: 'qr'}); holder.innerHTML = r.svg; qr.replaceChildren(holder, h('div', {className: 'meta'}, h('span', {className: 'spin'}), 'Waiting for you to scan it…'));
        clearInterval(qrTimer);
        qrTimer = setInterval(async () => {
          const p = await api('login/poll');
          if (p.state === 'signed_in') { clearInterval(qrTimer); load(); }
          else if (p.state === 'none') clearInterval(qrTimer);
        }, 2500);
      }})), qr));
  }
  v.append(h('p', {className: 'note', textContent: 'Your login and the devices\' local keys are stored only inside this add-on\'s private data folder.'}));
  return v;
}

function draw(force) {
  if (tab !== 'account') clearInterval(qrTimer);
  const view = tab === 'devices' ? devicesView() : tab === 'find' ? findView() : accountView();
  $('#main').replaceChildren(view);
  document.querySelectorAll('nav button').forEach(b => b.className = b.dataset.t === tab ? 'on' : '');
}
go('devices'); load(); setInterval(load, 3000);
</script>
</body>
</html>
