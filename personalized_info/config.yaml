name: Personalized Info
version: "1.1.0"
slug: personalized_info
image: "ghcr.io/jonathangibson98/{arch}-addon-personalized_info"
description: "Everyone in one place: a profile for each person (pictures, about, work, health, vehicles, dates, likes and more), plus places, music, live status, sensors and AI help"
arch: [aarch64, amd64]
ingress: true
panel_icon: mdi:account-group
panel_title: Personalized Info
homeassistant_api: true
services:
  - mqtt:want
map:
  - homeassistant_config:rw
options:
  core_people:
    - alex
    - sam
    - buddy
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  wallpaper: ""
  ai_task_entity: ""
schema:
  core_people:
    - str
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  wallpaper: str?
  ai_task_entity: str?
