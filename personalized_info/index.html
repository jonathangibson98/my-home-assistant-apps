<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Personalized Info</title>
<style>
:root{
  --bg:#0f172a; --card:#1e293b; --field:#0b1222; --line:#334155;
  --txt:#f1f5f9; --dim:#94a3b8; --acc:#3b82f6; --accsoft:#1d3a6e;
  --red:#991b1b; --warn:#fbbf24; --ok:#4ade80;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
nav{display:flex;gap:6px;padding:10px;position:sticky;top:0;background:var(--bg);z-index:5;
  border-bottom:1px solid var(--line)}
nav button{flex:1;padding:10px 4px;min-width:0}
button{background:var(--line);color:var(--txt);border:0;border-radius:8px;padding:10px 14px;
  font:inherit;font-size:15px;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{
  outline:2px solid var(--acc);outline-offset:2px}
button.on,button.pri{background:var(--acc)}
button.del{background:var(--red);padding:4px 10px;font-size:14px}
button.ghost{background:transparent;border:1px dashed var(--line);color:var(--dim)}
#sensors-panel,#ai-default,#shuffle-panel{max-width:820px;margin:0 auto;padding:10px 10px 0}
main{padding:4px 10px 0;max-width:820px;margin:auto}
h2{margin:22px 0 8px;font-size:17px;font-weight:600;color:var(--dim)}
p.note{color:var(--dim);font-size:14px;margin:12px 0}
details{background:var(--card);border-radius:10px;margin-bottom:8px;padding:12px}
summary{font-weight:600;cursor:pointer}
label{font-size:13px;color:var(--dim);margin:12px 0 4px;display:block}
input[type=text],input[type=number],textarea{
  width:100%;background:var(--field);color:var(--txt);border:1px solid var(--line);
  border-radius:8px;padding:9px;font:inherit}
textarea{min-height:96px;resize:vertical}
select{width:100%;background:var(--field);color:var(--txt);border:1px solid var(--line);
  border-radius:8px;padding:9px;font:inherit;margin-top:6px}
input[type=checkbox]{width:22px;height:22px}
.panel{background:var(--card);border-radius:10px;padding:12px;margin-top:10px}
.panel .add button{font-size:15px;padding:10px 14px}
.grp{border-left:2px solid var(--line);margin-left:6px;padding-left:10px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.add{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.add button{font-size:13px;padding:7px 11px}
.row{margin-top:10px}
.meta{font-size:12px;color:var(--dim);margin-top:6px;word-break:break-all}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:space-between;align-items:center;gap:10px}
#st{font-size:14px;color:var(--dim)}
#st.warn{color:var(--warn)} #st.ok{color:var(--ok)} #st.bad{color:#f87171}
.now{font-weight:400;color:var(--ok);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{font-size:13px;padding:6px 10px;background:var(--accsoft)}
.ha.ai textarea{margin-top:8px}.answer{white-space:pre-wrap;margin-top:10px;line-height:1.5}
.pickrow{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px;color:var(--txt)}.pickrow input{width:auto;margin-top:3px}
.ha{border-left:2px solid var(--acc);margin:14px 0 4px 6px;padding-left:10px}
.ha .rl{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center;margin-top:8px}
.ha .rl label{margin:0}
.hint{font-size:12px;color:var(--dim);margin-top:6px}
.bday{background:var(--card);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
h1{font-size:20px;margin:0 0 4px}
.ownf{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0}.ownf>.hd{margin-top:0}.ownf .grp{margin-top:6px}.bd2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bd2 select,.bd2 input{flex:1;min-width:90px;width:auto}.sub{font-size:12px;color:var(--dim);font-weight:700;margin:14px 0 2px;letter-spacing:.02em}
.sheetbk{position:absolute;inset:0;background:rgba(0,0,0,.6)}
#picov{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
#picov .sheet{position:relative;width:100%;max-width:560px;max-height:86vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px))}
#picov h3{margin:0 0 2px;font-size:18px}
#picov .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-top:8px}
.po{display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(255,255,255,.05);border:2px solid transparent;border-radius:12px;padding:8px 4px;color:var(--txt);min-width:0}
.po.on{border-color:var(--acc)}.po .avatar{width:56px;height:56px;margin:0;font-size:18px}
.po small{font-size:11px;color:var(--dim);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.psec{font-size:12px;color:var(--dim);font-weight:700;margin:16px 0 0;letter-spacing:.02em}
label.upl{display:inline-block;cursor:pointer;background:var(--acc);color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700}
.rel{border:1px solid var(--line,rgba(255,255,255,.14));border-radius:14px;padding:10px;margin:8px 0}.rel .top{display:flex;gap:10px;align-items:center;margin-bottom:6px}.rel .top b{flex:1}.rel select,.rel input{margin:3px 0}.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.person{background:var(--card);border-radius:12px;padding:14px 10px;text-align:center;cursor:pointer;border:1px solid transparent;min-width:0}
.person:hover,.person:focus-visible{border-color:var(--acc)}
.person .note{margin:4px 0;min-height:1.2em;overflow-wrap:anywhere}
.avatar{position:relative;width:64px;height:64px;border-radius:50%;background:var(--field);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.avatar>img:not(.badge){width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar .badge{position:absolute;right:-6px;bottom:-4px;width:26px;height:26px;border-radius:50%;object-fit:cover;border:2px solid var(--card)}
.avatar.sm{width:30px;height:30px;font-size:14px;margin:0 8px 0 0;display:inline-flex;vertical-align:middle}
.avatar.big{width:88px;height:88px;font-size:36px;margin:0}
.ttl{display:inline-flex;align-items:center}
.phead{display:flex;gap:14px;align-items:center;margin:12px 0 4px}
.bar{height:6px;background:var(--field);border-radius:3px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat{background:var(--field);border-radius:8px;padding:8px 10px}.stat small{color:var(--dim);display:block;font-size:12px}
.tagchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{background:var(--field);border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.chip b{cursor:pointer;color:var(--dim);font-weight:400;padding:0 4px}
.item{background:var(--field);border-radius:8px;padding:8px 10px;margin-bottom:8px;border:1px solid var(--line)}
input[type=date],input[type=time],input[type=url]{width:100%;background:var(--field);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit}
</style>
</head>
<body>
<!-- ha-theme v1.3.0: copied from .shared/ha-theme.js, edit it there -->
<script>
window.__hbAddon = "personalized_info";
/* HA Theme Bridge v1.3.0
 * Makes an add-on web UI follow the active Home Assistant theme (colors, dark/light,
 * dashboard wallpaper, glass blur, card corners and shadows) and updates live when
 * the theme changes. It reads the theme from the Home Assistant page that holds the
 * add-on (ingress runs on the same origin) and remaps this page's own colors to it.
 * Opened outside Home Assistant it does nothing, so the page keeps its own look.
 * Wallpaper, first match wins: the add-on's own "wallpaper" option (Configuration tab), then the
 * shared add-on wallpaper picked in Photo Hub (/local/addon-wallpaper/wallpaper.json), then the theme's.
 * The add-on option:
 *   empty = use the theme's wallpaper, "none" = no wallpaper, or an image:
 *   /local/pic.jpg (= /config/www/pic.jpg), just pic.jpg, /config/www/..., or https://...
 * Readability: over a wallpaper it measures the picture's bright and dark areas and dims (dark
 * themes) or lightens (light themes) it just enough for text to reach a 4.5:1 contrast.
 * Opt out on a page: <html data-ha-theme-off>
 * Variables you can use in new pages: --hb-bg --hb-card --hb-text --hb-text2 --hb-line
 * --hb-primary --hb-accent --hb-on --hb-error --hb-warning --hb-success --hb-field,
 * plus every core HA variable (--primary-color, --card-background-color, ...).
 */
(function () {
  'use strict';
  if (window.__haThemeBridge) return;
  window.__haThemeBridge = 1;
  var doc = document, root = doc.documentElement;
  if (root.hasAttribute('data-ha-theme-off')) return;

  /* ---------- find the Home Assistant window above us ---------- */
  var HA = null;
  try {
    var w = window;
    while (w.parent && w.parent !== w) {
      w = w.parent;
      if (w.document && w.document.querySelector('home-assistant')) HA = w;
    }
  } catch (e) { /* cross-origin parent: stop climbing */ }
  if (!HA) return;
  var nested = window.parent !== HA;

  /* ---------- color helpers ---------- */
  function parse(c) {
    if (!c) return null;
    c = String(c).trim().toLowerCase();
    var m;
    if (c.charAt(0) === '#') {
      var h = c.slice(1);
      if (!/^[0-9a-f]+$/.test(h)) return null;
      if (h.length === 3 || h.length === 4) h = h.replace(/./g, '$&$&');
      if (h.length !== 6 && h.length !== 8) return null;
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16),
        h.length === 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1];
    }
    if ((m = c.match(/^rgba?\(([^)]+)\)$/))) {
      var p = m[1].split(/[\s,\/]+/).filter(Boolean);
      if (p.length < 3) return null;
      var f = function (v, alpha) {
        return /%$/.test(v) ? parseFloat(v) * (alpha ? 0.01 : 2.55) : parseFloat(v);
      };
      var out = [f(p[0]), f(p[1]), f(p[2]), p.length > 3 ? f(p[3], 1) : 1];
      for (var i = 0; i < 4; i++) if (isNaN(out[i])) return null;
      return out;
    }
    if (c === 'white') return [255, 255, 255, 1];
    if (c === 'black') return [0, 0, 0, 1];
    if (c === 'transparent') return [0, 0, 0, 0];
    return null;
  }
  function info(c) {
    var r = c[0] / 255, g = c[1] / 255, b = c[2] / 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), ch = mx - mn, h = 0;
    if (ch) {
      if (mx === r) h = ((g - b) / ch) % 6;
      else if (mx === g) h = (b - r) / ch + 2;
      else h = (r - g) / ch + 4;
      h *= 60;
      if (h < 0) h += 360;
    }
    return { l: (mx + mn) / 2, ch: ch, h: h, a: c[3] };
  }
  /* greys, plus the dark navy/indigo shades many dark UIs use as their "grey" */
  function isNeutral(i) {
    return i.ch < 0.12 || (i.ch < 0.2 && i.h >= 200 && i.h <= 290 && (i.l < 0.32 || i.l > 0.85));
  }
  function lum(c) { return c ? (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255 : 0; }
  function rgbStr(c) { return Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]); }
  function hueRole(h) {
    return (h < 15 || h >= 335) ? 'error' : h < 65 ? 'warning' : h < 170 ? 'success' : 'primary';
  }
  function tint(role, a) { return 'rgba(var(--hb-' + role + '-rgb),' + (Math.round(a * 1000) / 1000) + ')'; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  var probe = null;
  function toRGB(v) {
    v = (v || '').trim();
    if (!v) return null;
    var p = parse(v);
    if (p) return p;
    if (!probe) {
      probe = doc.createElement('i');
      probe.style.display = 'none';
      (doc.body || root).appendChild(probe);
    }
    probe.style.color = '';
    probe.style.color = v;
    if (!probe.style.color) return null;
    return parse(getComputedStyle(probe).color);
  }

  /* ---------- what the page looked like before we touched it ---------- */
  var REFS = { dark: { b: 0.08, t: 0.92 }, light: { b: 0.96, t: 0.12 } };
  var designScheme = 'dark';
  (function measure() {
    var el = doc.body || root, cs = getComputedStyle(el);
    var txt = parse(cs.color), bg = parse(cs.backgroundColor);
    if (!bg || bg[3] < 0.5) bg = parse(getComputedStyle(root).backgroundColor);
    if (txt) designScheme = info(txt).l > 0.5 ? 'dark' : 'light';
    else if (bg && bg[3] > 0.5) designScheme = info(bg).l < 0.5 ? 'dark' : 'light';
    var ref = REFS[designScheme];
    if (txt) ref.t = info(txt).l;
    if (bg && bg[3] > 0.5 && Math.abs(info(bg).l - ref.t) > 0.3) ref.b = info(bg).l;
  })();

  /* ---------- color rewriting rules ---------- */
  var COLOR_RE = /#[0-9a-fA-F]{3,8}\b|rgba?\([^)]*\)|\b(?:white|black)\b/g;
  var cardVars = {}, solidVars = {}, pageVars = {};

  function lastCompound(sel) {
    return (sel || '').split(',').map(function (s) {
      var parts = s.trim().split(/\s*[\s>+~]\s*/);
      return parts[parts.length - 1] || '';
    });
  }
  function kindOf(sel) {
    var lasts = lastCompound(sel), k = '';
    for (var i = 0; i < lasts.length; i++) {
      var s = lasts[i].toLowerCase();
      if (/^(html|body|:root)\b/.test(s)) return 'page';
      if (/\.(overlay|backdrop|scrim|mask|shade|sheet|modal|lightbox)\b|::backdrop/.test(s)) return 'scrim';
      if (/^(input|select|textarea)\b|\.(input|field-input|textfield)\b/.test(s)) k = k || 'input';
      else if (/^(header|nav|footer)\b|\.(top|topbar|nav|navbar|header|footer|bar|toolbar|appbar|bottom|tabbar|savebar)\b/.test(s)) k = k || 'bar';
      else if (/\.(card|panel|surface|sheet|modal|dialog|popup|menu|toast|drawer|pane|tile)\b|^(dialog|details)\b/.test(s)) k = k || 'card';
    }
    return k;
  }
  function ctxOf(p) {
    if (/^background(-color|-image)?$/.test(p)) return 'bg';
    if (p === 'color' || p === 'caret-color' || p === '-webkit-text-fill-color' || p === 'text-decoration-color') return 'text';
    if (/^border(-(top|right|bottom|left|block|inline)(-(start|end))?)?-color$/.test(p) || p === 'outline-color' || p === 'column-rule-color') return 'line';
    if (p === 'accent-color') return 'accent';
    return '';
  }

  /* returns {v, solid, card} or null to leave the color alone */
  function mapColor(c, ctx, ref, kind) {
    var i = info(c), a = i.a, dark = ref.b < 0.5;
    if (a === 0) return null;
    var span = ref.t - ref.b, t = span ? (i.l - ref.b) / span : 0, at = Math.abs(t);
    var neutral = isNeutral(i) || (ctx === 'line' && i.ch < 0.26 && (dark ? i.l < 0.45 : i.l > 0.6));
    if (neutral) {
      if (a < 0.98) {
        if (t > 0.5) return { v: tint('text', a) };            /* light-on-dark wash -> text tint */
        if (ctx !== 'bg' || kind === 'scrim') return null;     /* overlays and shadows stay */
        if (i.l < 0.05 && a < 0.5) return { v: 'var(--hb-inset)' };  /* black wash = inset box */
        if (i.l < 0.05) return null;
        if (kind === 'bar' || a > 0.8) return { v: 'var(--hb-bar)', card: true };
        if (kind === 'card' || a > 0.4) return { v: 'var(--hb-card)', card: true };
        return { v: 'var(--hb-inset)' };
      }
      if (ctx === 'text') return { v: t > 0.72 ? 'var(--hb-text)' : 'var(--hb-text2)' };
      if (ctx === 'line') return { v: 'var(--hb-line)' };
      if (ctx === 'accent') return { v: 'var(--hb-primary)' };
      if (kind === 'page') return { v: 'var(--hb-bg)' };
      if (kind === 'input') return { v: 'var(--hb-field)' };
      if (kind === 'bar') return { v: 'var(--hb-bar)', card: true };
      if (kind === 'card' && t < 0.45) return { v: 'var(--hb-card)', card: true };
      if (at < 0.04) return { v: 'var(--hb-inset)' };
      if (t > 0.6) return null;                                 /* bright chip on dark page: leave */
      return { v: tint('text', clamp(0.03 + at * 0.4, 0.05, 0.16)) };
    }
    var role = hueRole(i.h);
    if (a < 0.98) return { v: tint(role, a) };
    if (ctx === 'bg') {
      if (dark ? i.l < 0.3 : i.l > 0.82) return { v: tint(role, 0.2) };   /* tinted note/chip bg */
      return { v: 'var(--hb-' + role + ')', solid: true };
    }
    return { v: 'var(--hb-' + role + ')' };
  }

  var SEM_NAMES = [
    [/^(ok|good|success|live|green|pos|positive)(-?\d)?$/, 'success'],
    [/^(bad|red|danger|err|error|neg|negative)(-?\d)?$/, 'error'],
    [/^(warn|warning|amber)(-?\d)?$/, 'warning'],
    [/^(acc|accent|ac|primary|brand|link)$/, 'primary'],
    [/^(acc|accent|ac|primary)-?2$/, 'accent']
  ];
  function mapVar(name, val, ref) {
    var n = name.slice(2).toLowerCase();
    if (/^hb-/.test(n)) return null;
    var c = parse(val);
    if (!c) return null;
    var i = info(c), neutral = isNeutral(i), dark = ref.b < 0.5;
    var span = ref.t - ref.b, t = span ? (i.l - ref.b) / span : 0, at = Math.abs(t);
    if (n === 'on' || /^(acc|accent|ac|primary)-?(ink|on|fg|text)$|^on-(acc|accent|primary)$/.test(n)) return { v: 'var(--hb-on)' };
    var soft = /(-|^)(soft|tint|wash|bg|bg2|weak)$|soft$/.test(n), base = n.replace(/-?(soft|tint|wash|bg|bg2|weak|ink)$|soft$/, '');
    for (var k = 0; k < SEM_NAMES.length; k++) {
      if (SEM_NAMES[k][0].test(base) && (!neutral || base !== n)) {
        var role = SEM_NAMES[k][1];
        if (/-ink$/.test(n)) return { v: 'var(--hb-text)' };
        if (soft || i.a < 0.98) return { v: tint(role === 'accent' ? 'primary' : role, i.a < 0.98 ? i.a : 0.16) };
        return { v: 'var(--hb-' + role + ')', solid: true };
      }
    }
    if (/-ink$/.test(n)) return { v: 'var(--hb-text)' };
    if (!neutral) return null;                                 /* unknown colorful var (state colors): leave */
    if (i.a < 0.98) return t > 0.5 ? { v: tint('text', i.a) } : null;
    if (/line|border|sep|divid|rule|stroke|outline/.test(n)) return { v: 'var(--hb-line)' };
    if (/^(mut|muted|dim|mu|sub|sec|secondary|faint|hint|txt2|text2|tx2|ink2|subtle)(-?\d)?$/.test(n)) return { v: 'var(--hb-text2)' };
    if (/^(text|txt|tx|fg|fore|ink|c|font-color|text-color)(-?\d)?$/.test(n) && t > 0.3) return { v: t > 0.72 ? 'var(--hb-text)' : 'var(--hb-text2)' };
    if (/field|input|code|well/.test(n)) return { v: 'var(--hb-field)' };
    if (/chip|card-?2|panel-?2|surface-?2|bg-?3|raised|hover|alt|elev/.test(n)) return { v: tint('text', dark ? 0.08 : 0.06) };
    if (/card|panel|surface|sheet|tile|box|pane/.test(n)) return { v: 'var(--hb-card)', card: true };
    if (/^(bg|bg-?[0-2]|background|base|page|canvas|app-bg|ink)$/.test(n) || at < 0.04) return { v: 'var(--hb-bg)' };
    if (t > 0.72) return { v: 'var(--hb-text)' };
    if (t > 0.4) return { v: 'var(--hb-text2)' };
    return { v: tint('text', clamp(0.03 + at * 0.4, 0.05, 0.14)) };
  }

  function refVarNames(v) {
    var out = [], re = /var\(\s*(--[\w-]+)/g, m;
    while ((m = re.exec(v || ''))) out.push(m[1]);
    return out;
  }

  function doStyle(st, sel, scheme) {
    var ref = REFS[scheme], kind = kindOf(sel), names = [], k;
    for (k = 0; k < st.length; k++) names.push(st[k]);
    var solidBg = false, isCard = false;
    names.forEach(function (p) {
      var v = st.getPropertyValue(p), pr = st.getPropertyPriority(p);
      if (p.indexOf('--') === 0) {
        var r = mapVar(p, v, ref);
        pageVars[p] = 1;
        if (r) {
          if (r.card) cardVars[p] = 1;
          if (r.solid) solidVars[p] = 1;
          st.setProperty(p, r.v, pr);
        }
        return;
      }
      var ctx = ctxOf(p);
      if (!ctx || !v) return;
      var nv = v.replace(COLOR_RE, function (tok) {
        var c = parse(tok);
        if (!c) return tok;
        var r = mapColor(c, ctx, ref, kind);
        if (!r) return tok;
        if (ctx === 'bg' && r.solid) solidBg = true;
        if (ctx === 'bg' && r.card) isCard = true;
        return r.v;

  el.className = cls || '';
}
function touch() { dirty = true; status('Unsaved changes', 'warn'); }

function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);

}
const lines = t => t.value.split('\n').map(s => s.trim()).filter(Boolean);
const pretty = k => k.replace(/_/g, ' ');

/* ---------- generic editor for nested data ---------- */
function adder(obj, reserved = {}) {
  const mk = (label, make) => h('button', {
    textContent: label,
    onclick: () => {
      const n = prompt('Name for the new ' + label.replace('+ ', '') + '?');
      if (!n) return;
      const key = slug(n);
      if (!key) return;
      if (Object.prototype.hasOwnProperty.call(reserved, key)) { alert(reserved[key]); return; }
      obj[key] = make();
      touch(); draw();
    }
  });
  return h('div', {className: 'add'},
    mk('+ field', () => ''), mk('+ list', () => []), mk('+ group', () => ({})));
}

function fields(obj, skip = []) {
  let wrap = h('div');
  for (const k of Object.keys(obj)) {
    if (skip.includes(k)) continue;
    const v = obj[k], row = h('div', {className: 'ownf'}), real = wrap;
    wrap.append(row); wrap = row;   // everything for this field goes inside its own box
    wrap.append(h('div', {className: 'hd'},
      h('label', {textContent: pretty(k)}),
      h('button', {className: 'del', textContent: 'Remove', onclick: () => {
        if (confirm('Remove "' + pretty(k) + '"?')) { delete obj[k]; touch(); draw(); }
      }})));

    if (v && typeof v === 'object' && !Array.isArray(v)) {
      wrap.append(h('div', {className: 'grp'}, fields(v), adder(v)));
    } else if (Array.isArray(v)) {
      const simple = v.every(x => x === null || typeof x !== 'object');
      const ta = h('textarea', {
        value: simple ? v.join('\n') : JSON.stringify(v, null, 1),
        oninput: () => {
          if (simple) obj[k] = lines(ta);
          else { try { obj[k] = JSON.parse(ta.value); } catch (e) { return; } }
          touch();
        }
      });
      wrap.append(ta);
      if (simple) wrap.append(h('div', {className: 'meta', textContent: 'One item per line'}));
    } else if (typeof v === 'boolean') {
      wrap.append(h('input', {type: 'checkbox', checked: v,
        onchange: e => { obj[k] = e.target.checked; touch(); }}));
    } else if (typeof v === 'number') {
      wrap.append(h('input', {type: 'number', value: v, step: 'any',
        oninput: e => { obj[k] = e.target.value === '' ? 0 : Number(e.target.value); touch(); }}));
    } else {
      const inp = h('input', {type: 'text', value: v ?? '',
        oninput: e => { obj[k] = e.target.value; touch(); }});
      if (k === 'zone') { inp.setAttribute('list', 'zones'); inp.placeholder = 'zone.work'; }
      if (k === 'birthday') inp.placeholder = '2000-01-15';
      wrap.append(inp);
    }
    if (HINTS[k]) wrap.append(h('div', {className: 'hint', textContent: HINTS[k]}));
    wrap = real;
  }
  return wrap;
}

function card(id, title, body, extra) {
  return h('details', {
    open: open.has(id),
    ontoggle: e => { e.target.open ? open.add(id) : open.delete(id); }
  }, typeof title === 'string' ? h('summary', {textContent: title}) : h('summary', {}, title), body, extra);
}

const asList = v => Array.isArray(v) ? v.map(String).filter(Boolean) : (v == null || v === '' ? [] : [String(v)]);
const mergeUnique = (a, b) => { const out = (a || []).slice(); b.forEach(x => { if (!out.some(y => y.toLowerCase() === x.toLowerCase())) out.push(x); }); return out; };
function profOf(k) {
  const prof = D.profiles[k] = D.profiles[k] || {data: {}, flags: {}};
  prof.data = prof.data || {}; prof.flags = prof.flags || {};
  return prof;
}
/* Profile fields that are the person's own fields (job, hobbies, friends, wake time...): saved under the name they already
   use, so everything that read those fields before keeps working. */
const legacyKeys = fd => [].concat(fd.legacy || []);
const ownKey = (fd, p) => fd.legacy === 'birthday' ? (BIRTHDAY_KEYS.find(b => b in p) || 'birthday') : (legacyKeys(fd).find(x => x in p) || legacyKeys(fd)[0]);
function ownGet(fd, p) {
  const v = p[ownKey(fd, p)];
  if (fd.type === 'tags') return asList(v);
  if (Array.isArray(v)) return v.join(fd.type === 'long' ? '\n' : ', ');
  return v == null ? '' : String(v);
}
function ownSet(fd, p, v) {
  const key = ownKey(fd, p);
  if (emptyVal(v)) { delete p[key]; return; }
  p[key] = (fd.type === 'long' && Array.isArray(p[key])) ? String(v).split('\n').map(x => x.trim()).filter(Boolean) : v;
}

/* ---------- AI fill: the AI Task reads everything saved about a person and fills the profile sections ---------- */
const itemKey = r => String(r.name || r.label || r.item || ((r.make || '') + ' ' + (r.model || '')) || '').trim().toLowerCase();
function mergeField(d, fk, fd, v) {   // adds what is new, never overwrites something already filled in. Returns how many things were added.
  const cur = d[fk];
  if (fd.type === 'tags') { const m = mergeUnique(cur || [], asList(v)); if (m.length === (cur || []).length) return 0; d[fk] = m; return m.length - (cur || []).length; }
  if (fd.type === 'items') {
    const have = new Set((cur || []).map(itemKey)), add = (Array.isArray(v) ? v : []).filter(r => r && !have.has(itemKey(r)));
    if (!add.length) return 0; d[fk] = (cur || []).concat(add); return add.length;
  }
  if (emptyVal(cur)) { d[fk] = v; return 1; }
  return 0;
}
function applyFill(k, p, r, removeOld) {
  const prof = profOf(k); let n = 0;
  for (const [sk, vals] of Object.entries(r.sections || {})) {
    const sec = SCHEMA.find(s => s.key === sk);
    if (!sec) continue;
    const d = prof.data[sk] = prof.data[sk] || {};
    for (const [fk, v] of Object.entries(vals)) {
      const fd = sec.fields.find(f => f.key === fk);
      if (fd && !fd.legacy && !emptyVal(v)) n += mergeField(d, fk, fd, v);
    }
  }
  for (const [fk, v] of Object.entries(r.own_fields || {})) {
    const fd = ownField(fk);
    if (!fd) continue;
    const key = ownKey(fd, p);
    if (Array.isArray(v)) { const m = mergeUnique(asList(p[key]), v); if (m.length !== asList(p[key]).length) { p[key] = m; n++; } }
    else if (emptyVal(p[key])) { p[key] = v; n++; }
  }
  if (removeOld) (r.used_fields || []).forEach(f => { if (f in p && !RESERVED[f]) delete p[f]; });
  return n;
}
const ownField = fk => { for (const s of SCHEMA) for (const f of s.fields) if (f.legacy && legacyKeys(f)[0] === fk) return f; return null; };
const showVal = v => Array.isArray(v) ? v.map(x => typeof x === 'object' ? Object.values(x).filter(Boolean).join(', ') : x).join(' | ') : String(v);
function trimFill(k, p, r) {   // keeps only what applyFill would really add, so the preview never lists things that are already there
  const out = {...r, sections: {}, own_fields: {}}, prof = (D.profiles[k] || {}).data || {};
  for (const [sk, vals] of Object.entries(r.sections || {})) {
    const sec = SCHEMA.find(s => s.key === sk); if (!sec) continue;
    for (const [fk, v] of Object.entries(vals)) {
      const fd = sec.fields.find(f => f.key === fk); if (!fd || fd.legacy || emptyVal(v)) continue;
      const cur = (prof[sk] || {})[fk];
      let nv = v;
      if (fd.type === 'tags') { const have = new Set(asList(cur).map(x => String(x).toLowerCase())); nv = asList(v).filter(x => !have.has(String(x).toLowerCase())); }
      else if (fd.type === 'items') { const have = new Set((cur || []).map(itemKey)); nv = (Array.isArray(v) ? v : []).filter(x => x && !have.has(itemKey(x))); }
      else if (!emptyVal(cur)) nv = null;
      if (!emptyVal(nv)) (out.sections[sk] = out.sections[sk] || {})[fk] = nv;
    }
  }
  for (const [fk, v] of Object.entries(r.own_fields || {})) {
    const fd = ownField(fk); if (!fd) continue;
    const cur = p[ownKey(fd, p)];
    const nv = Array.isArray(v) ? v.filter(x => !asList(cur).map(y => String(y).toLowerCase()).includes(String(x).toLowerCase())) : (emptyVal(cur) ? v : null);
    if (!emptyVal(nv)) out.own_fields[fk] = nv;
  }
  return out;
}
function fillLines(r) {
  const out = [];
  for (const [sk, vals] of Object.entries(r.sections || {})) {
    const sec = SCHEMA.find(s => s.key === sk);
    if (!sec) continue;
    for (const [fk, v] of Object.entries(vals)) {
      const fd = sec.fields.find(f => f.key === fk);
      if (fd && !fd.legacy) out.push(sec.title + ' › ' + fd.label + ': ' + showVal(v));
    }
  }
  for (const [fk, v] of Object.entries(r.own_fields || {})) { const fd = ownField(fk); if (fd) out.push('Your own field › ' + fd.label + ': ' + showVal(v)); }
  return out;
}
function aiFillCard(g, k, p) {
  const box = h('div'), out = h('div'), msg = h('div', {className: 'meta'});
  const rm = h('input', {type: 'checkbox'});
  let result = null;
  const run = async (e, action) => {
    const btns = [...box.querySelectorAll('button.run')]; btns.forEach(b => b.disabled = true);
    msg.textContent = action === 'rules' ? 'Reading what is saved about ' + (p.name || k) + '…' : 'The AI is reading everything saved about ' + (p.name || k) + '… (up to a minute)'; out.replaceChildren();
    const r = await ai({action, group: g, key: k});
    btns.forEach(b => b.disabled = false);
    if (!r.ok) { msg.textContent = r.error; return; }
    result = trimFill(k, p, r); const ls = fillLines(result);
    if (!ls.length) { msg.textContent = r.ai_error ? 'The AI could not answer (' + r.ai_error + ') and nothing new could be filled without it.' : 'Nothing new to add. Everything it found is already filled in.'; return; }
    msg.textContent = (r.ai_error ? 'The AI could not answer (' + r.ai_error + '), so this is only what could be filled without it. ' : '') + 'Here is what it would add (nothing already filled in is overwritten):';
    out.replaceChildren(...ls.map(t => h('div', {className: 'note', textContent: '• ' + t})),
      h('label', {className: 'pickrow'}, rm, 'Also remove the old fields it moved (' + ((r.used_fields || []).map(pretty).join(', ') || 'none') + ')'),
      h('div', {className: 'add'}, h('button', {className: 'pri', textContent: 'Add these to their profile', onclick: () => {
        const n = applyFill(k, p, result, rm.checked); touch(); status('Added ' + n + ' things. Check them, then Save changes.', 'warn'); draw();
      }})));
  };
  const go2 = h('button', {className: 'pri run', textContent: 'Read their info and fill the sections', onclick: e => run(e, 'fill')});
  const go3 = h('button', {className: 'run', textContent: 'Fill from what is saved (no AI)', onclick: e => run(e, 'rules')});
  box.append(h('p', {className: 'note', textContent: 'Fill the sections from what is already saved about this person: name, work, address, anniversary and music need no AI; the AI button also reads the rest (work, likes, family, vehicles, dates). You see the result first, and nothing is saved until you press Save changes.'}), h('div', {className: 'row'}, go3, go2), msg, out);
  return box;
}
let FILLSTOP = false;
async function fillEveryone(btn, action = 'fill') {
  if (btn.dataset.running) { FILLSTOP = true; btn.textContent = 'Stopping…'; return; }
  const all = [];
  for (const g of ['household', 'friends']) for (const k of Object.keys(D[g])) if (D[g][k] && typeof D[g][k] === 'object') all.push([g, k]);
  if (!confirm((action === 'rules' ? 'Fill the profile sections from what is saved for all ' + all.length + ' people (no AI, takes a second)?' : 'Have the AI fill the profile sections for all ' + all.length + ' people? It takes about ' + Math.max(1, Math.round(all.length / 3)) + ' minutes.') + ' It only adds to empty spots, keeps your old fields, and nothing is saved until you press Save changes.')) return;
  btn.dataset.running = '1'; FILLSTOP = false; let done = 0, added = 0, failed = [], aiDown = '';
  for (const [g, k] of all) {
    if (FILLSTOP) break;
    btn.textContent = 'Stop (' + done + ' of ' + all.length + ' done)';
    const r = await ai({action, group: g, key: k});
    if (r.ok) { added += applyFill(k, D[g][k], r, false); if (r.ai_error) aiDown = r.ai_error; } else failed.push((D[g][k].name || k));
    done++;
  }
  delete btn.dataset.running; touch();
  status((action === 'rules' ? 'Filled ' : 'AI filled ') + added + ' things for ' + (done - failed.length) + ' people' + (failed.length ? '. Could not read: ' + failed.join(', ') : '') + (aiDown ? '. The AI answered with an error (' + aiDown + '), so only the no-AI parts were filled' : '') + '. Check them, then Save changes.', failed.length ? 'bad' : 'warn');
  draw();
}

/* ---------- People tab: a grid of people (picture, where they are now); tap one to open everything about them ---------- */
let SCHEMA = [], PERSON = null;
const PICS = {};  // pictures just uploaded, until the page is reloaded
const initial = n => (String(n || '?').trim()[0] || '?').toUpperCase();
const isUrl = v => /^(https?:\/\/|\/)\S+$/.test(String(v || '').trim());
const emptyVal = v => v === '' || v == null || v === false || (Array.isArray(v) && !v.length);

function avatar(url, name, size) {
  const a = h('div', {className: 'avatar ' + (size || '')});
  if (url) {
    const i = h('img', {src: url, alt: ''});
    i.onerror = () => { i.remove(); a.textContent = initial(name); };
    a.append(i);
  } else a.textContent = initial(name);
  return a;
}
function picOf(kind, k, obj, live) {
  const v = String(obj.photo || '').trim();
  if (isUrl(v)) return v;
  if (v) return PICS[kind + '_' + k] || live || '';
  return String(live || '').startsWith('img/') ? '' : (live || '');   // a picture they just removed
}
const personPic = (k, p) => picOf('person', k, p, ((LIVE.people || {})[k] || {}).picture);
const placePic = (k, pl) => picOf('place', k, pl, (LIVE.place_pics || {})[k]);

function shrink(file, max) {
  return new Promise((ok, bad) => {
    const u = URL.createObjectURL(file), i = new Image();
    i.onload = () => {
      const s = Math.min(1, max / Math.max(i.width, i.height)), c = document.createElement('canvas');
      c.width = Math.round(i.width * s); c.height = Math.round(i.height * s);
      c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b => b ? ok(b) : bad(new Error('no picture')), 'image/jpeg', 0.88);
    };
    i.onerror = () => { URL.revokeObjectURL(u); bad(new Error('not a picture')); };
    i.src = u;
  });
}
function closePicSheet() { const o = document.getElementById('picov'); if (o) o.remove(); }
// a sheet to pick a picture: automatic, upload, a link, Home Assistant people, and the images in your www folder
async function openPicSheet(kind, key, obj) {
  closePicSheet();

  const msg = h('div'), grids = h('div', {}, h('div', {className: 'note', textContent: 'Loading pictures…'}));
  const choose = (value, ui) => {
    if (value) { obj.photo = value; if (ui) PICS[kind + '_' + key] = ui; } else delete obj.photo;
    touch(); closePicSheet(); draw();

  const file = h('input', {type: 'file', accept: 'image/*', hidden: true});
  file.onchange = async () => {
    const f = file.files[0];
    if (!f) return;
    msg.replaceChildren(h('div', {className: 'note', textContent: 'Preparing the picture…'}));
    try {
      const blob = await shrink(f, 512);
      const r = await (await fetch('api/photo?kind=' + kind + '&key=' + encodeURIComponent(key),
        {method: 'POST', headers: {'Content-Type': blob.type}, body: blob})).json();
      if (!r.ok) { fail(r.error || 'Could not save the picture.'); return; }
      choose(r.name, r.ui);
    } catch (e) { fail('That picture could not be used.'); }
  };
  const link = h('input', {type: 'text', placeholder: 'or paste a picture link', autocapitalize: 'none', value: isUrl(cur) && !cur.startsWith('/local/') ? cur : ''});
  const tile = (value, label, thumb, ui) => h('button', {className: 'po' + (value === cur ? ' on' : ''), onclick: () => choose(value, ui || thumb)},
    h('div', {className: 'avatar'}, thumb ? h('img', {src: thumb, alt: '', loading: 'lazy', onerror: e => e.target.remove()}) : h('b', {textContent: 'auto'})),
    h('small', {textContent: label}));
  const ov = h('div', {id: 'picov'}, h('div', {className: 'sheetbk', onclick: closePicSheet}),
    h('div', {className: 'sheet'},
      h('h3', {textContent: 'Picture for ' + name}), h('div', {className: 'note', textContent: 'Tap one to use it. You can change it any time.'}), msg,
      h('div', {className: 'add'}, h('label', {className: 'upl'}, 'Upload from this device', file)),
      h('div', {style: 'display:flex;gap:8px;align-items:center;margin-top:10px'}, link, h('button', {style: 'flex:none', textContent: 'Use link', onclick: () => {
        const u = link.value.trim();
        if (!isUrl(u)) { fail('Paste a link that starts with https://'); return; }
        choose(u);
      }})),
      grids, h('div', {className: 'add'}, h('button', {textContent: 'Close', onclick: closePicSheet}))));
  document.body.append(ov);
  let data = {people: [], images: [], www_ok: true};
  try { data = await (await fetch('api/pictures')).json(); } catch (e) { fail('Could not load your pictures.'); }
  if (!document.getElementById('picov')) return;
  const live = kind === 'person' ? ((LIVE.people || {})[key] || {}).picture : '';
  grids.replaceChildren(
    h('div', {className: 'psec', textContent: 'AUTOMATIC'}), h('div', {className: 'pgrid'}, tile('', 'Automatic', '')),
    h('div', {className: 'note', textContent: kind === 'person' ? 'Automatic uses the picture on their Home Assistant person, if they have one.' : 'Automatic means no picture.'}),
    ...(data.people.length ? [h('div', {className: 'psec', textContent: 'HOME ASSISTANT PEOPLE'}), h('div', {className: 'pgrid'}, ...data.people.map(p => tile(p.url, p.name, p.url)))] : []),
    h('div', {className: 'psec', textContent: 'YOUR IMAGES'}),
    data.images.length ? h('div', {className: 'pgrid'}, ...data.images.map(i => tile(i.value, i.name.split('/').pop(), i.url)))
      : h('div', {className: 'note', textContent: data.www_ok ? 'No pictures in your www folder yet. Upload one above.' : 'The add-on cannot see your Home Assistant config folder yet. Update and restart the add-on.'}));
}

/* ---------- Birthday: a date picker (or month and day when the year is unknown) ---------- */
const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function parseBd(v) {   // {y, m, d} (y 0 = no year) from any way it might be written, or null
  const t = String(v || '').trim(); let m;
  if ((m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return {y: +m[1], m: +m[2], d: +m[3]};
  if ((m = t.match(/^(\d{1,2})-(\d{1,2})$/))) return {y: 0, m: +m[1], d: +m[2]};
  if ((m = t.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/))) return {y: m[3] ? (m[3].length === 2 ? (+m[3] > 30 ? 1900 : 2000) + +m[3] : +m[3]) : 0, m: +m[1], d: +m[2]};
  if ((m = t.match(/^([A-Za-z]+)\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s*(\d{4})?$/))) {
    const i = MONTH_NAMES.findIndex(x => x.toLowerCase().slice(0, 3) === m[1].toLowerCase().slice(0, 3));
    if (i >= 0) return {y: +(m[3] || 0), m: i + 1, d: +m[2]};
  }
  return null;
}
const pad2 = n => String(n).padStart(2, '0');
const fmtBd = b => (b.y ? b.y + '-' : '') + pad2(b.m) + '-' + pad2(b.d);
function birthdayWidget(fd, p) {
  const box = h('div'), cur = ownGet(fd, p), first = parseBd(cur), now = () => parseBd(ownGet(fd, p));

  const row = h('div', {className: 'bd2'});

        const b = parseBd(e.target.value); save(b);

    } else {
      const mo = h('select', {}, ...MONTH_NAMES.map((n, i) => h('option', {value: i + 1, textContent: n})));
      const da = h('select', {}, ...Array.from({length: 31}, (_, i) => h('option', {value: i + 1, textContent: i + 1})));
      mo.value = parsed ? parsed.m : 1; da.value = parsed ? parsed.d : 1;

  else box.append(h('div', {className: 'hint', textContent: 'Gives their age, zodiac sign and a countdown to the next birthday.'}));

}

  best_friends: ['Best friends', 'Best friends'], friends: ['Friends', 'Friends'], roommates: ['Roommates', 'Roommates'],

/* ---------- AI help (your Home Assistant AI Task) ---------- */
async function ai(body) {
  try { return await (await fetch('api/ai', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(Object.assign({data: D}, body))})).json(); }
  catch (e) { return {ok: false, error: 'Could not reach the app: ' + e.message}; }
}
const emptyFor = kind => kind === 'list' ? [] : '';
function fieldChips(target, list, msg) {
  return h('div', {className: 'chips'}, list.map(f => h('button', {title: f.why || '', textContent: '+ ' + (f.label || pretty(f.field)), onclick: e => {
    if (!(f.field in target)) target[f.field] = emptyFor(f.kind);
    e.target.remove(); touch(); msg.textContent = 'Added. Fill it in, then Save.';
    setTimeout(draw, 600);
  }})));
}
function aiBox(g, k, p) {
  const box = h('div', {className: 'ha ai'}), out = h('div'), msg = h('div', {className: 'meta'});
  const busy = t => { msg.textContent = t; };
  const needSave = () => false;
  const notes = h('textarea', {placeholder: 'Paste or type notes about ' + (p.name || k) + ', e.g. "Loves the Panthers and Call of Duty, birthday March 3rd, works nights at the hospital"'});
  notes.hidden = true;
  box.append(h('label', {textContent: '✨ AI help'}),
    h('div', {className: 'chips'},
      h('button', {textContent: 'Suggest fields', onclick: async () => {
        if (needSave()) return; busy('Thinking…'); out.replaceChildren();
        const r = await ai({action: 'suggest', group: g, key: k});
        if (!r.ok) { busy(r.error); return; }
        busy(r.fields.length ? 'Tap the ones you want (hover for why):' : 'Nothing to add, they look complete.');
        out.replaceChildren(fieldChips(p, r.fields, msg));
      }}),
      h('button', {textContent: 'Fill from notes', onclick: () => { notes.hidden = !notes.hidden; if (!notes.hidden) notes.focus(); goBtn.hidden = notes.hidden; }}),
      h('button', {textContent: 'Tidy fields', onclick: async () => {
        if (needSave()) return; busy('Looking for duplicates and unclear names…'); out.replaceChildren();
        const r = await ai({action: 'tidy', group: g, key: k});
        if (!r.ok) { busy(r.error); return; }
        const n = Object.keys(r.rename).length + r.remove.length;
        if (!n) { busy('Already tidy. ' + (r.notes || '')); return; }
        busy(r.notes || 'Suggested changes:');
        out.replaceChildren(h('div', {className: 'meta'}, ...Object.entries(r.rename).map(([a, b]) => h('div', {textContent: 'Rename ' + pretty(a) + ' → ' + pretty(b)})),
          ...r.remove.map(a => h('div', {textContent: 'Remove ' + pretty(a) + (p[a] === '' || (Array.isArray(p[a]) && !p[a].length) ? ' (empty)' : ': ' + JSON.stringify(p[a]).slice(0, 60))}))),
          h('div', {className: 'add'}, h('button', {textContent: 'Apply', onclick: () => {
            for (const [a, b] of Object.entries(r.rename)) { if (!(b in p)) p[b] = p[a]; else if (Array.isArray(p[b]) && Array.isArray(p[a])) p[b] = [...new Set([...p[b], ...p[a]])]; delete p[a]; }
            for (const a of r.remove) delete p[a];
            touch(); draw(); status('Tidied. Check it, then Save.', 'warn');
          }})));
      }}),
      h('button', {textContent: 'Gift ideas', onclick: async () => {
        if (needSave()) return; busy('Thinking…');
        const r = await ai({action: 'gifts', group: g, key: k});
        busy(r.ok ? '' : r.error); out.replaceChildren(r.ok ? h('div', {className: 'answer', textContent: r.text}) : '');
      }})),
    notes);
  const goBtn = h('button', {textContent: 'Turn notes into fields', hidden: true, onclick: async () => {
    if (needSave()) return; busy('Reading your notes…'); out.replaceChildren();
    const r = await ai({action: 'notes', group: g, key: k, notes: notes.value});
    if (!r.ok) { busy(r.error); return; }
    const f = r.fields, keys = Object.keys(f);
    if (!keys.length) { busy('Nothing to add from those notes.'); return; }
    busy('Found these. Untick anything wrong, then Add:');
    const pick = {};
    out.replaceChildren(...keys.map(x => { pick[x] = true; const cur = p[x];
      return h('label', {className: 'pickrow'}, h('input', {type: 'checkbox', checked: true, onchange: e => { pick[x] = e.target.checked; }}),
        h('span', {textContent: pretty(x) + ': ' + (Array.isArray(f[x]) ? f[x].join(', ') : typeof f[x] === 'object' ? JSON.stringify(f[x]) : f[x]) + (cur !== undefined && JSON.stringify(cur) !== JSON.stringify(f[x]) ? '  (replaces ' + JSON.stringify(cur).slice(0, 40) + ')' : '')})); }),
      h('div', {className: 'add'}, h('button', {textContent: 'Add', onclick: () => {
        for (const x of keys) if (pick[x]) {
          if (Array.isArray(p[x]) && Array.isArray(f[x])) p[x] = [...new Set([...p[x], ...f[x]])]; else p[x] = f[x];
        }
        notes.value = ''; touch(); draw(); status('Added from notes. Check them, then Save.', 'warn');
      }})));
  }});
  box.append(h('div', {className: 'add'}, goBtn), msg, out);
  return box;
}
function placeAi(k, pl) {
  const msg = h('div', {className: 'meta'}), out = h('div');
  return h('div', {className: 'ha ai'}, h('label', {textContent: '✨ AI help'}),
    h('div', {className: 'chips'}, h('button', {textContent: 'Suggest fields', onclick: async () => {
      msg.textContent = 'Thinking…';
      const r = await ai({action: 'place_fields', key: k});
      if (!r.ok) { msg.textContent = r.error; return; }
      msg.textContent = r.fields.length ? 'Tap the ones you want:' : 'Nothing to add.';
      out.replaceChildren(fieldChips(pl, r.fields, msg));
    }})), msg, out);
}
function askTab() {
  const f = h('div'), q = h('textarea', {placeholder: "e.g. Whose birthday is next? What should I get Sam? Who's into the Panthers? What's missing that the voice assistant could use?"});
  const out = h('div', {className: 'answer'}), msg = h('div', {className: 'meta'});
  const go = async () => {
    msg.textContent = 'Thinking…'; out.textContent = '';
    const r = await ai({action: 'ask', question: q.value});
    msg.textContent = r.ok ? '' : r.error; out.textContent = r.ok ? r.text : '';
  };
  f.append(h('p', {className: 'note', textContent: 'Ask anything about the people, places and music saved here. Your Home Assistant AI Task answers from what is on this page.'}),
    q, h('div', {className: 'chips'}, ...["Whose birthday is next?", "What info is missing for the voice assistant?", "Who likes the same things?", "Summarize the household"].map(t => h('button', {textContent: t, onclick: () => { q.value = t; go(); }}))),
    h('div', {className: 'add'}, h('button', {className: 'pri', textContent: 'Ask', onclick: go})), msg, out);
  return f;
}

/* ---------- shell ---------- */
function go(t) { tab = t; adding = false; if (t !== 'people') PERSON = null; draw(); window.scrollTo(0, 0); }

function draw() {
  if (!D) return;
  const view = tab === 'people' ? people()
    : tab === 'music' ? music()
    : tab === 'places' ? places()
    : tab === 'ask' ? askTab()
    : tab === 'settings' ? h('div')
    : other();
  $('#main').replaceChildren(view);
  $('#settings').hidden = tab !== 'settings';
  document.querySelectorAll('nav button').forEach(b => {
    b.className = b.dataset.t === tab ? 'on' : '';
  });
}

async function loadLive() {
  try { LIVE = await (await fetch('api/preview')).json(); } catch (e) { return; }
  if (!dirty) draw();
}
async function loadEntities() {
  try {
    const r = await (await fetch('api/entities')).json();
    ROLES = r.roles || {}; ENTS = r.entities || [];
    $('#ents').replaceChildren(...ENTS.map(e => h('option', {value: e.id, textContent: e.name})));
    $('#zones').replaceChildren(...ENTS.filter(e => e.id.startsWith('zone.')).map(e => h('option', {value: e.id, textContent: e.name})));
    draw();
  } catch (e) { /* the pickers just stay empty */ }
}

async function saveData() {
  if (!D) return;
  status('Saving...');
  try {
    const r = await fetch('api/data', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(D)
    });
    if (r.ok) { dirty = false; status('Saved ' + new Date().toLocaleTimeString(), 'ok'); loadLive(); }
    else status('Save failed. Check the app log.', 'bad');
  } catch (e) { status('Save failed. Check the app log.', 'bad'); }
}

window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

fetch('api/data').then(r => r.json()).then(d => {
  D = d;
  for (const k of ['household', 'friends', 'music', 'places', 'other', 'profiles']) D[k] = D[k] || {};
  if (!Array.isArray(D.relationships)) D.relationships = [];
  status('Loaded', 'ok');
  draw();
  loadSensors(); loadAiDefault(); loadShuffle();
  loadEntities();
  loadLive();
  setInterval(loadLive, 60000);
  fetch('api/schema').then(r => r.json()).then(sc => { SCHEMA = sc; draw(); }).catch(() => {});
}).catch(() => status('Could not load data. Check the app log.', 'bad'));
</script>
</body>
</html>
