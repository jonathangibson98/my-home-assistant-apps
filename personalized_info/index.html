<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Personalized Info</title>
<style>
:root{
  --bg:#0f172a; --card:#1e293b; --field:#0b1222; --line:#334155;
  --txt:#f1f5f9; --dim:#94a3b8; --acc:#3b82f6; --accsoft:#1d3a6e;
  --red:#991b1b; --warn:#fbbf24; --ok:#4ade80;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
nav{display:flex;gap:6px;padding:10px;position:sticky;top:0;background:var(--bg);z-index:5;
  border-bottom:1px solid var(--line)}
nav button{flex:1;padding:10px 4px}
button{background:var(--line);color:var(--txt);border:0;border-radius:8px;padding:10px 14px;
  font:inherit;font-size:15px;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{
  outline:2px solid var(--acc);outline-offset:2px}
button.on,button.pri{background:var(--acc)}
button.del{background:var(--red);padding:4px 10px;font-size:14px}
button.ghost{background:transparent;border:1px dashed var(--line);color:var(--dim)}
#sensors-panel{max-width:820px;margin:0 auto;padding:10px 10px 0}
main{padding:4px 10px 0;max-width:820px;margin:auto}
h2{margin:22px 0 8px;font-size:17px;font-weight:600;color:var(--dim)}
p.note{color:var(--dim);font-size:14px;margin:12px 0}
details{background:var(--card);border-radius:10px;margin-bottom:8px;padding:12px}
summary{font-weight:600;cursor:pointer}
label{font-size:13px;color:var(--dim);margin:12px 0 4px;display:block}
input[type=text],input[type=number],textarea{
  width:100%;background:var(--field);color:var(--txt);border:1px solid var(--line);
  border-radius:8px;padding:9px;font:inherit}
textarea{min-height:96px;resize:vertical}
select{width:100%;background:var(--field);color:var(--txt);border:1px solid var(--line);
  border-radius:8px;padding:9px;font:inherit;margin-top:6px}
input[type=checkbox]{width:22px;height:22px}
.panel{background:var(--card);border-radius:10px;padding:12px;margin-top:10px}
.panel .add button{font-size:15px;padding:10px 14px}
.grp{border-left:2px solid var(--line);margin-left:6px;padding-left:10px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.add{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.add button{font-size:13px;padding:7px 11px}
.row{margin-top:10px}
.meta{font-size:12px;color:var(--dim);margin-top:6px;word-break:break-all}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:space-between;align-items:center;gap:10px}
#st{font-size:14px;color:var(--dim)}
#st.warn{color:var(--warn)} #st.ok{color:var(--ok)} #st.bad{color:#f87171}
.now{font-weight:400;color:var(--ok);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{font-size:13px;padding:6px 10px;background:var(--accsoft)}
.ha{border-left:2px solid var(--acc);margin:14px 0 4px 6px;padding-left:10px}
.ha .rl{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center;margin-top:8px}
.ha .rl label{margin:0}
.hint{font-size:12px;color:var(--dim);margin-top:6px}
.bday{background:var(--card);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
</style>
</head>
<body>

<section id="sensors-panel"></section>

<nav>
  <button data-t="people" onclick="go('people')">People</button>
  <button data-t="music" onclick="go('music')">Music</button>
  <button data-t="places" onclick="go('places')">Places</button>
  <button data-t="other" onclick="go('other')">Other</button>
</nav>

<main id="main"></main>
<datalist id="ents"></datalist>
<datalist id="zones"></datalist>

<div id="bar">
  <span id="st">Loading...</span>
  <button class="pri" onclick="saveData()">Save changes</button>
</div>

<script>
let D = null, S = null, tab = 'people', dirty = false;
let ROLES = {}, ENTS = [], LIVE = {status: {}, birthdays: [], birthdays_text: '', covered: {}};
const BIRTHDAY_KEYS = ['birthday', 'dob', 'date_of_birth', 'birth_date', 'birthdate'];
const HOME_FIELDS = /^(home|home_?(location|address|town|city|area)|address|lives_?(in|at)?|residence)$/;
let adding = false, newName = '';
const open = new Set();
// Keys with their own editor. They are hidden in the plain fields and can't be added by hand.
const RESERVED = {
  music: 'Music is edited in the Music tab.',
  top_artists: 'Music is edited in the Music tab.',
  places: 'Places are linked in the Places section of the person. Add the places themselves in the Places tab.',
  links: 'Linked entities are set in the Home Assistant section of the person.'
};
// Fields the other add-ons and the AI announcements can use. Shown as quick-add buttons until a person has them.
const QUICK = {
  birthday: ['Birthday', ''], nickname: ['Nickname', ''], say_name_as: ['Say name as (for speech)', ''],
  pronouns: ['Pronouns', ''], favorite_teams: ['Favorite teams', []], games: ['Games they play', []],
  psn_id: ['PSN ID', ''], shows_and_movies: ['Shows and movies', []], work_schedule: ['Work schedule', ''],
  usual_bedtime: ['Usual bedtime', ''], usual_wake_time: ['Usual wake time', '']
};
const HINTS = {
  birthday: '1998-05-06, or 05-06 without the year. Used for birthday announcements and the countdown.',
  dob: 'Used for birthday announcements, the countdown and their age.',
  say_name_as: 'How a voice should say the name, if it gets it wrong (for example "M J").',
  psn_id: 'Their PlayStation Network online ID.',
  favorite_teams: 'One per line, like in Team Tracker (for example Carolina Panthers).',
  usual_bedtime: 'For example 11:30 PM. Sleep Tracker tracks the real thing.'
};
const $ = s => document.querySelector(s);
const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');

function status(text, cls) {
  const el = $('#st');
  el.textContent = text;
  el.className = cls || '';
}
function touch() { dirty = true; status('Unsaved changes', 'warn'); }

function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  Object.assign(e, attrs);
  kids.flat().forEach(k => { if (k) e.append(k); });
  return e;
}
const lines = t => t.value.split('\n').map(s => s.trim()).filter(Boolean);
const pretty = k => k.replace(/_/g, ' ');

/* ---------- generic editor for nested data ---------- */
function adder(obj, reserved = {}) {
  const mk = (label, make) => h('button', {
    textContent: label,
    onclick: () => {
      const n = prompt('Name for the new ' + label.replace('+ ', '') + '?');
      if (!n) return;
      const key = slug(n);
      if (!key) return;
      if (Object.prototype.hasOwnProperty.call(reserved, key)) { alert(reserved[key]); return; }
      obj[key] = make();
      touch(); draw();
    }
  });
  return h('div', {className: 'add'},
    mk('+ field', () => ''), mk('+ list', () => []), mk('+ group', () => ({})));
}

function fields(obj, skip = []) {
  const wrap = h('div');
  for (const k of Object.keys(obj)) {
    if (skip.includes(k)) continue;
    const v = obj[k];
    wrap.append(h('div', {className: 'hd'},
      h('label', {textContent: pretty(k)}),
      h('button', {className: 'del', textContent: 'Remove', onclick: () => {
        if (confirm('Remove "' + pretty(k) + '"?')) { delete obj[k]; touch(); draw(); }
      }})));

    if (v && typeof v === 'object' && !Array.isArray(v)) {
      wrap.append(h('div', {className: 'grp'}, fields(v), adder(v)));
    } else if (Array.isArray(v)) {
      const simple = v.every(x => x === null || typeof x !== 'object');
      const ta = h('textarea', {
        value: simple ? v.join('\n') : JSON.stringify(v, null, 1),
        oninput: () => {
          if (simple) obj[k] = lines(ta);
          else { try { obj[k] = JSON.parse(ta.value); } catch (e) { return; } }
          touch();
        }
      });
      wrap.append(ta);
      if (simple) wrap.append(h('div', {className: 'meta', textContent: 'One item per line'}));
    } else if (typeof v === 'boolean') {
      wrap.append(h('input', {type: 'checkbox', checked: v,
        onchange: e => { obj[k] = e.target.checked; touch(); }}));
    } else if (typeof v === 'number') {
      wrap.append(h('input', {type: 'number', value: v, step: 'any',
        oninput: e => { obj[k] = e.target.value === '' ? 0 : Number(e.target.value); touch(); }}));
    } else {
      const inp = h('input', {type: 'text', value: v ?? '',
        oninput: e => { obj[k] = e.target.value; touch(); }});
      if (k === 'zone') { inp.setAttribute('list', 'zones'); inp.placeholder = 'zone.work'; }
      if (k === 'birthday') inp.placeholder = '1998-05-06';
      wrap.append(inp);
    }
    if (HINTS[k]) wrap.append(h('div', {className: 'hint', textContent: HINTS[k]}));
  }
  return wrap;
}

function card(id, title, body, extra) {
  return h('details', {
    open: open.has(id),
    ontoggle: e => { e.target.open ? open.add(id) : open.delete(id); }
  }, typeof title === 'string' ? h('summary', {textContent: title}) : h('summary', {}, title), body, extra);
}

/* ---------- People tab (no music here) ---------- */
function people() {
  const f = h('div');
  f.append(h('p', {className: 'note', textContent: 'Music is edited in the Music tab and places in the Places tab. Both show up on each person in the sensor. Link someone to their Home Assistant entities and the sensor also says what they are doing right now.'}));
  if (LIVE.birthdays_text) f.append(h('div', {className: 'bday', textContent: '🎂 ' + LIVE.birthdays_text}));
  for (const g of ['household', 'friends']) {
    f.append(h('h2', {textContent: g === 'household' ? 'Household' : 'Friends'}));
    for (const k of Object.keys(D[g])) {
      const p = D[g][k];
      if (!p || typeof p !== 'object') continue;
      const now = (LIVE.status[k] || {}).text;
      const title = h('span', {}, p.name || k, now ? h('span', {className: 'now', textContent: '  ' + now}) : null);
      f.append(card(g + k, title,
        h('div', {}, coveredNote(k, p), fields(p, [...Object.keys(RESERVED), ...Object.keys(covered(k, p))]), quickAdd(p), adder(p, RESERVED), placeLinks(p), haLinks(g, k, p)),
        h('div', {className: 'add'},
          h('button', {className: 'del', textContent: 'Delete person', onclick: () => {
            if (confirm('Delete ' + (p.name || k) + ' and their music?')) {
              delete D[g][k]; delete D.music[k]; touch(); draw();
            }
          }}))));
    }
    f.append(h('div', {className: 'row'},
      h('button', {className: 'ghost', textContent: '+ Add to ' + g, onclick: () => {
        const n = prompt('Name?');
        if (!n || !slug(n)) return;
        D[g][slug(n)] = {name: n};
        open.add(g + slug(n));
        touch(); draw();
      }})));
  }
  return f;
}

/* ---------- fields something better already covers (home location when home is a linked place, age from
   the birthday, a second birthday field) ---------- */
const covered = (k, p) => Object.fromEntries(Object.entries((LIVE.covered || {})[k] || {}).filter(([f]) => f in p));
function coveredNote(k, p) {
  const c = covered(k, p), keys = Object.keys(c);
  if (!keys.length) return null;
  return h('div', {className: 'ha'},
    h('label', {textContent: 'Covered elsewhere'}),
    ...keys.map(f => h('div', {className: 'hint', textContent: pretty(f) + ' (' + String(p[f]) + '): covered by ' + c[f] + '.'})),
    h('div', {className: 'hint', textContent: 'Hidden here and left out of the sensor, so the AI gets the place or birthday instead of a duplicate.'}),
    h('div', {className: 'add'}, h('button', {textContent: 'Remove ' + (keys.length === 1 ? 'it' : 'them'), onclick: () => {
      for (const f of keys) {
        // a home location the home place doesn't have yet becomes that place's address, so nothing is lost
        const home = p.places && p.places.home && D.places[p.places.home];
        if (HOME_FIELDS.test(slug(f)) && home && !String(home.address || '').trim() && String(p[f] || '').trim()) home.address = String(p[f]).trim();
        delete p[f];
      }
      touch(); draw();
    }})));
}

/* ---------- quick-add fields ---------- */
function quickAdd(p) {
  const missing = Object.keys(QUICK).filter(k => !(k in p) && !(k === 'birthday' && BIRTHDAY_KEYS.some(b => b in p)));
  if (!missing.length) return null;
  return h('div', {}, h('label', {textContent: 'Quick add'}),
    h('div', {className: 'chips'}, missing.map(k => h('button', {textContent: '+ ' + QUICK[k][0], onclick: () => {
      p[k] = JSON.parse(JSON.stringify(QUICK[k][1])); touch(); draw();
    }}))));
}

/* ---------- Home Assistant links ---------- */
function haLinks(g, k, p) {
  const box = h('div', {className: 'ha'});
  box.append(h('label', {textContent: 'Home Assistant'}),
    h('div', {className: 'hint', textContent: 'Link their entities so the info sensor says what they are doing right now: where they are, asleep (Sleep Tracker), at work (Work Hours), gaming (PS5 Status), their calendar. Pick from the list or type an entity id.'}));
  const links = (p.links && typeof p.links === 'object') ? p.links : {};
  for (const [role, label] of Object.entries(ROLES)) {
    const inp = h('input', {type: 'text', value: links[role] || '', placeholder: role === 'notify' ? 'notify.mobile_app_...' : 'entity id',
      oninput: e => {
        const v = e.target.value.trim();
        if (!p.links || typeof p.links !== 'object') p.links = {};
        if (v) p.links[role] = v; else delete p.links[role];
        if (!Object.keys(p.links).length) delete p.links;
        touch();
      }});
    inp.setAttribute('list', 'ents');
    box.append(h('div', {className: 'rl'}, h('label', {textContent: label}), inp));
  }
  const msg = h('div', {className: 'meta'});
  box.append(h('div', {className: 'add'}, h('button', {textContent: 'Find automatically', onclick: async () => {
    if (dirty) { msg.textContent = 'Save first, then find.'; return; }
    msg.textContent = 'Looking...';
    try {
      const r = await (await fetch('api/suggest?person=' + encodeURIComponent(k))).json();
      if (!r.ok) { msg.textContent = r.error; return; }
      const n = Object.keys(r.new).length;
      if (!n) { msg.textContent = Object.keys(r.found).length ? 'Everything found is already linked.' : 'Nothing found. Link them by hand.'; return; }
      p.links = Object.assign({}, p.links || {}, r.new);
      touch(); draw();
      status('Found ' + n + ' entit' + (n === 1 ? 'y' : 'ies') + '. Check them, then Save.', 'warn');
    } catch (e) { msg.textContent = 'That failed. Check the app log.'; }
  }})), msg);
  const now = LIVE.status[k];
  if (now && now.text) box.append(h('div', {className: 'hint', textContent: 'Right now: ' + now.text}));
  return box;
}

/* ---------- Place templates ---------- */
const DAYS = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
const blankHours = () => Object.fromEntries(DAYS.map(d => [d, '']));
const TEMPLATES = {
  residence: () => ({
    type: 'Private residence', address: '', zone: '',
    residents: [], pets: [], parking: '', notes: ''
  }),
  business: () => ({
    type: 'Business', category: '', address: '', zone: '', phone: '', website: '',
    hours: blankHours(), features: [], notes: ''
  })
};

/* ---------- Places: links on a person ---------- */
function placeLinks(p) {
  const box = h('div', {className: 'grp'});
  box.append(h('label', {textContent: 'Places'}));
  const links = (p.places && typeof p.places === 'object') ? p.places : {};
  const keys = Object.keys(D.places);
  const optName = k => (D.places[k] && D.places[k].name) || k;
  for (const label of Object.keys(links)) {
    box.append(h('div', {className: 'hd'},
      h('label', {textContent: pretty(label)}),
      h('button', {className: 'del', textContent: 'Remove', onclick: () => {
        delete p.places[label];
        if (!Object.keys(p.places).length) delete p.places;
        touch(); draw();
      }})));
    const sel = h('select', {onchange: e => { p.places[label] = e.target.value; touch(); }});
    const cur = links[label];
    const opts = keys.includes(cur) ? keys : [cur, ...keys];
    for (const k of opts) {
      sel.append(h('option', {value: k, textContent: keys.includes(k) ? optName(k) : k + ' (missing)'}));
    }
    sel.value = cur;
    box.append(sel);
  }
  if (!Object.keys(links).length) {
    box.append(h('div', {className: 'meta', textContent: keys.length ? 'No places linked yet.' : 'Add places in the Places tab first, then link them here.'}));
  }
  box.append(h('div', {className: 'add'}, h('button', {textContent: '+ Link a place', onclick: () => {
    if (!keys.length) { alert('Add a place in the Places tab first.'); return; }
    const n = prompt('What is this place to them? (home, work, hangout...)');
    const label = n ? slug(n) : '';
    if (!label) return;
    if (links[label]) { alert('They already have a "' + pretty(label) + '". Remove it first or use a different name.'); return; }
    if (!p.places || typeof p.places !== 'object') p.places = {};
    p.places[label] = keys[0];
    touch(); draw();
  }})));
  return box;
}

/* ---------- a place's Home Assistant zone ---------- */
function zoneRow(k, pl, here) {
  const box = h('div', {className: 'ha'});
  const inp = h('input', {type: 'text', value: pl.zone || '', placeholder: 'zone.home',
    oninput: e => { const v = e.target.value.trim(); if (v) pl.zone = v; else delete pl.zone; touch(); }});
  inp.setAttribute('list', 'zones');
  const name = (ENTS.find(e => e.id === pl.zone) || {}).name;
  const msg = h('div', {className: 'hint'});
  box.append(h('label', {textContent: 'Home Assistant zone'}), inp,
    h('div', {className: 'hint', textContent: pl.zone
      ? (name ? 'Linked to ' + name + '. ' : 'That zone isn\'t in Home Assistant (yet). ') + 'When someone linked on the People tab is in this zone, their status says they\'re at ' + (pl.name || k) + '.'
      : 'Link the zone for this place so "at ' + (pl.name || k) + '" shows up when someone is there, instead of the zone\'s own name.'}),
    h('div', {className: 'add'}, h('button', {textContent: 'Find matching zone', onclick: async () => {
      msg.textContent = 'Looking...';
      try {
        const r = await (await fetch('api/zone_suggest?place=' + encodeURIComponent(k) + '&name=' + encodeURIComponent(pl.name || k))).json();
        if (!r.ok) { msg.textContent = r.error; return; }
        if (!r.zone) { msg.textContent = 'No zone looks like this place. Pick one from the list, or make one with Zone Creator.'; return; }
        pl.zone = r.zone; touch(); draw();
        status('Linked ' + (pl.name || k) + ' to ' + (r.name || r.zone) + '. Check it, then Save.', 'warn');
      } catch (e) { msg.textContent = 'That failed. Check the app log.'; }
    }})), msg);
  if (here.length) box.append(h('div', {className: 'hint', textContent: 'Here now: ' + here.join(', ')}));
  return box;
}

/* ---------- Places tab (the only place addresses are edited) ---------- */
function places() {
  const f = h('div');
  f.append(h('p', {className: 'note', textContent: 'Add places here (houses, workplaces, hangouts) and they save to places.yaml. Then link them to people on the People tab. The sensor shows the full place info on each person. Set a place\'s zone to its Home Assistant zone (the one Work Hours, Location Hub or Zone Creator use) so they line up.'}));
  const users = k => {
    const out = [];
    for (const g of ['household', 'friends']) {
      for (const pk of Object.keys(D[g])) {
        const p = D[g][pk];
        if (!p || typeof p !== 'object' || !p.places) continue;
        for (const label of Object.keys(p.places)) {
          if (p.places[label] === k) out.push((p.name || pk) + ' (' + pretty(label) + ')');
        }
      }
    }
    return out;
  };
  for (const k of Object.keys(D.places)) {
    const pl = D.places[k];
    if (!pl || typeof pl !== 'object') continue;
    const used = users(k);
    const here = ((LIVE.places || {})[k] || {}).people_here || [];
    const title = h('span', {}, pl.name || k, here.length ? h('span', {className: 'now', textContent: '  ' + here.join(', ') + ' here'}) : null);
    f.append(card('p' + k, title,
      h('div', {},
        h('div', {className: 'meta', textContent: 'Used by: ' + (used.length ? used.join(', ') : 'nobody yet')}),
        zoneRow(k, pl, here),
        fields(pl, ['zone']), adder(pl, {zone: 'The zone is set at the top of the place.'})),
      h('div', {className: 'add'},
        pl.hours ? null : h('button', {textContent: '+ Weekly hours', onclick: () => {
          pl.hours = blankHours(); touch(); draw();
        }}),
        h('button', {className: 'del', textContent: 'Delete place', onclick: () => {
          if (!confirm('Delete ' + (pl.name || k) + '? People linked to it will lose that link.')) return;
          delete D.places[k];
          for (const g of ['household', 'friends']) {
            for (const p of Object.values(D[g])) {
              if (!p || !p.places) continue;
              for (const label of Object.keys(p.places)) if (p.places[label] === k) delete p.places[label];
              if (!Object.keys(p.places).length) delete p.places;
            }
          }
          touch(); draw();
        }}))));
  }
  if (adding) {
    const nm = h('input', {type: 'text', value: newName, placeholder: 'Name of the place',
      oninput: e => { newName = e.target.value; }});
    setTimeout(() => nm.focus(), 0);
    const pick = kind => {
      const name = newName.trim();
      const key = slug(name);
      if (!key) { alert('Type a name for the place first.'); return; }
      if (D.places[key]) { alert('That place already exists.'); return; }
      D.places[key] = {name, ...TEMPLATES[kind]()};
      adding = false; newName = '';
      open.add('p' + key);
      touch(); draw();
    };
    f.append(h('div', {className: 'panel'},
      h('label', {textContent: 'Name of the place'}), nm,
      h('label', {textContent: 'What kind of place is it?'}),
      h('div', {className: 'add'},
        h('button', {className: 'pri', textContent: 'Private residence', onclick: () => pick('residence')}),
        h('button', {className: 'pri', textContent: 'Business', onclick: () => pick('business')}),
        h('button', {className: 'ghost', textContent: 'Cancel', onclick: () => { adding = false; newName = ''; draw(); }})),
      h('div', {className: 'meta', textContent: 'Each one starts with fields that fit. Leave anything blank and it stays out of the sensor. You can still add or remove fields after.'})));
  } else {
    f.append(h('div', {className: 'row'},
      h('button', {className: 'ghost', textContent: '+ Add place', onclick: () => { adding = true; draw(); }})));
  }
  return f;
}

/* ---------- Music tab (the only place music is edited) ---------- */
function music() {
  const f = h('div');
  f.append(h('p', {className: 'note', textContent: 'Everything music lives here and saves to music.yaml. Each person\'s genres and artists also appear on that person in the info sensor. The profile name has to match the person\'s key (jon, mj, and so on).'}));
  const isPerson = k => (D.household[k] && typeof D.household[k] === 'object')
                     || (D.friends[k] && typeof D.friends[k] === 'object');
  const ids = ['shared', ...Object.keys(D.household), ...Object.keys(D.friends), ...Object.keys(D.music)]
    .filter((x, i, a) => a.indexOf(x) === i)
    .filter(k => D.music[k] || isPerson(k));
  for (const k of ids) {
    const m = D.music[k] || {genres: [], artists: []};
    const p = D.household[k] || D.friends[k] || {};
    const box = (lbl, key) => {
      const ta = h('textarea', {
        value: (m[key] || []).join('\n'),
        oninput: () => { m[key] = lines(ta); D.music[k] = m; touch(); }
      });
      return [h('label', {textContent: lbl}), ta];
    };
    const count = (m.artists || []).length;
    const name = k === 'shared' ? 'Shared favorites' : (p.name || k);
    const del = D.music[k]
      ? h('div', {className: 'add'},
          h('button', {className: 'del', textContent: 'Delete music profile', onclick: () => {
            if (confirm('Delete the music profile for ' + name + '?')) {
              delete D.music[k]; touch(); draw();
            }
          }}))
      : null;
    f.append(card('m' + k, name + ' (' + count + ' artist' + (count === 1 ? '' : 's') + ')',
      h('div', {}, ...box('Genres, one per line', 'genres'), ...box('Artists, one per line', 'artists')),
      del));
  }
  f.append(h('div', {className: 'row'},
    h('button', {className: 'ghost', textContent: '+ Add music profile', onclick: () => {
      const n = prompt('Name for this profile (a person or a group)?');
      if (!n || !slug(n)) return;
      D.music[slug(n)] = {genres: [], artists: []};
      open.add('m' + slug(n));
      touch(); draw();
    }})));
  return f;
}

/* ---------- Sensors section (top of page) ---------- */
let sensorsOpen = true;

function sensorsPanel() {
  const box = $('#sensors-panel');
  if (!S) { box.replaceChildren(h('p', {className: 'note', textContent: 'Loading sensors...'})); return; }
  const body = h('div');
  for (const k of ['info', 'music']) {
    const x = S[k];
    body.append(
      h('label', {textContent: k === 'info' ? 'Info sensor name' : 'Music sensor name'}),
      h('input', {type: 'text', value: x.name, oninput: e => { x.name = e.target.value; }}),
      h('div', {className: 'meta', textContent: 'Entity ID: ' + x.entity_id + '  |  Unique ID: ' + x.unique_id}));
  }
  body.append(
    h('p', {className: 'note', textContent: 'Mode: ' + S.mode + '. Renaming changes the display name only. The entity ID stays as it was created. To change it, use Settings, Entities, then the sensor.'}),
    h('button', {className: 'pri', textContent: 'Save names', onclick: saveNames}));
  box.replaceChildren(h('details', {
    open: sensorsOpen,
    ontoggle: e => { sensorsOpen = e.target.open; }
  }, h('summary', {textContent: 'Sensors'}), body));
}

async function loadSensors() {
  try {
    const r = await fetch('api/settings');
    S = await r.json();
  } catch (e) {
    S = null;
    $('#sensors-panel').replaceChildren(h('p', {className: 'note', textContent: 'Could not load sensor settings. Check the app log.'}));
    return;
  }
  sensorsPanel();
}

async function saveNames() {
  try {
    const r = await fetch('api/settings', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({info: S.info.name, music: S.music.name})
    });
    if (r.ok) status('Names saved ' + new Date().toLocaleTimeString(), 'ok');
    else status('Saving names failed', 'bad');
  } catch (e) { status('Saving names failed', 'bad'); }
  await loadSensors();
}

/* ---------- Other tab ---------- */
function other() {
  const f = h('div');
  const keys = Object.keys(D.other);
  if (!keys.length) {
    f.append(h('p', {className: 'note', textContent: 'Nothing here. Sections that are not household, friends, or music show up in this tab.'}));
    return f;
  }
  for (const k of keys) {
    const o = D.other[k];
    if (o && typeof o === 'object' && !Array.isArray(o)) {
      f.append(card('o' + k, pretty(k), h('div', {}, fields(o), adder(o))));
    } else {
      const ta = h('textarea', {
        value: JSON.stringify(o, null, 1),
        oninput: () => { try { D.other[k] = JSON.parse(ta.value); touch(); } catch (e) {} }
      });
      f.append(card('o' + k, pretty(k), h('div', {}, ta)));
    }
  }
  return f;
}

/* ---------- shell ---------- */
function go(t) { tab = t; adding = false; draw(); window.scrollTo(0, 0); }

function draw() {
  if (!D) return;
  const view = tab === 'people' ? people()
    : tab === 'music' ? music()
    : tab === 'places' ? places()
    : other();
  $('#main').replaceChildren(view);
  document.querySelectorAll('nav button').forEach(b => {
    b.className = b.dataset.t === tab ? 'on' : '';
  });
}

async function loadLive() {
  try { LIVE = await (await fetch('api/preview')).json(); } catch (e) { return; }
  if (!dirty) draw();
}
async function loadEntities() {
  try {
    const r = await (await fetch('api/entities')).json();
    ROLES = r.roles || {}; ENTS = r.entities || [];
    $('#ents').replaceChildren(...ENTS.map(e => h('option', {value: e.id, textContent: e.name})));
    $('#zones').replaceChildren(...ENTS.filter(e => e.id.startsWith('zone.')).map(e => h('option', {value: e.id, textContent: e.name})));
    draw();
  } catch (e) { /* the pickers just stay empty */ }
}

async function saveData() {
  if (!D) return;
  status('Saving...');
  try {
    const r = await fetch('api/data', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(D)
    });
    if (r.ok) { dirty = false; status('Saved ' + new Date().toLocaleTimeString(), 'ok'); loadLive(); }
    else status('Save failed. Check the app log.', 'bad');
  } catch (e) { status('Save failed. Check the app log.', 'bad'); }
}

window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

fetch('api/data').then(r => r.json()).then(d => {
  D = d;
  for (const k of ['household', 'friends', 'music', 'places', 'other']) D[k] = D[k] || {};
  status('Loaded', 'ok');
  draw();
  loadSensors();
  loadEntities();
  loadLive();
  setInterval(loadLive, 60000);
}).catch(() => status('Could not load data. Check the app log.', 'bad'));
</script>
</body>
</html>
