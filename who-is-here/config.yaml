name: "Who's Here"
version: "1.0.0"
slug: whos_here
description: "Pick who to track, where they can be, and publish everybody's location to Home Assistant"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:account-group
panel_title: "Who's Here"
homeassistant_api: true
services:
  - mqtt:want
options:
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
schema:
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
