<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who's Here</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:14px; font-family:-apple-system,Roboto,sans-serif; background:#0d0d0d; color:#eee; }
  h2 { margin:22px 0 8px; font-size:15px; text-transform:uppercase; letter-spacing:.08em; color:#9aa; }
  .card { background:#1a1a2e; border-radius:12px; padding:12px; margin-bottom:8px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .loc { color:#7ddc8a; font-weight:600; }
  .sub { color:#889; font-size:12px; }
  input, select, button, textarea { font-size:16px; border-radius:8px; border:1px solid #334; background:#12122a; color:#eee; padding:9px; }
  input, select { width:100%; box-sizing:border-box; margin:4px 0; }
  button { background:#3b4cca; border:none; cursor:pointer; padding:9px 14px; }
  button.x { background:#5a2030; padding:6px 10px; }
  .chip { display:inline-flex; align-items:center; gap:6px; background:#25254a; border-radius:20px; padding:6px 12px; margin:3px 3px 3px 0; }
  .chip span { cursor:pointer; color:#f88; }
  textarea { width:100%; height:220px; box-sizing:border-box; font-family:monospace; font-size:12px; }
  label { font-size:12px; color:#9aa; }
</style>
</head>
<body>

<h2>People</h2>
<div id="people"></div>

<div class="card">
  <label>Add a person</label>
  <input id="newName" placeholder="Name (Jon, Nova, Derek...)">
  <select id="newMode" onchange="modeChanged()">
    <option value="tracker">Tracked automatically (phone / person entity)</option>
    <option value="manual">Manual (I pick where they are)</option>
  </select>
  <select id="newEntity"></select>
  <button onclick="addPerson()">Add</button>
</div>

<h2>Places you can pick from</h2>
<div class="card">
  <div id="places"></div>
  <div class="row">
    <input id="newPlace" placeholder="New place (Gym, Mom's, Work...)">
    <button onclick="addPlace()">Add</button>
  </div>
</div>

<h2>Settings</h2>
<div class="card">
  <label>Sensor name (this becomes sensor.whatever_you_type)</label>
  <input id="sname">
  <label>Check trackers every (seconds, min 10)</label>
  <input id="interval" type="number" min="10">
  <button onclick="saveSettings()">Save settings</button>
</div>

<h2>Dashboard card</h2>
<div class="card">
  <button onclick="genCard()">Generate card YAML</button>
  <textarea id="cardbox" placeholder="Tap generate, copy, paste into a Manual card on your dashboard" readonly></textarea>
  <button onclick="copyCard()">Copy</button>
</div>

<script>
let S = {cfg: {people: [], places: []}, locs: {}};
let ENT = [];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  const ct = r.headers.get('content-type') || '';
  return ct.includes('json') ? r.json() : r.text();
}

async function load() {
  S = await api('api/state');
  ENT = await api('api/entities');
  render();
}

function renderPeople() {
  const c = S.cfg;
  $('people').innerHTML = c.people.map((p, i) => {
    const loc = S.locs[p.id] || 'Unknown';
    let body;
    if (p.mode === 'manual') {
      body = `<select onchange="setLoc('${esc(p.id)}', this.value)">` +
        c.places.map(pl => `<option ${pl === p.location ? 'selected' : ''}>${esc(pl)}</option>`).join('') +
        `</select>`;
    } else {
      body = `<div class="loc">${esc(loc)}</div><div class="sub">${esc(p.entity)}</div>`;
    }
    return `<div class="card"><div class="row"><b>${esc(p.name)}</b>
      <button class="x" onclick="delPerson(${i})">Remove</button></div>${body}</div>`;
  }).join('') || '<div class="sub">Nobody yet. Add someone below.</div>';
}

function render() {
  const c = S.cfg;
  renderPeople();
  $('places').innerHTML = c.places.map((p, i) =>
    `<div class="chip">${esc(p)} <span onclick="delPlace(${i})">&#10005;</span></div>`).join('');

  $('sname').value = c.sensor_name || '';
  $('interval').value = c.interval || 30;

  $('newEntity').innerHTML = ENT.map(e => `<option value="${esc(e.id)}">${esc(e.name)} (${esc(e.id)})</option>`).join('');
  modeChanged();
}

function modeChanged() {
  $('newEntity').style.display = $('newMode').value === 'tracker' ? '' : 'none';
}

async function saveCfg() {
  await api('api/config', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(S.cfg)});
  await load();
}

async function addPerson() {
  const name = $('newName').value.trim();
  if (!name) return alert('Type a name first.');
  const mode = $('newMode').value;
  const p = {name, mode};
  if (mode === 'tracker') {
    p.entity = $('newEntity').value;
    if (!p.entity) return alert('No person/device_tracker entities found. Use Manual instead.');
  } else {
    p.location = S.cfg.places[0];
  }
  S.cfg.people.push(p);
  $('newName').value = '';
  await saveCfg();
}

async function delPerson(i) {
  if (!confirm('Remove ' + S.cfg.people[i].name + '?')) return;
  S.cfg.people.splice(i, 1);
  await saveCfg();
}

async function addPlace() {
  const v = $('newPlace').value.trim();
  if (!v) return;
  S.cfg.places.push(v);
  $('newPlace').value = '';
  await saveCfg();
}

async function delPlace(i) {
  S.cfg.places.splice(i, 1);
  await saveCfg();
}

async function setLoc(id, location) {
  await api('api/set', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id, location})});
  await load();
}

async function saveSettings() {
  S.cfg.sensor_name = $('sname').value;
  S.cfg.interval = parseInt($('interval').value || '30');
  await saveCfg();
  alert('Saved.');
}

async function genCard() {
  $('cardbox').value = await api('api/card');
}

function copyCard() {
  const box = $('cardbox');
  box.select();
  try { navigator.clipboard.writeText(box.value); } catch (e) { document.execCommand('copy'); }
}

load();
setInterval(() => { api('api/state').then(s => { S = s; renderPeople(); }).catch(() => {}); }, 20000);
</script>
</body>
</html>
