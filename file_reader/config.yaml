name: "File Reader"
description: "Web UI and MQTT file manager for Home Assistant sensors, automations, and text logging."
version: "1.0.1"
slug: "file_reader"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
ingress: true
ingress_port: 8099
panel_icon: mdi:file-document-edit-outline
services:
  - mqtt:need
options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
schema:
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str?
  mqtt_password: str?
schema_version: 1
