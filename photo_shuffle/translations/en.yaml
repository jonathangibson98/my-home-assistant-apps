configuration:
  photo_paths:
    name: Allowed photo paths
    description: Folders the add-on may read. Shuffles can only use folders inside these. Must start with /media, /share, /homeassistant or /addon_configs.
  formats:
    name: Picture formats
    description: Which picture types to include. jpg covers .jpg and .jpeg.
  max_dimension:
    name: Max image size (px)
    description: Longest side of the picture sent to Home Assistant. Larger photos are scaled down.
  jpeg_quality:
    name: JPEG quality
    description: Quality of the published JPEG (30 to 100).
  mqtt_host:
    name: MQTT host (optional)
    description: Leave empty to use the Mosquitto add-on automatically.
  mqtt_port:
    name: MQTT port (optional)
    description: Defaults to 1883.
  mqtt_username:
    name: MQTT username (optional)
    description: Only needed with a manual MQTT broker.
  mqtt_password:
    name: MQTT password (optional)
    description: Only needed with a manual MQTT broker.
