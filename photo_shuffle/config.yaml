name: Photo Shuffle
version: "2.0.0"
slug: photo_shuffle
description: Shuffle pictures from any number of folders, each exposed as a Home Assistant image entity. Manage shuffles from a web UI.
url: "https://github.com/jonathangibson98/my-home-assistant-apps"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:image-multiple
panel_title: Photo Shuffle
map:
  - media:ro
  - share:ro
  - homeassistant_config:ro
  - all_addon_configs:ro
services:
  - mqtt:want
options:
  photo_paths:
    - /media
    - /share
  formats:
    - jpg
    - png
    - webp
  max_dimension: 1920
  jpeg_quality: 85
schema:
  photo_paths:
    - "match(^/(media|share|homeassistant|addon_configs)(/.*)?$)"
  formats:
    - "list(jpg|png|webp|gif|bmp|tiff)"
  max_dimension: "int(320,4096)"
  jpeg_quality: "int(30,100)"
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
