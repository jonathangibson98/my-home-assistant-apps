name: "Mobile File Manager & Samba"
description: "A mobile-optimized file manager with folder uploads and native Samba share integration."
version: "2.5.4"
slug: "mobile_file_manager"
init: false
arch:
  - aarch64
startup: application
boot: auto
hassio_api: true
ingress: true
ingress_port: 8080
panel_icon: mdi:file-multiple
panel_title: "Files"
ports:
  445/tcp: 445
  139/tcp: 139
ports_description:
  445/tcp: Samba File Share
  139/tcp: Samba NetBIOS
options:
  samba_username: "samba_user"
  samba_password: "changeme"
  filebrowser_username: "admin"
  filebrowser_password: "ChangeMe12345!"
  root_access: false
  hide_from_filebrowser: []
  hide_from_samba: []
schema:
  samba_username: "str"
  samba_password: "password"
  filebrowser_username: "str"
  filebrowser_password: "password"
  root_access: bool
  hide_from_filebrowser:
    - str
  hide_from_samba:
    - str
map:
  - config:rw
  - share:rw
  - media:rw
  - backup:rw
  - ssl:rw
  - addons:rw
  - all_addon_configs:rw
