configuration:
  hide_from_filebrowser:
    name: Hide from File Browser
    description: >-
      Files/folders to hide AND block in the web UI. One per line. Use a full
      path (/config/secrets.yaml), a name matched anywhere (.storage), or
      wildcards (*.db).
  hide_from_samba:
    name: Hide from Samba
    description: >-
      Names to hide in Samba shares (secrets.yaml, .storage, *.db). Samba only
      matches names, not full paths, so this hides that name everywhere.
