name: "Samba Slideshow Generator"
description: "Connects to a remote Samba share, runs a WebUI slideshow, and outputs a dynamic updating image file."
version: "1.0.0"
slug: "samba_slideshow"
init: false
arch:
  - aarch64
  - amd64
startup: services
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: WebUI for Slideshow Control
schema:
  samba_host: str
  samba_share: str
  samba_folder: str
  username: str
  password: password
  interval_seconds: int
options:
  samba_host: "192.168.1.50"
  samba_share: "media"
  samba_folder: "photos"
  username: "admin"
  password: ""
  interval_seconds: 30
