name: Person Profiles
version: "0.2.1"
slug: person_profiles
image: "ghcr.io/jonathangibson98/{arch}-addon-person_profiles"
description: A web page to fill in everything about each person, plus a profile sensor per person (their info, linked entities, dates, optional AI summary)
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true

# One sidebar entry: the page where you fill in each person's profile.
ingress: true
panel_icon: "mdi:account-details"
panel_title: "Person Profiles"
options:
  people: []
  update_interval_seconds: 60
  name_matching: true
  include_unavailable: false
  max_entities_in_sensor: 60
  max_entities_for_ai: 150
  exclude_domains:
    - update
    - button
    - scene
    - event
    - tts
    - stt
  exclude_entity_patterns: []
  person_extras: []
  ai_task_entity: ""
  conversation_agent: ""
  ai_interval_minutes: 60
  ai_extra_prompt: ""
  log_level: info
schema:
  people:
    - str
  update_interval_seconds: int(10,3600)
  name_matching: bool
  include_unavailable: bool
  max_entities_in_sensor: int(5,300)
  max_entities_for_ai: int(10,500)
  exclude_domains:
    - str
  exclude_entity_patterns:
    - str
  person_extras:
    - person: str
      entities:
        - str
  ai_task_entity: str?
  conversation_agent: str?
  ai_interval_minutes: int(0,1440)
  ai_extra_prompt: str?
  log_level: list(debug|info|warning|error)
