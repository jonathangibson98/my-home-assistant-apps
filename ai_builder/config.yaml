name: "AI Builder"
version: "2.0.0"
slug: ai_builder
description: "Type what you want in plain English and your ai_task entity builds it: automations, scenes, scripts, templates, helpers, AppDaemon apps, pyscripts, blueprints, add-ons, plus AI voice announcements."
url: "https://github.com/jonathangibson98/ha-ai-builder"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-happy-outline
panel_title: AI Builder
homeassistant_api: true
map:
  - homeassistant_config:rw
  - all_addon_configs:rw
  - addons:rw
options:
  ai_task_entity: ai_task.gemini_pro_ai_task
  request_timeout: 180
  template_file: ai_builder/package.yaml
  appdaemon_apps_dir: /addon_configs/a0d7b954_appdaemon/apps
  ha_token: ""
  ha_url: "http://homeassistant:8123"
  helper_ai_task_entity: ""
schema:
  ai_task_entity: str
  request_timeout: int(30,600)
  template_file: str
  appdaemon_apps_dir: str
  ha_token: password?
  ha_url: str?
  helper_ai_task_entity: str?
