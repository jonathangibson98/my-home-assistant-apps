<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Builder</title>
<style>
  :root{
    --ink:#0d0d0d; --panel:#16162a; --panel2:#1d1d36; --line:#2c2c4d;
    --text:#ecebf5; --dim:#9a9ab8; --accent:#8ea2ff; --ok:#7ee0b0; --bad:#ff8a8a; --warn:#ffcf70;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:linear-gradient(160deg,var(--ink),#1a1a2e) fixed; color:var(--text);
    font:16px/1.5 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;
    padding:env(safe-area-inset-top,0) 14px calc(env(safe-area-inset-bottom,0) + 40px);
  }
  main{max-width:720px;margin:0 auto}
  h1{font-size:1.5rem;margin:18px 0 2px;letter-spacing:-.01em}
  .sub{color:var(--dim);margin:0 0 14px;font-size:.9rem}
  .tabs{display:flex;gap:6px;margin:0 0 14px}
  .tab{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--dim);font:inherit}
  .tab.on{background:var(--panel2);color:var(--text);border-color:var(--accent)}
  textarea,input,select{
    width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:12px;padding:12px;font:inherit;font-size:16px;
  }
  textarea{min-height:120px;resize:vertical}
  textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--dim);font:inherit;font-size:.9rem}
  .chip.on{background:var(--accent);color:#0d0d1a;border-color:var(--accent);font-weight:600}
  label.small{display:block;color:var(--dim);font-size:.85rem;margin:12px 0 6px}
  button.go{
    width:100%;margin-top:14px;padding:14px;border-radius:12px;border:0;background:var(--accent);
    color:#0d0d1a;font:inherit;font-weight:700;
  }
  button:disabled{opacity:.5}
  button.ghost{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:.9rem}
  button.make{padding:10px 16px;border-radius:10px;border:0;background:var(--ok);color:#06241a;font:inherit;font-weight:700;font-size:.95rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}
  .card.banner{border-color:var(--warn)}
  .card.error{border-color:var(--bad)}
  .badge{display:inline-block;font-size:.8rem;padding:2px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--accent);margin-bottom:6px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .warn{color:var(--warn);margin:4px 0;font-size:.9rem}
  .bad{color:var(--bad)} .good{color:var(--ok)} .dim{color:var(--dim)}
  pre{background:#0b0b16;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font:13px/1.45 ui-monospace,Menlo,monospace;margin:8px 0 0;white-space:pre}
  details summary{cursor:pointer;color:var(--dim);margin-top:10px}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:8px}
  @keyframes s{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
  .li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .li:last-child{border-bottom:0}
</style>
</head>
<body>
<main>
  <h1>AI Builder</h1>
  <p class="sub" id="sub">Say what you want. Your AI task entity builds it.</p>
  <div id="banners"></div>

  <div class="tabs">
    <button class="tab on" data-tab="build">Build</button>
    <button class="tab" data-tab="mine">Made so far</button>
  </div>

  <section id="build">
    <textarea id="req" placeholder="Examples: When the entry temp passes 76 and someone is home, run the fans 20 minutes. / A Movie Night scene. / An AppDaemon app that texts me when the garage is open 10 minutes. / A pyscript that logs my daily energy use."></textarea>

    <div class="chips" id="kinds"></div>

    <label class="small" for="target">Change something that already exists (optional)</label>
    <select id="target"><option value="">No, make something new</option></select>

    <button class="go" id="go">Build it</button>
    <div id="out"></div>
  </section>

  <section id="mine" hidden></section>
</main>

<script>
const $ = s => document.querySelector(s);
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) { if (k != null) e.append(k.nodeType ? k : document.createTextNode(k)); }
  return e;
}
async function api(path, body) {
  const opts = body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : undefined;
  try {
    const r = await fetch(new URL("api/" + path, document.baseURI), opts);
    return await r.json();
  } catch (e) { return {error: "Couldn't reach the add-on: " + e.message}; }
}

const KINDS = [["auto","Let AI decide"],["automation","Automation"],["scene","Scene"],["script","Script"],["template","Template sensor"],["helper","Helper"],["appdaemon","AppDaemon app"],["pyscript","Pyscript"],["blueprint","Blueprint"],["addon","Add-on"]];
const KIND_LABEL = {automation:"Automation", scene:"Scene", script:"Script", template:"Template entity", helper:"Helper", appdaemon:"AppDaemon app", pyscript:"Pyscript", blueprint:"Blueprint", addon:"Add-on", answer:"Answer"};
let kind = "auto", current = null, targets = [];

function renderChips() {
  const box = $("#kinds"); box.replaceChildren();
  for (const [k, label] of KINDS)
    box.append(el("button", {class: "chip" + (k === kind ? " on" : ""), onclick: () => { kind = k; renderChips(); }}, label));
}

async function init() {
  renderChips();
  const s = await api("status");
  const b = $("#banners");
  if (s.entity) $("#sub").textContent = "Using " + s.entity + (s.version ? "  ·  HA " + s.version : "");
  if (!s.ha_ok) b.append(el("div", {class: "card banner"}, "Can't talk to Home Assistant yet. Give it a minute and reload."));
  if (s.ha_ok && !s.entity_found)
    b.append(el("div", {class: "card banner"}, "I can't find " + s.entity + ". Fix the name in the add-on's Configuration tab."));
  if (!s.package_included) {
    const f = s.template_file || "ai_builder/package.yaml";
    const snippet = "homeassistant:\n  packages:\n    ai_builder: !include " + f;
    b.append(el("div", {class: "card banner"},
      el("strong", {}, "One-time setup for template sensors"),
      el("p", {class: "dim"}, "Automations, scripts and helpers work right now. Template sensors need this added to configuration.yaml, then a Home Assistant restart. If you already have a packages: section, just add the last line under it. If you use !include_dir_named on a packages folder, set the add-on's template_file option to a file inside that folder (like packages/ai_builder.yaml) and skip this."),
      el("pre", {}, snippet)));
  }
  targets = await api("targets");
  const sel = $("#target");
  if (Array.isArray(targets)) targets.forEach((t, i) => sel.append(el("option", {value: i}, `${t.kind}: ${t.name}`)));
}

function chosenTarget() {
  const v = $("#target").value;
  return v === "" ? null : {kind: targets[v].kind, id: targets[v].id};
}

function busy(msg) { $("#out").replaceChildren(el("div", {class: "card"}, el("span", {class: "spin"}), msg)); }

async function generate(feedback) {
  const request = $("#req").value.trim();
  if (!request) { $("#req").focus(); return; }
  $("#go").disabled = true;
  busy(feedback ? "Revising..." : "Thinking. Gemini can take a while, give it up to a minute or two...");
  const body = {request, kind, target: chosenTarget()};
  if (feedback && current) { body.previous = {summary: current.summary, items: current.items.map(i => ({kind: i.kind, id: i.id, summary: i.summary, config: i.config}))}; body.feedback = feedback; }
  const res = await api("generate", body);
  $("#go").disabled = false;
  if (res.error) {
    const c = el("div", {class: "card error"}, el("strong", {class: "bad"}, "That didn't work"), el("p", {}, res.error));
    if (res.raw) c.append(el("details", {}, el("summary", {}, "What the AI said"), el("pre", {}, res.raw)));
    $("#out").replaceChildren(c); return;
  }
  current = res; renderResult();
}

function itemCard(it, idx) {
  const card = el("div", {class: "card"});
  const title = it.config.alias || it.config.name || it.config.slug || it.config.filename || (it.kind === "answer" ? "" : "Untitled");
  card.append(el("span", {class: "badge"}, KIND_LABEL[it.kind] || it.kind));
  if (title) card.append(el("div", {}, el("strong", {}, title)));
  if (it.kind === "answer") { card.append(el("p", {style: "white-space:pre-wrap"}, it.config.text || it.summary)); return card; }
  if (it.summary) card.append(el("p", {class: "dim", style: "margin:6px 0"}, it.summary));
  const c = it.checks || {};
  if (c.preview != null) card.append(el("div", {class: "good"}, "Right now this would show: " + c.preview));
  if (c.error) card.append(el("div", {class: "bad"}, "Template problem: " + c.error));
  for (const n of c.notes || []) card.append(el("div", {class: "warn"}, "Heads up: " + n));
  if (c.unknown && c.unknown.length) card.append(el("div", {class: "warn"}, "Not found in your Home Assistant: " + c.unknown.join(", ")));
  card.append(el("details", {}, el("summary", {}, "See the code / config"), el("pre", {}, it.yaml || "")));
  const status = el("div", {style: "margin-top:10px"});
  const btn = el("button", {class: "make", onclick: () => make(it, btn, status)}, it.edit_id || (it.kind === "template" && it.config.unique_id && targets.some(t => t.id === it.config.unique_id)) ? "Save changes" : "Create");
  const copy = el("button", {class: "ghost", onclick: async () => { try { await navigator.clipboard.writeText(it.yaml); copy.textContent = "Copied"; } catch (e) { copy.textContent = "Long-press the config to copy"; } }}, "Copy config");
  card.append(el("div", {class: "row"}, btn, copy), status);
  it._btn = btn; it._status = status;
  return card;
}

async function make(it, btn, status, overwrite) {
  btn.disabled = true; status.replaceChildren(el("span", {class: "spin"}), "Creating...");
  const r = await api("create", {overwrite: !!overwrite, item: {kind: it.kind, id: it.id, edit_id: it.edit_id, config: it.config}});
  if (r.ok) {
    btn.textContent = "Done";
    const msg = el("div", {class: "good"}, "Done" + (r.entity ? ": " + r.entity : "") + ".");
    status.replaceChildren(msg);
    if (r.note) status.append(el("div", {class: "dim"}, r.note));
    if (r.needs_setup) status.append(el("div", {class: "warn"}, "It won't show up until you add the one-time packages line (banner at the top) and restart Home Assistant."));
    return true;
  }
  btn.disabled = false;
  if (r.exists) {
    status.replaceChildren(el("div", {class: "warn"}, r.error + " Overwriting keeps a backup copy of the old file."),
      el("div", {class: "row"}, el("button", {class: "ghost", onclick: () => make(it, btn, status, true)}, "Overwrite it")));
    return false;
  }
  status.replaceChildren(el("div", {class: "bad"}, "That failed: " + r.error),
    el("div", {class: "row"}, el("button", {class: "ghost", onclick: () => { $("#fix").value = "Home Assistant rejected it with this error, please fix it: " + r.error; refine(); }}, "Ask AI to fix it")));
  return false;
}

function renderResult() {
  const out = $("#out"); out.replaceChildren();
  if (current.summary) out.append(el("div", {class: "card"}, el("strong", {}, "What I built"), el("p", {style: "margin:6px 0 0"}, current.summary)));
  for (const w of current.warnings || []) out.append(el("div", {class: "warn"}, "Heads up: " + w));
  current.items.forEach((it, i) => out.append(itemCard(it, i)));
  const makeable = current.items.filter(i => i.kind !== "answer");
  if (makeable.length > 1)
    out.append(el("button", {class: "go", onclick: async (e) => {
      e.target.disabled = true;
      const order = {helper:0, template:1, scene:2, script:2, pyscript:3, appdaemon:3, automation:4, blueprint:5, addon:5};
      for (const it of [...makeable].sort((a, b) => order[a.kind] - order[b.kind])) { if (!(await make(it, it._btn, it._status))) break; }
      e.target.disabled = false;
    }}, "Create everything"));
  out.append(el("div", {class: "card"},
    el("label", {class: "small", for: "fix"}, "Not quite right? Say what to change"),
    el("input", {id: "fix", placeholder: "Only run on weekdays, and use the Entry fan instead"}),
    el("div", {class: "row"}, el("button", {class: "ghost", onclick: refine}, "Revise"))));
}

function refine() { const f = $("#fix").value.trim(); if (f) generate(f); }

async function renderMine() {
  const box = $("#mine"); box.replaceChildren(el("div", {class: "dim"}, "Loading..."));
  const d = await api("mine"); box.replaceChildren();
  const t = el("div", {class: "card"}, el("strong", {}, "Template entities I manage"));
  if (!d.templates.length) t.append(el("p", {class: "dim"}, "None yet."));
  for (const x of d.templates)
    t.append(el("div", {class: "li"}, el("span", {}, x.name, el("span", {class: "dim"}, "  " + x.platform)),
      el("button", {class: "ghost", onclick: async () => { if (confirm("Delete " + x.name + "?")) { await api("delete_template", {id: x.id}); renderMine(); } }}, "Delete")));
  box.append(t);
  const h = el("div", {class: "card"}, el("strong", {}, "Recently created"));
  if (!d.history.length) h.append(el("p", {class: "dim"}, "Nothing yet."));
  for (const x of d.history) h.append(el("div", {class: "li"}, el("span", {}, x.name || x.entity, el("div", {class: "dim"}, (KIND_LABEL[x.kind] || x.kind) + (x.entity ? " · " + x.entity : ""))), el("span", {class: "dim"}, x.time)));
  box.append(h);
}

document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b));
  $("#build").hidden = b.dataset.tab !== "build"; $("#mine").hidden = b.dataset.tab !== "mine";
  if (b.dataset.tab === "mine") renderMine();
}));
$("#go").addEventListener("click", () => generate());
init();
</script>
</body>
</html>
