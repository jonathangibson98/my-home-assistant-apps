<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creator &amp; AI Builder</title>
<style>
  :root{--bg:#141413;--bar:#1d1d36;--line:#2c2c4d;--tx:#ecebf5;--dim:#9a9ab8;--ac:#8ea2ff;--acx:#0d0d1a;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 ui-rounded,system-ui,-apple-system,sans-serif}
  body{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top,0px)}
  nav{display:flex;gap:6px;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
  nav button{flex:1 0 auto;padding:10px 14px;white-space:nowrap;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--dim);font:inherit;font-weight:600}
  nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
  #frames{flex:1;position:relative;min-height:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
  iframe[hidden]{display:none}
</style>
</head>
<body>
<nav>
  <button id="b-builder" data-t="builder">Build</button>
  <button id="b-announcements" data-t="announcements">Announcements</button>
  <button id="b-svg" data-t="svg">SVG Maker</button>
  <button id="b-backup" data-t="backup">Backup</button>
</nav>
<div id="frames">
  <iframe id="f-builder" title="AI Builder" hidden></iframe>
  <iframe id="f-announcements" title="Announcement Maker" hidden></iframe>
  <iframe id="f-svg" title="SVG Maker" hidden></iframe>
  <iframe id="f-backup" title="Backup" hidden></iframe>
</div>
<script>
const TABS = ["builder", "announcements", "svg", "backup"];
function show(t) {
  if (!TABS.includes(t)) t = "builder";
  for (const k of TABS) {
    const f = document.getElementById("f-" + k);
    if (k === t && !f.getAttribute("src")) f.setAttribute("src", k);  /* load each page the first time it is opened, then keep it alive */
    f.hidden = k !== t;
    document.getElementById("b-" + k).classList.toggle("on", k === t);
  }
  try { localStorage.setItem("aib_tab", t); } catch (e) {}
  try { history.replaceState(null, "", "#" + t); } catch (e) {}
}
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => show(b.dataset.t)));
let start = location.hash.slice(1);
if (!TABS.includes(start)) { try { start = localStorage.getItem("aib_tab"); } catch (e) {} }
show(start);
</script>
</body>
</html>
