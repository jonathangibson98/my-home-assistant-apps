configuration:
  mqtt_host:
    name: MQTT host (optional)
    description: Leave empty to use the Mosquitto add-on automatically.
  mqtt_port:
    name: MQTT port (optional)
    description: Only used with an MQTT host. Defaults to 1883.
  mqtt_username:
    name: MQTT username (optional)
    description: Only used with an MQTT host.
  mqtt_password:
    name: MQTT password (optional)
    description: Only used with an MQTT host.
  log_level:
    name: Log level
    description: How chatty the add-on log is. Use debug when troubleshooting.
  log_pyicloud:
    name: Log Apple library debug output
    description: Turns on the Apple library's own debug logging. Leave off unless troubleshooting, because it can include sensitive request details.
