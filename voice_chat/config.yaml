name: Voice Chat
version: "1.2.0"
slug: voice_chat
image: "ghcr.io/jonathangibson98/{arch}-addon-voice_chat"
description: Hands-free voice conversation with any Home Assistant AI agent, answered out loud on the speaker you choose
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:microphone-message
panel_title: Voice Chat
homeassistant_api: true
map:
  - ssl:ro
ports:
  8443/tcp: null
ports_description:
  8443/tcp: Direct HTTPS page (only starts when a password is set)
options:
  conversation_agent: conversation.home_assistant
  media_player: ""
  tts_entity: ""
  stt_entity: ""
  language: ""
  hands_free: true
  silence_ms: 1200
  volume: 0
  password: ""
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  conversation_agent: str
  media_player: str
  tts_entity: str
  stt_entity: str?
  language: str?
  hands_free: bool
  silence_ms: int(400,5000)
  volume: float(0,1)
  password: password?
  certfile: str
  keyfile: str
