name: "Team Tracker Lite"
version: "0.1.0"
slug: team_tracker_lite
description: "One lightweight sports sensor. Pick any team from a menu."
url: "https://github.com/vasqued2/ha-teamtracker"
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:scoreboard
panel_title: "Team Tracker"
services:
  - "mqtt:want"
options:
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  idle_minutes: 10
  live_seconds: 15
  publish_team_selector: false
schema:
  mqtt_host: "str?"
  mqtt_port: port
  mqtt_username: "str?"
  mqtt_password: "password?"
  idle_minutes: "int(1,60)"
  live_seconds: "int(5,120)"
  publish_team_selector: bool
