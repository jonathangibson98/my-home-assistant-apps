<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Work Hours</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #111827; color: #e5e7eb;
         margin: 0 auto; padding: 16px; max-width: 760px; }
  h1 { font-size: 22px; }
  h2 { font-size: 16px; margin: 24px 0 8px; color: #93c5fd; }
  .card { background: #1f2937; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  label { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid #374151; }
  label:last-child { border: 0; }
  input[type=checkbox] { width: 20px; height: 20px; }
  .zones { margin: 6px 0 0 20px; padding-left: 10px; border-left: 2px solid #374151; }
  .zones .hint { color: #9ca3af; font-size: 13px; padding: 4px 0; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 12px 18px;
           font-size: 16px; width: 100%; margin-top: 10px; }
  .big { font-size: 28px; font-weight: 700; }
  .row { display: flex; gap: 16px; }
  .row > div { flex: 1; }
  .muted { color: #9ca3af; font-size: 13px; }
  .live { color: #34d399; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  td, th { padding: 4px; text-align: left; }
  .err { background: #7f1d1d; padding: 10px; border-radius: 8px; display: none; }
</style>
</head>
<body>
<h1>⏱ Work Hours</h1>
<div id="err" class="err"></div>

<h2>People and their work zones</h2>
<div class="muted">Tick a person to track them, then tick the zones that count as work for that person.</div>
<div id="people"></div>

<button id="save">Save</button>

<h2>Hours</h2>
<div id="status"></div>
<div class="muted" id="info"></div>

<script>
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

let first = true;

function buildPeople(d) {
  const box = document.getElementById('people');
  box.innerHTML = '';
  if (!d.people.length) { box.appendChild(el('div', 'muted', 'No person entities found.')); return; }
  const cfg = {};
  d.settings.people.forEach(p => { cfg[p.id] = p; });

  d.people.forEach(p => {
    const card = el('div', 'card');
    const l = el('label');
    const c = document.createElement('input');
    c.type = 'checkbox'; c.className = 'track'; c.value = p.id;
    c.checked = !!cfg[p.id];
    l.appendChild(c);
    l.appendChild(el('b', null, p.name));
    card.appendChild(l);

    const zbox = el('div', 'zones');
    zbox.style.display = c.checked ? 'block' : 'none';
    if (!d.zones.length) zbox.appendChild(el('div', 'hint', 'No zones found.'));
    d.zones.forEach(z => {
      const zl = el('label');
      const zc = document.createElement('input');
      zc.type = 'checkbox'; zc.className = 'zonebox'; zc.value = z.id;
      zc.checked = !!(cfg[p.id] && cfg[p.id].zones.includes(z.id));
      zl.appendChild(zc);
      zl.appendChild(el('span', null, z.name));
      zbox.appendChild(zl);
    });
    c.onchange = () => { zbox.style.display = c.checked ? 'block' : 'none'; };
    card.appendChild(zbox);
    box.appendChild(card);
  });
}

function render(d) {
  const e = document.getElementById('err');
  e.textContent = d.error || '';
  e.style.display = d.error ? 'block' : 'none';

  if (first) { buildPeople(d); first = false; }

  const box = document.getElementById('status');
  box.innerHTML = '';
  if (!d.status.length) box.appendChild(el('div', 'muted', 'Pick at least one person and one zone for them, then hit Save.'));
  d.status.forEach(p => {
    const c = el('div', 'card');
    c.appendChild(el('div', null, p.name));
    c.appendChild(el('div', 'muted', 'Work zones: ' + (p.zones.length ? p.zones.join(', ') : 'none picked')));
    c.appendChild(el('div', 'muted live', p.live ? '● Clocked in at ' + p.live.zone + ' since ' + p.live.since : '○ Not at a work zone'));
    const row = el('div', 'row');
    const a = el('div'); a.appendChild(el('div', 'big', p.today.toFixed(2) + ' h')); a.appendChild(el('div', 'muted', 'Today'));
    const b = el('div'); b.appendChild(el('div', 'big', p.week.toFixed(2) + ' h')); b.appendChild(el('div', 'muted', 'This week (Mon-Sun)'));
    row.appendChild(a); row.appendChild(b); c.appendChild(row);
    c.appendChild(el('div', 'muted', 'File: ' + p.file));
    if (p.recent.length) {
      const t = el('table');
      const h = el('tr');
      ['Date', 'Zone', 'In', 'Out', 'Hrs'].forEach(x => h.appendChild(el('th', null, x)));
      t.appendChild(h);
      p.recent.forEach(r => {
        const tr = el('tr');
        [r.date, r.zone, r.start, r.end, r.hours].forEach(x => tr.appendChild(el('td', null, x)));
        t.appendChild(tr);
      });
      c.appendChild(t);
    }
    box.appendChild(c);
  });

  const i = d.info;
  document.getElementById('info').textContent =
    'Saving to ' + i.folder + ' | Keeping ' + (i.keep_days ? i.keep_days + ' days' : 'forever') +
    ' | Grace ' + i.grace + ' min | Ignoring visits under ' + i.min + ' min';
}

async function load() {
  const r = await fetch('api/state');
  render(await r.json());
}

document.getElementById('save').onclick = async () => {
  const people = [];
  document.querySelectorAll('#people .card').forEach(card => {
    const t = card.querySelector('.track');
    if (!t.checked) return;
    const zones = [...card.querySelectorAll('.zonebox:checked')].map(x => x.value);
    people.push({ id: t.value, zones });
  });
  await fetch('api/settings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ people })
  });
  const b = document.getElementById('save');
  b.textContent = 'Saved ✓';
  setTimeout(() => b.textContent = 'Save', 2000);
  load();
};

load();
setInterval(load, 60000);
</script>
</body>
</html>
